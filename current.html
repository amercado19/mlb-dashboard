*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);background-image:radial-gradient(rgba(10,49,97,.06) 1px,transparent 1px);background-size:18px 18px;}
header{padding:20px 16px 0;max-width:1100px;margin:0 auto}

.meta{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.meta .rf{font-family:var(--mono);background:var(--panel);border:2px solid var(--txt);color:var(--txt);padding:4px 10px;border-radius:8px;cursor:pointer;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;box-shadow:2px 2px 0 rgba(44,34,24,.18)}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
nav button{background:var(--panel);border:2px solid var(--txt);color:var(--txt);padding:7px 15px;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;font-family:var(--mono);box-shadow:2px 2px 0 rgba(44,34,24,.18);transition:.08s}
nav button.active{background:var(--accent2);color:#fdf8ec;border-color:var(--txt)}
nav button:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 rgba(44,34,24,.22)}
main{max-width:1100px;margin:0 auto;padding:0 16px 60px}
section{display:none}section.active{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
@media(max-width:880px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;box-shadow:var(--card-sh);overflow:hidden;margin-bottom:14px}
.card-h{background:var(--accent);color:#fdf8ec;text-transform:uppercase;letter-spacing:1px;font-weight:700;font-size:13px;padding:10px 14px;font-family:var(--mono);display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-h .t{font-size:11px;opacity:.85;font-weight:400}
.card-b{padding:13px 14px}
.tlogo{width:22px;height:22px;object-fit:contain;vertical-align:middle}
.teams{display:flex;flex-direction:column;gap:8px;margin-bottom:11px}
.team{display:flex;align-items:center;gap:9px}
.abbr{font-family:var(--mono);font-weight:700;font-size:13px;min-width:46px}
.team .nm{font-size:12.5px;flex:1;color:var(--muted)}
.team .rs{font-family:var(--mono);font-weight:700;font-size:18px;margin-left:auto}
.team.fav .abbr{color:var(--accent)}
.probbar{display:flex;height:9px;border-radius:5px;overflow:hidden;border:1px solid var(--line);margin:6px 0 4px}
.probbar i{display:block;height:100%}
.probrow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-bottom:10px}
.pickline{font-family:var(--mono);font-size:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px}
.pickline b{font-size:13px}
.wind{display:flex;gap:6px;justify-content:space-around;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px;margin:8px 0;font-family:var(--mono)}
.wz{display:flex;flex-direction:column;align-items:center;font-size:9px;color:var(--muted)}
.wza{font-size:15px;line-height:1}.wzm{font-weight:700;color:var(--txt)}
.subrow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:6px;flex-wrap:wrap;gap:6px}
.kv{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px dotted var(--line)}
.kv .k{color:var(--muted)}.kv .v{font-family:var(--mono);font-weight:700}
.sp{font-size:12px;color:var(--muted);margin:8px 0 2px}
.sp b{color:var(--txt);font-family:var(--sans);font-weight:700}
.arse{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px}
.badge{font-family:var(--mono);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:2px 6px;border-radius:5px;display:inline-block;line-height:1.5}
.b-strong{background:rgba(19,128,134,.18);color:var(--accent)}
.b-lean{background:rgba(217,154,7,.20);color:var(--gold)}
.b-pass{background:rgba(138,119,82,.16);color:var(--muted)}
.b-rank{background:rgba(232,99,42,.16);color:var(--accent2)}
.b-over{background:rgba(19,128,134,.16);color:var(--accent)}
.b-under{background:rgba(204,70,49,.16);color:var(--lose)}
.b-win{background:rgba(19,128,134,.18);color:var(--accent)}
.b-loss{background:rgba(204,70,49,.18);color:var(--lose)}
.prop-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.prop-tabs button{font-family:var(--mono);font-size:11px;font-weight:700;text-transform:uppercase;background:var(--panel);border:1.5px solid var(--line);border-radius:7px;padding:5px 11px;cursor:pointer;letter-spacing:.5px}
.prop-tabs button.on{background:var(--accent);color:#fdf8ec;border-color:var(--accent)}
.prow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:none}
.prow .rk{font-family:var(--mono);font-weight:700;color:var(--muted);font-size:11px;width:24px}
.hs{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--panel2);border:1.5px solid var(--line)}
.prow .pnm{flex:1;font-size:13px;font-weight:500;cursor:pointer}
.prow .pnm:hover{color:var(--accent2);text-decoration:underline}
.prow .ptm{font-family:var(--mono);font-size:11px;color:var(--muted);width:40px}
.prow .pmetric{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--accent);min-width:46px;text-align:right}
.unit{font-size:9px;color:var(--muted);font-weight:400}
.leg{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
.leg:last-child{border-bottom:none}
.leg .ln{font-family:var(--mono);font-weight:700;color:var(--muted);width:22px}
.leg .ld{flex:1;font-size:13px}.leg .lp{font-family:var(--mono);font-weight:700;color:var(--accent)}
.note{font-size:11.5px;color:var(--muted);padding:10px 14px;line-height:1.5}
.empty{font-family:var(--mono);font-size:12px;color:var(--muted);padding:20px;text-align:center}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kbox{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;box-shadow:var(--card-sh);padding:12px;text-align:center}
.kbox .kv2{font-family:var(--mono);font-weight:700;font-size:22px}
.kbox .kl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.kpos .kv2{color:var(--accent)}.kneg .kv2{color:var(--lose)}
details.pl-day{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;box-shadow:var(--card-sh);margin-bottom:8px;padding:9px 13px}
details.pl-day summary{cursor:pointer;font-family:var(--mono);font-size:13px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pl-legs{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
.pl-leg{font-size:12px;padding:2px 0}
.calrow{display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px}
.calrow .cbucket{width:70px;color:var(--muted)}
.caltrack{flex:1;height:8px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;position:relative}
.caltrack i{position:absolute;height:100%;border-radius:5px}

#mxOverlay{display:none;position:fixed;inset:0;background:rgba(44,34,24,.55);z-index:9998;overflow-y:auto;padding:22px 12px}

.mx-h2{font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#fdf8ec;background:var(--accent);margin:16px -2px 8px;padding:6px 10px;border-radius:6px;font-weight:700}
.mx-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1.5px solid var(--line);padding-bottom:10px}
.mx-bat,.mx-pit{display:flex;align-items:center;gap:8px}.mx-pit{flex-direction:row-reverse;text-align:right}
.mx-nm{font-family:var(--mono);font-size:15px;color:var(--txt);font-weight:700}
.mx-sub{font-size:10px;color:var(--muted);font-family:var(--mono)}
.mx-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:780px){.mx-cols{grid-template-columns:1fr}}
.mx-grade{text-align:center;margin:10px 0}
.mx-gcirc{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:90px;height:90px;border-radius:50%;border:3px solid var(--accent);background:var(--panel2)}
.mx-gletter{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--accent)}
.mx-thesis{font-size:11.5px;color:var(--txt);margin-top:8px;line-height:1.45}
.mx-bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:11px}
.mx-blab{width:120px;color:var(--muted);flex:0 0 120px;font-family:var(--mono);font-size:10px}
.mx-btrack{flex:1;height:8px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.mx-bfill{height:100%;background:var(--accent);border-radius:5px}
.mx-bval{width:60px;text-align:right;color:var(--txt);font-family:var(--mono);font-weight:700;flex:0 0 60px}

.leg-od{width:60px;font-family:var(--mono);font-weight:700;text-align:center;border:1.5px solid var(--line);border-radius:6px;padding:2px 4px;background:var(--panel);color:var(--txt)}

.tprm{color:var(--lose);font-weight:800;cursor:pointer;font-family:var(--mono);margin-left:6px}

.prop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-bottom:14px}
.psq{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;box-shadow:var(--card-sh);padding:14px 8px;text-align:center;cursor:pointer;aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:center;transition:.08s}
.psq:hover{transform:translate(-1px,-1px)}
.psq.on{background:var(--accent2);color:#fdf8ec;border-color:var(--txt)}
.psq .ic{font-size:26px}
.psq .lb{font-family:var(--mono);font-weight:700;font-size:12px;text-transform:uppercase;margin-top:6px;letter-spacing:.5px}
.psq .ct{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:3px}

.gprops{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.gprops summary{cursor:pointer;font-family:var(--mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--accent)}

.byo{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.byoin{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;gap:3px;letter-spacing:.5px}
.byoin input{width:52px;font-family:var(--mono);font-weight:700;font-size:14px;text-align:center;border:1.5px solid var(--line);border-radius:7px;padding:4px;background:var(--panel);color:var(--txt)}
.sgptag{font-family:var(--mono);font-size:10px;color:var(--accent);text-transform:uppercase;margin:8px 0 2px;font-weight:700;letter-spacing:.5px}
.tppay{font-family:var(--mono);font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:10px 0;line-height:1.5}
.evf{font-family:var(--mono);font-size:9px;font-weight:800;color:var(--lose);margin-left:4px}

.luok{color:#1b9e4b;font-weight:800;font-family:var(--mono);margin-left:4px}
</style>

<script>
var DATA_URL="";
var D={}; try{ D=JSON.parse(document.getElementById('bb-data').textContent); }catch(e){ D={}; }
var MODEL_DATA=D; /* alias so the ported modal works unchanged */
var liveGames={};
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmtTime(iso){try{return new Date(iso).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});}catch(e){return '';}}
var TEAMS={108:['LAA','#BA0021'],109:['AZ','#A71930'],110:['BAL','#DF4601'],111:['BOS','#BD3039'],112:['CHC','#0E3386'],113:['CIN','#C6011F'],114:['CLE','#00385D'],115:['COL','#333366'],116:['DET','#0C2340'],117:['HOU','#EB6E1F'],118:['KC','#004687'],119:['LAD','#005A9C'],120:['WSH','#AB0003'],121:['NYM','#002D72'],133:['ATH','#003831'],134:['PIT','#27251F'],135:['SD','#2F241D'],136:['SEA','#0C2C56'],137:['SF','#FD5A1E'],138:['STL','#C41E3A'],139:['TB','#092C5C'],140:['TEX','#003278'],141:['TOR','#134A8E'],142:['MIN','#002B5C'],143:['PHI','#E81828'],144:['ATL','#CE1141'],145:['CWS','#27251F'],146:['MIA','#00A3E0'],147:['NYY','#0C2340'],158:['MIL','#12284B']};
var IDBYABBR={}; for(var k in TEAMS)IDBYABBR[TEAMS[k][0]]=k;
function teamLogo(abbr){var id=IDBYABBR[abbr];return id?'<img class="tlogo" src="https://midfield.mlbstatic.com/v1/team/'+id+'/spots/32" onerror="this.style.display=\'none\'" alt="">':'';}
function tb(abbr){return teamLogo(abbr);}
function hs(pid,small){return pid?'<img class="hs" src="https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:67:current.png/w_80,q_auto:best/v1/people/'+pid+'/headshot/67/current" onerror="this.style.display=\'none\'" alt="">':'';}
function rate10fn(rows,valFn){var vals=rows.map(valFn).filter(function(v){return v!=null;});if(!vals.length)return function(){return '—';};var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);return function(v){if(v==null)return '—';if(mx===mn)return '7.5';return (1+9*(v-mn)/(mx-mn)).toFixed(1);};}
function ratePill(r){var n=parseFloat(r);var c=isNaN(n)?'b-pass':n>=8?'b-strong':n>=6.5?'b-lean':'b-pass';return '<span class="badge '+c+'">'+r+'</span>';}
function formBadge(f){if(!f||f==='NEUTRAL')return '';var m={HOT:['#0a1f14','#4dc870'],WARM:['#1a1200','#e8b040'],COLD:['#0a1424','#5aaaff'],ICE:['#0a1424','#8fc0ff']};var x=m[f];if(!x)return '';return '<span class="badge" title="Team form / momentum (R71: last-10 record + streak) — a capped tiebreaker on the moneyline, not a driver." style="background:'+x[0]+';color:'+x[1]+';margin-left:2px">'+esc(f)+'</span>';}
function teamsOf(gc){var p=(gc.game||'').split('@');return {away:(gc.away_sp&&gc.away_sp.team)||p[0]||'AWY',home:(gc.home_sp&&gc.home_sp.team)||p[1]||'HOM'};}
function gameLabelByPk(pk){var c=(D.gameCards||[]).filter(function(x){return x.gamePk===pk;})[0];if(c&&c.game)return c.game;var m=(D.ml||[]).filter(function(x){return x.gamePk===pk;})[0];return m?(m.away+'@'+m.home):'';}
function legDesc(l){var d=l.desc||'';if((l.betType==='over'||l.betType==='under')){var g=gameLabelByPk(l.gamePk);if(g&&d.indexOf(g)<0)d=g+' '+d;}return d;}
function tierBadge(t){t=(t||'').toUpperCase();var c=t==='STRONG'?'b-strong':t==='LEAN'?'b-lean':'b-pass';return '<span class="badge '+c+'">'+esc(t||'—')+'</span>';}
function handBadge(t){if(!t)return '';var c=t==='L'?'b-loss':'b-strong';return '<span class="badge '+c+'">'+esc(t)+'HP</span>';}
function spTierBadge(tier){if(!tier)return '';var t=(''+tier).toUpperCase();var c=(t.indexOf('ELITE')>=0||t.indexOf('GOOD')>=0)?'b-strong':(t.indexOf('POOR')>=0||t.indexOf('BELOW')>=0||t.indexOf('BAD')>=0)?'b-loss':'b-pass';return '<span class="badge '+c+'">'+esc(tier)+'</span>';}
function windArrows(z){if(!z||!z.length)return '';var A={out:['⬆','var(--accent)'],in:['⬇','var(--lose)'],cross:['⬌','var(--draw)']};return '<div class="wind">'+z.map(function(w){var a=A[w.dir]||['·','var(--muted)'];return '<span class="wz"><span class="wzl">'+esc(w.zone)+'</span><span class="wza" style="color:'+a[1]+'">'+a[0]+'</span><span class="wzm">'+w.mph+'</span></span>';}).join('')+'</div>';}

function gameProps(pk){var bf=D.boardsFull||D.boards||{};var out=[];[['hr','HR'],['h1','1+H'],['tb2','2TB'],['hrr','HRR']].forEach(function(d){(bf[d[0]]||[]).filter(function(r){return r.gamePk===pk;}).slice(0,2).forEach(function(r){out.push({lbl:d[1],name:r.name,team:r.team,pid:r.playerId,gp:r.gamePk,metric:r.metric});});});return out;}
function renderSlate(){
  var gc=(D.gameCards||[]).slice().sort(function(a,b){return new Date(a.time||0)-new Date(b.time||0);});
  if(!gc.length){$('slate').innerHTML='<div class="empty">No games in today’s slate.</div>';return;}
  $('slate').innerHTML='<div class="grid">'+gc.map(function(g){
    var tm=teamsOf(g),pick=g.pick,conf=g.conf,awayFav=pick===tm.away;
    var aPct=conf==null?50:(awayFav?conf:100-conf),hPct=100-aPct;
    var ar=(g.away_runs!=null)?g.away_runs:'—',hr=(g.home_runs!=null)?g.home_runs:'—';
    var asp=g.away_sp||{},hspx=g.home_sp||{};
    var lu=g.lineups_official?'<span class="badge b-strong">✓ LINEUP</span>':'<span class="badge b-pass">⏳ PROJ</span>';
    var gp=gameProps(g.gamePk);
    var gpHtml=gp.length?('<details class="gprops"><summary>Best props in this game ('+gp.length+')</summary><div class="pl-legs">'+gp.map(function(x){var oc=x.pid?' onclick="openMatchupModal('+x.pid+','+x.gp+',&quot;'+esc(x.name).replace(/&quot;|"/g,'')+'&quot;,&quot;'+esc(x.team||'')+'&quot;)" style="cursor:pointer;color:var(--accent2)"':'';return '<div class="pl-leg"><span class="badge b-rank">'+x.lbl+'</span> <span'+oc+'>'+esc(x.name)+'</span> <span class="unit">'+(x.metric!=null?x.metric:'')+'</span></div>';}).join('')+'</div></details>'):'';
    return '<div class="card game">'
      +'<div class="card-h"><span>'+esc(tm.away)+' @ '+esc(tm.home)+'</span><span class="t">'+esc(fmtTime(g.time))+'</span></div>'
      +'<div class="card-b">'
        +'<div class="teams">'
          +'<div class="team'+(awayFav&&pick?' fav':'')+'">'+teamLogo(tm.away)+'<span class="abbr">'+esc(tm.away)+'</span>'+(g.lineups_official?'<span class="luok" title="Lineup confirmed">✓</span>':'')+'<span class="nm">'+esc(asp.name||'')+' '+handBadge(asp.throws)+spTierBadge(asp.tier)+'</span><span class="rs">'+ar+'</span></div>'
          +'<div class="team'+(!awayFav&&pick?' fav':'')+'">'+teamLogo(tm.home)+'<span class="abbr">'+esc(tm.home)+'</span>'+(g.lineups_official?'<span class="luok" title="Lineup confirmed">✓</span>':'')+'<span class="nm">'+esc(hspx.name||'')+' '+handBadge(hspx.throws)+spTierBadge(hspx.tier)+'</span><span class="rs">'+hr+'</span></div>'
        +'</div>'
        +'<div class="probbar"><i style="width:'+aPct.toFixed(0)+'%;background:var(--accent)"></i><i style="width:'+hPct.toFixed(0)+'%;background:var(--lose)"></i></div>'
        +'<div class="probrow"><span>'+esc(tm.away)+' '+aPct.toFixed(0)+'%</span><span>'+hPct.toFixed(0)+'% '+esc(tm.home)+'</span></div>'
        +windArrows(g.wind_zones)
        +'<div class="subrow"><span>'+(g.temp!=null?'🌡 '+g.temp+'°F':'')+(g.venue?' · '+esc(g.venue):'')+'</span><span>PEN '+(g.away_pen!=null?g.away_pen:'—')+'/'+(g.home_pen!=null?g.home_pen:'—')+'</span></div>'
        +'<div class="pickline">PICK: <b>'+esc(pick||'—')+'</b> '+tierBadge(g.tier)+(conf!=null?'<span class="badge b-rank">'+conf+'% CONF</span>':'')+(g.total!=null?'<span class="badge b-pass">O/U '+g.total+'</span>':'')+lu+'</div>'
        +gpHtml
      +'</div></div>';
  }).join('')+'</div>';
}

function renderMatchups(){
  var gc=(D.gameCards||[]).slice().sort(function(a,b){return new Date(a.time||0)-new Date(b.time||0);});var mlByPk={};(D.ml||[]).forEach(function(m){mlByPk[m.gamePk]=m;});
  var ouByPk={};((D.boardsFull||{}).ou||[]).forEach(function(o){ouByPk[o.gamePk]=o;});
  var nrByPk={};(D.nrfi||[]).forEach(function(n){nrByPk[n.gamePk]=n;});
  if(!gc.length){$('matchups').innerHTML='<div class="empty">No matchups.</div>';return;}
  $('matchups').innerHTML='<div class="grid">'+gc.map(function(g){
    var tm=teamsOf(g),m=mlByPk[g.gamePk]||{},ou=ouByPk[g.gamePk]||{},nf=nrByPk[g.gamePk]||{};
    function spL(sp){if(!sp)return '';return '<div class="sp"><b>'+esc(sp.name||'TBD')+'</b> '+handBadge(sp.throws)+' '+spTierBadge(sp.tier)+'<div class="arse">xERA '+(sp.xera!=null?sp.xera:'—')+' · ERA '+(sp.era!=null?sp.era:'—')+' · K9 '+(sp.k9!=null?sp.k9:'—')+(sp.arsenal?' · '+esc(sp.arsenal):'')+'</div></div>';}
    var kv='';
    if(m.team)kv+='<div class="kv"><span class="k">ML pick</span><span class="v">'+esc(m.team)+' '+tierBadge(m.tier)+'</span></div>';
    if(m.odds)kv+='<div class="kv"><span class="k">Odds</span><span class="v">'+esc(m.odds)+'</span></div>';
    if(m.conf!=null)kv+='<div class="kv"><span class="k">Conf / implied / edge</span><span class="v">'+m.conf+'% / '+(m.implied!=null?m.implied+'%':'—')+' / '+(m.edge!=null?(m.edge>0?'+':'')+m.edge:'—')+'</span></div>';
    if(g.away_runs!=null)kv+='<div class="kv"><span class="k">Proj runs</span><span class="v">'+esc(tm.away)+' '+g.away_runs+' · '+esc(tm.home)+' '+g.home_runs+'</span></div>';
    if(ou.proj!=null){var lb=ou.lean==='OVER'?'b-over':ou.lean==='UNDER'?'b-under':'b-pass';kv+='<div class="kv"><span class="k">Total proj/line</span><span class="v">'+ou.proj+' vs '+ou.line+' <span class="badge '+lb+'">'+esc(ou.lean||'')+'</span></span></div>';}
    if(nf.tier)kv+='<div class="kv"><span class="k">NRFI/YRFI</span><span class="v">'+esc(nf.bet||nf.tier)+(nf.pComb!=null?' ('+nf.pComb+'%)':'')+'</span></div>';
    if(g.away_pen!=null)kv+='<div class="kv"><span class="k">Bullpen ERA</span><span class="v">'+esc(tm.away)+' '+g.away_pen+' · '+esc(tm.home)+' '+g.home_pen+'</span></div>';
    var fac=(m.rules&&m.rules.length)?'<div class="note"><b>Factors:</b> '+esc(m.rules.join(', '))+'</div>':(m.note?'<div class="note">'+esc(m.note)+'</div>':'');
    return '<div class="card"><div class="card-h"><span>'+teamLogo(tm.away)+' '+esc(tm.away)+' @ '+esc(tm.home)+' '+teamLogo(tm.home)+'</span><span class="t">'+esc(g.venue||'')+'</span></div><div class="card-b">'+spL(g.away_sp)+spL(g.home_sp)+windArrows(g.wind_zones)+'<div style="margin-top:8px">'+kv+'</div>'+fac+'</div></div>';
  }).join('')+'</div>';
}

var PROP_SQ=[['hr','HR','⚾'],['h1','1+ Hit','🎯'],['tb2','2+ TB','💥'],['hrr','2+ HRR','🔢'],['nrfi','NRFI/YRFI','🅾'],['ml','Moneyline','💰'],['spread','Spread','📏']];
function propCount(k){var bf=D.boardsFull||D.boards||{};if(k==='nrfi')return (D.nrfi||[]).length;if(k==='ou')return (bf.ou||[]).length;if(k==='ml')return (D.ml||[]).filter(function(p){return p.tier==='STRONG'||p.tier==='LEAN';}).length;if(k==='spread')return (D.gameCards||[]).length;return (bf[k]||[]).length;}
function renderProps(){
  var sq=PROP_SQ.map(function(d){var n=propCount(d[0]);var sub=d[0]==='ml'?(n+' actionable'):d[0]==='spread'?(n+' games'):(n+' picks');return '<div class="psq" onclick="openProp(\''+d[0]+'\',this)"><div class="ic">'+d[2]+'</div><div class="lb">'+d[1]+'</div><div class="ct">'+sub+'</div></div>';}).join('');
  $('props').innerHTML='<div class="prop-grid">'+sq+'</div><div class="card"><div id="propPanel"></div></div>';
  openProp('hr');
}
function openProp(k,btn){
  var sqs=document.querySelectorAll('#props .psq');for(var i=0;i<sqs.length;i++)sqs[i].classList.remove('on');
  if(btn){btn.classList.add('on');}else{for(var j=0;j<sqs.length;j++){if((sqs[j].getAttribute('onclick')||'').indexOf("'"+k+"'")>=0)sqs[j].classList.add('on');}}
  var bf=D.boardsFull||D.boards||{},p=$('propPanel');
  if(k==='nrfi'){p.innerHTML=(D.nrfi||[]).map(function(r){var c=(''+r.tier).indexOf('STRONG')>=0?'b-strong':'b-pass';return '<div class="prow"><span class="pnm" style="cursor:default">'+esc(r.away)+' @ '+esc(r.home)+'</span><span class="badge '+c+'">'+esc(r.bet||r.tier)+'</span><span class="pmetric">'+(r.pComb!=null?r.pComb+'<span class="unit">%</span>':'')+'</span></div>';}).join('')||'<div class="empty">No NRFI data.</div>';return;}

function renderMethod(){
  var mc="color:var(--muted);font-size:11.5px;line-height:1.65";
  var card="background:var(--panel2,#12161d);border:1px solid var(--line,#222);border-left:3px solid #4dc870;border-radius:8px;padding:12px 15px;margin:10px 0";
  var h="color:#4dc870;font-weight:700;font-size:13px;margin-bottom:5px";
  $('method').innerHTML=''+
  '<div style="max-width:840px;margin:0 auto">'+
  '<h2 style="color:#fff">How each pick is calculated</h2>'+
  '<p style="'+mc+';margin-bottom:6px">Plain-English summary of the live algorithms. These are explicit rule sets, not a trained model. Many thresholds are still being calibrated from real results — treat the numbers as a disciplined starting point, not a proven edge (measured CLV is roughly break-even).</p>'+

  '<div style="'+card+'"><div style="'+h+'">Moneyline (V3.3/V3.4)</div><p style="'+mc+'">'+
  'Start at 50% confidence, +4 if home. The biggest mover is the starting-pitcher gap: (opponent xERA − our xERA) × 4 — a much better starter is a big edge. Then subtract for warning signs (a bad last start, a 5+ game losing skid, being swept, an elite opposing starter, a top-10 opposing offense, a lockdown opposing bullpen) and add for tailwinds (facing elimination, an opposing starter due to regress, a fresh coaching change). Team form (R71) adds a small ±2 nudge for hot/cold teams — a tiebreaker, never a driver. '+
  'Then compare confidence to the price\'s implied odds: BET STRONG at 72%+ confidence with 5+ points of edge; LEAN at 63%+ with 5+ edge (or a big-edge underdog). Hard rules: never bet against the Yankees, never on a TBD starter.</p></div>'+

  '<div style="'+card+'"><div style="'+h+'">NRFI / YRFI — no/yes run in the 1st inning (V4)</div><p style="'+mc+'">'+
  'Blend both starting pitchers\' first-inning scores (xERA, strikeout & walk rates, recent form) — 55% of the score. Add both lineups\' first-inning offense — 25% — now driven by the on-base % of the batters actually hitting 1-2-3 in today\'s posted lineup (a weak or short-handed top of the order means fewer baserunners → better NRFI; before lineups post it falls back to a season team rating). Add the park\'s first-inning run factor — 15%. Then adjust for weather (cold air and wind blowing in favor NRFI; heat and wind blowing out favor YRFI), an elite-pitcher bonus, and a blow-up-risk penalty. 72+ = strong NRFI, very low = strong YRFI. Rain over 40% voids the game.</p></div>'+

  '<div style="'+card+'"><div style="'+h+'">Home Runs (V4.2)</div><p style="'+mc+'">'+
  'A 0–100 score from six pieces: the hitter\'s raw power (ISO, up to 20), how hittable the opposing starter is by xERA (up to 25), wind (up to 20 — out-and-hot is the jackpot, wind blowing in nearly zeroes it), the ballpark (15), where he bats in the order (10), and recent form (10) — plus a small pitch-matchup nudge. 85+ is Tier A, 75+ Tier B. Finally the score is turned into a fair probability and compared to the book\'s home-run price to show the edge.</p></div>'+

  '<div style="'+card+'"><div style="'+h+'">Hits — 1+ Hit / 2B+ (V3.1)</div><p style="'+mc+'">'+
  'Driven mostly by how hittable the opposing starter is (xERA, up to 30 — the single biggest factor). Then the hitter\'s own quality (up to 25 = batting avg × 50 + extra-base-hits-per-game × 20 + hits-per-game × 15), wind (up to 20, and it mainly matters for 2B+ where fly balls carry into gaps), batting-order slot (15, top-4 bats best for volume), and recent form (10). A cold streak overrides down.</p></div>'+

  '<div style="'+card+';border-left-color:#e8a030"><div style="'+h+';color:#e8a030">Parlay tickets (V-P4)</div><p style="'+mc+'">'+
  'Three tickets daily. <b>Ticket 1 — Safe Parlay</b> (max 3 legs, no HR): only 1+ hit, NRFI/YRFI ≥75%, and strong Over/Unders. It BANS 2+ total bases and 2+ hits+runs+RBI, which historically hit only ~45% and ~22% and were the recurring ticket-killers. <b>Tickets 2 & 3 — HR Top-2 and HR Lotto</b> (6-leg, correlated slugfests). '+
  'Two honesty layers sit on top: (1) a <b>calibration haircut</b> — the model overrates its most confident picks, so a raw 70–80% is treated as ~52–62% and anything 80%+ as 55% before it\'s ranked; 1+ hit is capped at its real ~72% rate. (2) a <b>price gate</b> — every leg shows a real sportsbook price and only positive-edge legs survive; player props post late, so unpriced legs are kept but flagged "verify price." The <b>Over rule (R72)</b>: an Over only qualifies with a wind boost AND a projection at least 1.5 runs above the line AND lineups that aren\'t cold. Legs are ordered most-to-least confident so you trim from the bottom.</p></div>'+

  '<p style="'+mc+';margin-top:10px;color:#777">The honest caveat: these rules reduce obvious mistakes and enforce discipline, but none of them has yet been proven to beat the closing line. The next real improvement is the weekly recalibration loop that re-derives these thresholds from settled results.</p>'+
  '</div>';
}

  var sq=last.map(function(r){var ev=+r.launch_speed;var c=ev>=98?'#34d399':ev>=90?'#fbbf24':'#f87171';return '<span class="mx-cqsq" style="background:'+c+'" title="'+ev+' mph"></span>';}).join('');
  var hh=bip.filter(function(r){return +r.launch_speed>=95;}).length;
  return '<div class="mx-h2">Contact Quality (last '+last.length+' BIP)</div><div class="mx-cq">'+sq+'</div><div class="mx-sub">Hard-hit '+Math.round(100*hh/bip.length)+'% &middot; avg EV '+(bip.reduce(function(a,r){return a+(+r.launch_speed);},0)/bip.length).toFixed(1)+' mph &middot; <span style="color:#34d399">98+</span> <span style="color:#fbbf24">90-97</span> <span style="color:#f87171">&lt;90</span></div>';
}
function mxZone(bip){
  var z={};bip.forEach(function(r){var n=+r.zone;if(n>=1&&n<=9){(z[n]=z[n]||{h:0,n:0});z[n].n++;if(HITSET[r.events])z[n].h++;}});
  var cells='';for(var i=1;i<=9;i++){var d=z[i];var rate=d&&d.n?d.h/d.n:null;var bg=rate==null?'#13283a':rate>=.35?'#34d399':rate>=.2?'#fbbf24':'#f87171';var lab=d&&d.n?(Math.round(100*rate)+'%'):'—';cells+='<div class="mx-zcell" style="background:'+bg+'">'+lab+'<span style="font-size:7px">'+(d?d.n:0)+' BIP</span></div>';}
  return '<div class="mx-h2">Strike-Zone Results (hit% by zone, catcher view)</div><div class="mx-zone">'+cells+'</div>';
}
function mxSpray(bip){
  var pts=bip.filter(function(r){return r.hc_x&&r.hc_y&&r.hc_x!=='null';});
  if(!pts.length)return '';
  var dot=pts.map(function(r){var x=(+r.hc_x);var y=(+r.hc_y);var col=r.events==='home_run'?'#f87171':HITSET[r.events]?'#34d399':'#64748b';return '<circle cx="'+x.toFixed(0)+'" cy="'+y.toFixed(0)+'" r="2.2" fill="'+col+'" opacity="0.8"/>';}).join('');
  return '<div class="mx-h2">Spray Chart ('+pts.length+' batted balls)</div><svg viewBox="0 0 250 230" style="width:100%;max-width:320px;display:block;margin:0 auto;background:#0a1626;border:1px solid rgba(34,211,238,.2);border-radius:10px"><path d="M125 205 L40 120 A120 120 0 0 1 210 120 Z" fill="rgba(34,211,238,.05)" stroke="rgba(34,211,238,.25)"/><line x1="125" y1="205" x2="40" y2="120" stroke="rgba(34,211,238,.25)"/><line x1="125" y1="205" x2="210" y2="120" stroke="rgba(34,211,238,.25)"/>'+dot+'<circle cx="125" cy="205" r="2.5" fill="#fbbf24"/></svg><div class="mx-sub" style="text-align:center"><span style="color:#f87171">HR</span> &middot; <span style="color:#34d399">hit</span> &middot; <span style="color:#64748b">out</span></div>';
}
function mxRecent(bip){
  if(!bip.length)return '';
  var rec=bip.slice(-9).reverse();
  var cards=rec.map(function(r){var ev=+r.launch_speed;var c=ev>=98?'#34d399':ev>=90?'#fbbf24':'#f87171';var res=(r.events||'').replace(/_/g,' ');return '<div class="mx-bbc"><div class="mx-bbev" style="color:'+c+'">'+ev.toFixed(0)+'</div><div class="mx-bbsub">'+(r.launch_angle||'?')+'° &middot; '+esc(res||'in play')+'</div></div>';}).join('');
  return '<div class="mx-h2">Recent Batted Balls (EV mph)</div><div class="mx-bb">'+cards+'</div>';
}

</script>
<script>
/* Odds freshness bar (V-P4, 2026-07-27): shows when odds were last pulled +
   API credits left, so a stale slate ("hit Refresh") is distinguishable from
   "books haven't posted props yet". Self-contained + defensive — never throws
   into the page; if D.odds is absent it degrades to the static hint. */
(function(){
  try{
    var el=document.getElementById('oddsfresh'); if(!el) return;
    var D=window.D||window.MODEL_DATA||{}; var o=D.odds||{};
    function ago(iso){
      if(!iso) return null;
      var m=(Date.now()-new Date(iso).getTime())/60000;
      if(isNaN(m)) return null;
      if(m<1) return 'just now';
      if(m<60) return Math.round(m)+'m ago';
      return Math.floor(m/60)+'h '+Math.round(m%60)+'m ago';
    }
    var parts=[];
    if(o.pulledAt) parts.push('odds pulled '+ago(o.pulledAt));
    else if(o.note) parts.push('odds: '+o.note);
    else parts.push('odds not pulled this run');
    if(o.remaining!=null) parts.push(o.remaining+' API credits left');
    if(o.pricedLegs!=null && o.totalLegs) parts.push(o.pricedLegs+'/'+o.totalLegs+' legs priced');
    parts.push('props post ~3–4h before first pitch');
    el.textContent=parts.join('  ·  ');
  }catch(e){}
})();
</script>
