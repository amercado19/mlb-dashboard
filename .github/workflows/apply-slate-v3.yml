      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.47.0
          npx playwright install --with-deps chromium

      - name: Run the suite
        run: bash tests/run_all.sh

      - name: Commit, and remove this workflow in the same commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-slate-v3.yml
          git add -A
          if git diff --cached --quiet; then
            echo "nothing staged -- refusing to make an empty commit"
            exit 1
          fi
          git diff --cached --name-status
          git commit -F - <<'MSGEOF'
          Slate v3: put the decision on the card and the lineup in front of a person

          The lineup bug was never in the collector. For gamePk 824224 and 823496
          the published payload already carried lineups_official:true and a
          nine-man away_bat/home_bat, with lineupState.official:true beside it.
          The Slate v2 card simply never called lineupStateOf/lineupChipOf, so
          the only lineup text on the page came from slatePlan -- whose window
          excludes both of those games, and which therefore reported "3 of 7
          official" about a different seven games than the two being looked at.

          The card now reads the canonical lineup state directly and says
          CONFIRMED / PROJECTED / PENDING in one place, with the filed batting
          order one click away.

          Around that, the collapsed card keeps only what a decision needs: both
          starters with a display rating, one environmental line, the model
          winner and its win probability, the projected score, and the lineup
          word. Everything that used to crowd it -- bet verdict, decision chips,
          context, +1.5, game picks, the quality strip, provenance -- is
          unchanged and moved into View analysis.

          Nothing here recomputes a model value. The pitcher rating is display
          only, clamp(10*(6.0 - xERA)/3.5, 0, 10) over the xERA the rulebook
          already fires on, and it does not reach a prediction. The per-game
          parlay is a model combination with no price, no joint probability and
          no confidence adjective; when a game yields three qualified legs it
          says so rather than reopening a retired family to find a fourth. Top
          props name every family and refuse to pick for the ones governance has
          retired or put under reactivation review.

          Two real defects this found along the way. wp is already a percentage,
          and the new winner line scaled it by 100 a second time, printing
          6493%; the contract test now bounds the value rather than matching its
          shape, which is what let it through the first time. And away_bat[].side
          reads "R" for all nine in every game, Juan Soto and Lindor included, so
          it is not batter handedness -- the column is omitted rather than
          printed.

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01ANJSLwtfnVuf8PPgpvpWtb
          MSGEOF
