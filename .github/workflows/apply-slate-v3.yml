name: apply-slate-v3

# ONE-SHOT. Applies the Slate v3 edit to the three page files and the two test
# files, runs the whole suite, and only then commits -- deleting itself in the
# same commit, so nothing about this mechanism outlives the change it makes.
#
# The edits are exact-match text replacements that must each occur EXACTLY ONCE
# in their target. A miss writes nothing and fails the run, so a half-applied
# 1.8MB page is not a state this can reach.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

