              ops = bundle[key]
              for t in targets:
                  p = pathlib.Path(t)
                  s = p.read_text(encoding='utf-8')
                  for k, (old, new) in enumerate(ops):
                      n = s.count(old)
                      if n != 1:
                          sys.exit('%s: op %d matched %d times (need exactly 1)'
