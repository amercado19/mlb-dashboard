          import hashlib
          import json
          import pathlib
          import sys
          M = '<script id="bb-data" type="application/json">'
          want = json.loads(pathlib.Path('/tmp/payload_sha.json').read_text())
          bad = []
          for fn, sha in want.items():
              s = pathlib.Path(fn).read_text(encoding='utf-8')
              i = s.index(M) + len(M)
              j = s.index('</script>', i)
              got = hashlib.sha256(s[i:j].encode('utf-8')).hexdigest()
              print('%s %s' % (fn, 'unchanged' if got == sha else 'CHANGED'))
              if got != sha:
                  bad.append(fn)
          if bad:
              sys.exit('this patch changed the data payload in %s -- it is a '
                       'renderer change and must not touch a number' % bad)
          print('every payload is byte-identical')
          PYEOF

      - name: Structure gates
        run: |
          python3 - <<'PYEOF'
          import pathlib
          import sys
          FAIL = []
          # (needle, expected count, why it matters)
          CHECKS = [
              ('function mktDead(pk)', 1,
               'the shared predicate must be defined exactly once'),
              ('function mktDeadRow(r)', 1,
               'the row-level variant must be defined exactly once'),
              ('var DEAD={LIVE:1,CLOSED:1};', 0,
               "hMoneyline's private copy of the dead-state set must be gone"),
              ('var rows=all.filter(function(m){return !mktDead(m.gamePk);});', 1,
               'the moneyline hero must filter through the shared predicate'),
              ('if((t===\'STRONG\'||t===\'LEAN\')&&mktDead(p.gamePk)){gGone.push(p);return;}', 1,
               'the Picks tiers must not keep an expired STRONG or LEAN'),
              ('No longer bettable (', 1,
