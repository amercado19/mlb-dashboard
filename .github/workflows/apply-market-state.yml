      - name: The page script must still parse
        run: |
          # A patch that breaks the inline script takes the whole page down, and
          # a structural grep cannot see a syntax error. This does not render
          # the page -- the render QA was done locally against these exact
          # bytes at 375/414/768/1200/1440 -- it only proves the script is
          # still valid JavaScript.
          node - <<'JSEOF'
          const fs = require('fs');
          let bad = 0;
          for (const fn of ['current.html', 'index.html', 'preview.html']) {
            const s = fs.readFileSync(fn, 'utf8');
            const re = /<script(?![^>]*type="application\/json")[^>]*>([\s\S]*?)<\/script>/g;
            let m, n = 0, chars = 0;
            while ((m = re.exec(s)) !== null) {
              const code = m[1];
              if (!code.trim()) continue;
              n++; chars += code.length;
              try { new Function(code); }
              catch (e) {
                console.log('SYNTAX ERROR in ' + fn + ' script #' + n + ': ' + e.message);
                bad++;
              }
            }
            console.log(fn + ': ' + n + ' inline script(s), ' + chars + ' chars, parsed');
          }
          if (bad) { console.log('FAIL: ' + bad + ' script(s) do not parse'); process.exit(1); }
          console.log('every inline script parses');
          JSEOF

