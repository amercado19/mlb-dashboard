          ]
          for fn in ('current.html', 'index.html', 'preview.html'):
              s = pathlib.Path(fn).read_text(encoding='utf-8')
              for needle, want, why in CHECKS:
                  got = s.count(needle)
                  if got != want:
                      FAIL.append('%s: %r found %d, expected %d -- %s'
                                  % (fn, needle[:52], got, want, why))
          if FAIL:
