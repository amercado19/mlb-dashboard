              ('var gone=legs.filter(function(l){return l.gamePk!=null&&mktDead(l.gamePk);});', 1,
               'parlayVerdict must reject a ticket with a started leg'),
              ('var mpGone=legs.filter(', 1,
               'the model-parlay hero does not use parlayVerdict and needs its own gate'),
              ('var ppGone=legs.filter(', 1,
               'the priced-parlay hero needs the same gate'),
              ('var rows=all.filter(function(x){return !mktDeadRow(x);});', 2,
               'hProp and hHomeRun must both take the best LIVE-free row'),
              ('var qs=allq.filter(function(x){return !mktDeadRow(x);});', 1,
               'the +1.5 hero must skip a game that has started'),
              ('if(mktDead(pk)) return [];', 1,
               'a per-game parlay on a started game must build nothing'),
              ('(p.tier===\'STRONG\'||p.tier===\'LEAN\')&&!mktDead(p.gamePk)', 2,
               'tpCandidates and propCount must both agree on what is actionable'),
              ('still bettable', 2,
               'the prop heroes must say which rank they actually took'),
              # These must survive from the previous change.
              ('<section id="picks" class="active">', 1,
               'Picks stays the default section'),
              ("var TABS=[['picks','Picks'],['slate','Slate'],", 1,
