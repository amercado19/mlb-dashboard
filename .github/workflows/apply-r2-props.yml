                           "function ppDrawer(", "var PP_MARKETS=", ".ppcard{", ".ppgrid{"):
                  chk(must in s, fn + ": has " + must)

              # RELEASE 1 MUST SURVIVE. It was accepted and must stay deployed.
              for must in ("function renderHome(", "function hmPlayer(", "function legRetired(",
                           "--bg:#0b1220", "NAV_PRIMARY=['home'"):
                  chk(must in s, fn + ": Release 1 intact -- " + must)

              # NO DESTINATION MAY VANISH.
              for tid in ("home","slate","picks","matchups","props","parlay","performance",
                          "simulator","library","admin","method","backtests"):
                  chk(('id="' + tid + '"') in s, fn + ": section " + tid + " present")

              # THE RETIRED MARKETS ARE NOT PROMOTED, AND NOT DELETED EITHER.
              chk("PP_MARKETS=[\n  {fam:'h1'" in s or "{fam:'h1',label:'1+ Hit'" in s,
                  fn + ": only h1 and hr are destinations")
              chk("'tb2'" in s and "'hrr'" in s, fn + ": retired markets still inspectable")
              chk(s.count("function renderProps(") == 1, fn + ": exactly one renderProps")

              # THE NUMBER MUST NEVER BE CALLED A PROBABILITY WHEN THERE ISN'T ONE.
              chk("Home Run publishes no probability." in s, fn + ": hr states it has no probability")
              chk("RANKING ONLY" in s, fn + ": the ranking-only label survives")
              chk("vs implied price, vig included" in s, fn + ": the vig is named on the card")

