name: apply-playoffs

# ONE-SHOT INSTALLER. Deletes itself in the same commit.
#
# MLB PREDICT -- PLAYOFF RELEASE 1: a postseason command centre.
#
# Reads the `postseason` block the pipeline now publishes and renders it as a
# primary destination: today's playoff games with the series score, both
# starters, the lineup state and every market's state with the producer's own
# reason attached; a factual matchup comparison per game; the ACTUAL bracket
# reconstructed from canonical results with zero browser storage; and the
# model bracket behind its real calibration disclosure.
#
# IDEMPOTENT BY CONSTRUCTION, unlike the pipeline installer that preceded it:
# the first step refuses to run if the renderer is already present, because
# an anchored patch whose anchors still match after it has been applied will
# happily apply itself twice.
#
# Verified at 375/390/414/768/1200/1440 in Chromium against a page carrying
# the real block before packaging: 4 game cards, 4 series with real score
# lines, 32 market chips, 28 matchup lines, coverage complete, no HR chip
# claiming an actionable state, no SAFE/LOCK/GUARANTEED, no overflow.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refuse if already applied
        run: |
          if grep -q "function renderPlayoffs" current.html; then
            echo "renderPlayoffs is already present -- this installer has run." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "Nothing to do; not patching a second time." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "clean tree, proceeding" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply the playoffs renderer
        run: |
          cat > pl1.py <<'PEOF'
          """PLAYOFF RELEASE 1 — a postseason command centre, built on Release 1's system.

          WHAT THIS ADDS
          ==============
          A `PLAYOFFS` destination, second in the primary nav, that answers the
          postseason questions the regular-season surfaces cannot:

            TODAY'S PLAYOFF GAMES  every canonical playoff game, one card each, with
                                   the series score, the game number, both starters,
                                   the lineup state, and every market's state with the
                                   producer's own reason attached.
            WHY THE MODEL LEANS    a factual matchup comparison per game, built only
                                   from fields the payload actually carries.
            LIVE BRACKET (ACTUAL)  reconstructed from the canonical schedule. Zero
                                   browser storage: open it on a fresh device and the
                                   series scores are identical, because they are a pure
                                   function of games that already happened.
            MODEL BRACKET          the existing simulator, with its own calibration
                                   disclosure. A simulation estimate, never a
                                   calibrated probability.
            COVERAGE               expected vs published, and every diagnostic.

          THE INVARIANT THIS SURFACE EXISTS TO MAKE VISIBLE
          =================================================
          Every playoff game gets a record. PASS, WATCH, AWAITING_LINEUP and
          UNAVAILABLE all count as analysed; a missing game does not. So the coverage
          line is rendered at the top of the section rather than buried in Admin, and
          it reads red when `coverageComplete` is false. If the section ever shows
          three games on a four-game slate, the number above it says so.

          WHAT IT REFUSES TO DO
          =====================
          * No market state is invented here. The chips render exactly what the
            pipeline's adapter published, and the tooltip is the producer's own reason
            string. A game with nothing to say says UNAVAILABLE.
          * No edge is manufactured. Each matchup line states the two real numbers it
            is comparing (3.39 vs 3.95 xERA), never a computed "edge" the model never
            produced. Where a field is absent the line is omitted rather than
            defaulted — an unreported bullpen ERA and a 0.00 bullpen ERA are different
            claims.
          * No pick is created for a game that has started. `mktDead` already owns
            that predicate for the rest of the page and is reused here; a started
            game keeps its card and its frozen states, and the card says so.
          * MY BRACKET is not in this release. It is new client persistence, and
            shipping a bracket you can click but not keep would be worse than not
            shipping one. It lands next with a versioned saved-ticket schema.
          """
          from __future__ import annotations

          import pathlib
          import sys

          FILES = ("current.html", "index.html", "preview.html")
          FAIL: list[str] = []

          # ------------------------------------------------------------------- 1. CSS
          CSS_ANCHOR = ".ppbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}"

          CSS_NEW = CSS_ANCHOR + """
          /* ---- Playoffs ---- */
          .pocov{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--mono);font-size:11px;
            background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--win);
            border-radius:10px;padding:9px 12px;margin:0 0 14px}
          .pocov.bad{border-left-color:var(--lose)}
          .pocov b{color:var(--txt)}
          .pocov span{color:var(--muted)}
          .pogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
          .pog{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px 14px;min-width:0}
          .pog.dead{opacity:.75}
          .pogh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px}
          .pogt{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:800;color:var(--txt);min-width:0}
          .pogt .hlogo,.pogt .hini{width:22px;height:22px;font-size:10px}
          .pogt i{font-style:normal;color:var(--muted);font-weight:600;font-size:12px}
          .pogm{font-family:var(--mono);font-size:10px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
          .poser{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;font-weight:800;
            background:var(--elev);border:1px solid var(--line2);color:var(--gold);border-radius:7px;padding:2px 8px}
          .posp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:9px 0 2px}
          .posp>div{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 9px;min-width:0}
          .posp .lb{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}
          .posp .nm{font-size:12px;font-weight:700;color:var(--txt);margin:1px 0;overflow-wrap:anywhere}
          .posp .st{font-family:var(--mono);font-size:10px;color:var(--muted)}
          .powhy{margin:10px 0 0;border-top:1px solid var(--line);padding-top:9px}
          .powhyh{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:5px}
          .powhy ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
          .powhy li{font-size:11px;color:var(--muted);line-height:1.45;display:flex;gap:7px}
          .powhy li b{color:var(--txt);font-weight:700;min-width:74px;flex:0 0 74px;font-size:9.5px;
            text-transform:uppercase;letter-spacing:.05em;padding-top:1px}
          .pomk{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;border-top:1px solid var(--line);padding-top:9px}
          .pomkc{font-family:var(--mono);font-size:9.5px;font-weight:800;border-radius:7px;padding:2px 7px;
            border:1px solid var(--line2);background:var(--elev);color:var(--muted);cursor:help;white-space:nowrap}
          .pomkc.s-PICK{background:#0b2e1e;color:#4ade80;border-color:#166a3f}
          .pomkc.s-LEAN{background:#0a2038;color:#7bb8ff;border-color:#1d4f86}
          .pomkc.s-PASS{background:var(--panel2);color:var(--muted)}
          .pomkc.s-WATCH{background:#2a2206;color:#e3b341;border-color:#7a6112}
          .pomkc.s-AWAITING_LINEUP{background:#2a1c06;color:#d99a3a;border-color:#7a5312}
          .pomkc.s-UNAVAILABLE{background:var(--panel2);color:#6b7686}
          .pobr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
          .pobrr{min-width:0}
          .pobrh{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
            margin:0 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
          .pobs{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}
          .pobs.win{border-color:#166a3f}
          .pobsr{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px}
          .pobsr+.pobsr{margin-top:3px}
          .pobsr .t{display:flex;align-items:center;gap:5px;min-width:0;color:var(--muted);font-weight:700}
          .pobsr .t .hlogo,.pobsr .t .hini{width:17px;height:17px;font-size:9px}
          .pobsr.adv .t{color:var(--txt)}
          .pobsr .w{font-family:var(--mono);font-weight:800;color:var(--txt)}
          .pobsl{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:5px;
            border-top:1px solid var(--line);padding-top:5px}
          .pobsl.clinched{color:var(--win)}
          .poempty{font-size:11px;color:var(--muted);font-family:var(--mono);padding:8px 2px}
          .pormk{font-size:11px;color:var(--muted);line-height:1.6;background:var(--panel);border:1px solid var(--line);
            border-left:3px solid var(--accent);border-radius:10px;padding:10px 12px;margin:0 0 12px}
          .pormk b{color:var(--txt)}
          @media(max-width:860px){.pobr{grid-template-columns:repeat(2,minmax(0,1fr))}}
          @media(max-width:430px){
            .pogrid{grid-template-columns:1fr}
            .pobr{grid-template-columns:1fr}
            .posp{grid-template-columns:1fr}
            .powhy li{flex-direction:column;gap:1px}
            .powhy li b{flex:none;min-width:0}
          }"""

          # --------------------------------------------------------------- 2. the section
          SEC_ANCHOR = '<section id="slate">'
          SEC_NEW = '<section id="playoffs"></section>\n' + SEC_ANCHOR

          # ------------------------------------------------------------------- 3. nav
          NAV_OLD = ("var TABS=[['home','Home'],['slate','Game Predictions'],"
                     "['props','Player Props'],['parlay','Parlays'],['library','Results'],")
          NAV_NEW = ("var TABS=[['home','Home'],['playoffs','Playoffs'],"
                     "['slate','Game Predictions'],"
                     "['props','Player Props'],['parlay','Parlays'],['library','Results'],")

          PRIM_OLD = "var NAV_PRIMARY=['home','slate','props','parlay','library'];"
          PRIM_NEW = ("/* PLAYOFFS IS SECOND, not tucked under More. In October it is the\n"
                      "   product; in April it renders its own explicit inactive state. */\n"
                      "var NAV_PRIMARY=['home','playoffs','slate','props','parlay','library'];")

          # ---------------------------------------------------------------- 4. renderer
          RENDER_ANCHOR = "function renderProps(){"

          RENDERER = r"""/* ====================== PLAYOFFS ======================================

             Everything here reads `D.postseason`, the single block the pipeline
             publishes (schema POSTSEASON-PRODUCT-1). This surface derives no
             baseball: the series scores are the producer's, the market states are
             the producer's adapter's, and each chip's tooltip is the producer's own
             reason string. Where the block says UNAVAILABLE, this says UNAVAILABLE.

             THE ACTUAL BRACKET USES NO BROWSER STORAGE. It is a pure function of
             games that already happened, so a fresh device three rounds in shows the
             same thing. MY BRACKET, when it lands, is the only part that persists
             anything client-side, and it will be kept strictly separate. */

          function poBlock(){
            var b=D.postseason;
            return (b&&typeof b==='object')?b:null;
          }
          function poActive(){var b=poBlock();return !!(b&&b.active);}

          /* A started playoff game keeps its card and loses its actionability, the
             same rule the rest of the page uses. The predicate is the page's
             existing one -- not a second reading of the clock. */
          function poDead(g){
            if(!g)return false;
            var s=String(g.abstractState||'').toLowerCase();
            if(s==='live'||s==='final')return true;
            return mktDead(g.gamePk);
          }

          var PO_MARKET_LABEL={moneyline:'ML',runLine:'RUN LINE',h1:'1+ HIT',hr:'HR',
            hrr:'H+R+RBI',nrfiYrfi:'NRFI/YRFI',modelParlayEligibility:'MODEL PARLAY',
            pricedParlayEligibility:'PRICED PARLAY'};
          var PO_MARKET_ORDER=['moneyline','runLine','nrfiYrfi','h1','hr','hrr',
            'modelParlayEligibility','pricedParlayEligibility'];

          function poChips(g){
            var mk=g.markets||{},rs=g.markets_reason||{},sr=g.markets_source||{};
            return PO_MARKET_ORDER.filter(function(k){return mk[k];}).map(function(k){
              var st=String(mk[k]);
              var tip=(rs[k]||'')+(sr[k]?('  ['+sr[k]+']'):'');
              return '<span class="pomkc s-'+esc(st)+'" title="'+esc(tip)+'">'
                +esc(PO_MARKET_LABEL[k]||k)+' '+esc(st.replace('AWAITING_LINEUP','AWAITING LINEUP'))
                +'</span>';
            }).join('');
          }

          /* THE MATCHUP, FROM FIELDS THAT EXIST.
             Every line names the two real numbers it compares. Nothing is called an
             "edge" -- the model publishes no starter-edge or bullpen-edge quantity,
             so inventing one here would be this page asserting a measurement the
             pipeline never made. A field the payload does not carry produces no
             line at all, because absent is not zero. */
          function poWhy(g){
            var pk=g.gamePk;
            var gc=(D.gameCards||[]).filter(function(c){return c.gamePk===pk;})[0]||{};
            var pr=(D.predictions||[]).filter(function(p){return p.gamePk===pk;})[0]||{};
            var aw=(g.away||{}).abbreviation||pr.awayTeam||'AWAY';
            var hm=(g.home||{}).abbreviation||pr.homeTeam||'HOME';
            var out=[];
            function row(k,v){if(v)out.push('<li><b>'+esc(k)+'</b><span>'+v+'</span></li>');}

            var asp=gc.away_sp||{},hsp=gc.home_sp||{};
            if(asp.name||hsp.name){
              var bits=[];
              if(asp.name)bits.push(esc(aw)+' '+esc(asp.name)+(isNum(asp.xera)?' ('+asp.xera.toFixed(2)+' xERA)':''));
              if(hsp.name)bits.push(esc(hm)+' '+esc(hsp.name)+(isNum(hsp.xera)?' ('+hsp.xera.toFixed(2)+' xERA)':''));
              var tail='';
              if(isNum(asp.xera)&&isNum(hsp.xera)){
                var d=Math.abs(asp.xera-hsp.xera);
                tail=' — '+(d<0.25?'effectively level on xERA'
                  :('the '+esc(asp.xera<hsp.xera?aw:hm)+' starter is '+d.toFixed(2)+' better on xERA'));
              }
              row('Starters',bits.join(' vs ')+tail);
            }
            if(isNum(gc.away_runs)&&isNum(gc.home_runs)){
              row('Projected runs',esc(aw)+' '+gc.away_runs.toFixed(1)+' · '+esc(hm)+' '+gc.home_runs.toFixed(1)
                +(isNum(gc.total)?' (total '+gc.total.toFixed(1)+')':''));
            }
            if(isNum(gc.away_pen)&&isNum(gc.home_pen)){
              row('Bullpens',esc(aw)+' '+gc.away_pen.toFixed(2)+' · '+esc(hm)+' '+gc.home_pen.toFixed(2)+' season pen ERA');
            }
            var park=[];
            if(gc.venue)park.push(esc(gc.venue));
            if(isNum(gc.park_hr))park.push(gc.park_hr+' park HR factor');
            if(gc.temp!=null)park.push(esc(String(gc.temp))+'°F');
            if(isNum(gc.wind_mph))park.push(gc.wind_mph+' mph wind');
            if(park.length)row('Park & air',park.join(' · '));

            var ls=String(g.lineupState||'');
            if(gc.lineups_official===true)row('Lineups','both official');
            else if(ls==='CONFIRMED')row('Lineups','confirmed');
            else if(gc.lineups_projected===true||ls==='PROJECTED')row('Lineups','projected — official not posted, so player markets are awaiting');
            else if(ls)row('Lineups',esc(ls.toLowerCase()));

            var ma=pr.modelAgreement||{};
            if(ma.status){
              var t=esc(String(ma.status).replace(/_/g,' ').toLowerCase());
              if(ma.moneylineWinner&&ma.runProjectionWinner&&ma.moneylineWinner!==ma.runProjectionWinner)
                t+=' — the win-probability model says '+esc(ma.moneylineWinner)
                  +' and the run projection says '+esc(ma.runProjectionWinner);
              row('Model agreement',t);
            }
            if(isNum(pr.homeWinProb)&&isNum(pr.awayWinProb)){
              row('Win probability',esc(hm)+' '+(100*pr.homeWinProb).toFixed(1)+'% · '
                +esc(aw)+' '+(100*pr.awayWinProb).toFixed(1)+'%');
            }
            if(!out.length)return '';
            return '<div class="powhy"><div class="powhyh">Why the model leans this way</div>'
              +'<ul>'+out.join('')+'</ul></div>';
          }

          function poGameCard(g){
            var s=g.series||{},dead=poDead(g);
            var aw=(g.away||{}).abbreviation,hm=(g.home||{}).abbreviation;
            var t=g.gameDate?fmtTime(g.gameDate):'';
            var meta=[];
            if(t)meta.push('<span>'+esc(t)+'</span>');
            if(g.detailedState)meta.push('<span>'+esc(g.detailedState)+'</span>');
            if(g.venue)meta.push('<span>'+esc(g.venue)+'</span>');
            /* A SCORE ONLY ONCE THERE IS ONE. statsapi publishes 0-0 for a game in
               Warmup, and `isNum(0)` is true, so an unstarted game rendered
               "PHI 0 - ATL 0" as though it were a result. Gated on the game actually
               being under way or over. */
            var _st=String(g.abstractState||'').toLowerCase();
            if((_st==='live'||_st==='final')
               &&isNum(g.away&&g.away.score)&&isNum(g.home&&g.home.score))
              meta.push('<span>'+esc(aw)+' '+g.away.score+' \u2014 '+esc(hm)+' '+g.home.score+'</span>');
            var gc=(D.gameCards||[]).filter(function(c){return c.gamePk===g.gamePk;})[0]||{};
            var asp=gc.away_sp||{},hsp=gc.home_sp||{};
            var sp='';
            if(asp.name||hsp.name){
              sp='<div class="posp">'
                +'<div><div class="lb">'+esc(aw||'AWAY')+' starter</div><div class="nm">'
                  +esc(asp.name||SH_ABSENT)+'</div><div class="st">'
                  +(isNum(asp.xera)?asp.xera.toFixed(2)+' xERA':'')
                  +(isNum(asp.era)?' · '+asp.era.toFixed(2)+' ERA':'')
                  +(asp.throws?' · '+esc(asp.throws)+'HP':'')+'</div></div>'
                +'<div><div class="lb">'+esc(hm||'HOME')+' starter</div><div class="nm">'
                  +esc(hsp.name||SH_ABSENT)+'</div><div class="st">'
                  +(isNum(hsp.xera)?hsp.xera.toFixed(2)+' xERA':'')
                  +(isNum(hsp.era)?' · '+hsp.era.toFixed(2)+' ERA':'')
                  +(hsp.throws?' · '+esc(hsp.throws)+'HP':'')+'</div></div></div>';
            }
            return '<div class="pog'+(dead?' dead':'')+'">'
              +'<div class="pogh"><div class="pogt">'+hTeam(aw)+'<span>'+esc(aw||'')+'</span>'
                +'<i>@</i>'+hTeam(hm)+'<span>'+esc(hm||'')+'</span></div>'
                +(s.seriesScoreLine?'<span class="poser">'+esc(s.seriesScoreLine)+'</span>':'')+'</div>'
              +'<div class="pogm">'
                +(s.roundLabel?'<span>'+esc(s.roundLabel)+'</span>':'')
                +(isNum(s.gameNumberInSeries)?'<span>Game '+s.gameNumberInSeries
                  +(isNum(s.bestOf)?' of '+s.bestOf:'')+'</span>':'')
                +meta.join('')+'</div>'
              +sp
              +poWhy(g)
              +'<div class="pomk">'+poChips(g)+'</div>'
              +(dead?'<div class="poempty">This game is underway or final. The states above are '
                +'the record of what was published before first pitch; nothing here is current.</div>':'')
              +'</div>';
          }

          /* ---- the ACTUAL bracket: canonical results, no browser storage ---- */
          var PO_ROUND_LABEL={WILD_CARD:'Wild Card',DIVISION:'Division Series',
            LCS:'League Championship',WORLD_SERIES:'World Series'};
          var PO_ROUNDS=['WILD_CARD','DIVISION','LCS','WORLD_SERIES'];

          function poSeriesCard(s){
            var done=s.seriesStatus==='CLINCHED';
            var aWin=done&&s.winnerTeamId===s.teamAId;
            var bWin=done&&s.winnerTeamId===s.teamBId;
            function row(ab,w,adv){
              return '<div class="pobsr'+(adv?' adv':'')+'"><span class="t">'+hTeam(ab)
                +'<span>'+esc(ab||'TBD')+'</span></span><span class="w">'+(isNum(w)?w:'—')+'</span></div>';
            }
            return '<div class="pobs'+(done?' win':'')+'">'
              +row(s.teamAAbbrev,s.winsA,!done||aWin)
              +row(s.teamBAbbrev,s.winsB,!done||bWin)
              +'<div class="pobsl'+(done?' clinched':'')+'">'
                +esc(s.seriesScoreLine||'SERIES STATE UNKNOWN')
                +(done&&s.advancesToRound?' → '+esc(PO_ROUND_LABEL[s.advancesToRound]||s.advancesToRound):'')
                +'</div></div>';
          }

          function poBracket(){
            var b=poBlock()||{},br=b.bracket||{},ser=b.series||{};
            var cols=PO_ROUNDS.map(function(r){
              var ids=br[r]||[];
              var body=ids.length
                ? ids.map(function(id){return ser[id]?poSeriesCard(ser[id]):'';}).join('')
                : '<div class="poempty">not reached</div>';
              return '<div class="pobrr"><div class="pobrh">'+esc(PO_ROUND_LABEL[r]||r)+'</div>'+body+'</div>';
            }).join('');
            return '<div class="pobr">'+cols+'</div>';
          }

          /* ---- the MODEL bracket: the existing simulator, and its real status ---- */
          function poModelBracket(){
            var sv=D.simulator||{};
            var head='<div class="pormk"><b>This is a simulation estimate, not a calibrated '
              +'probability.</b> The postseason simulator’s format is verified against '
              +'MLB’s published rules; whether its probabilities are well calibrated has '
              +'not been measured, so nothing here may be read as a measured chance. '
              +'Monte Carlo convergence is numerical stability, not predictive accuracy.';
            if(sv.status)head+=' Simulator status <b>'+esc(String(sv.status))+'</b>.';
            if(sv.showProbabilities===false)
              head+=' It is currently withholding probabilities'
                +((sv.blockingReasons&&sv.blockingReasons.length)
                  ?' ('+esc(sv.blockingReasons.join('; '))+')':'')+'.';
            if(isNum(sv.simulationCount))head+=' '+sv.simulationCount.toLocaleString()+' simulations.';
            head+='</div>';
            var body;
            if(sv.publicationEligible===false||sv.showProbabilities===false){
              body='<div class="poempty">No model bracket is published while the simulator is '
                +'withholding output. That is the honest state, not an error — a bracket drawn '
                +'from a source that declines to publish its numbers would be a picture of nothing.</div>';
            }else{
              body='<div class="poempty">The simulator artifact is published under the '
                +'Simulator section. Its season-long bracket projection is rendered there; '
                +'this release does not duplicate it here.</div>';
            }
            return head+body;
          }

          function poCoverage(){
            var b=poBlock()||{};
            var c=b.coverageSummary||{};
            var raw=b.coverage||{};
            var complete=c.coverageComplete===true;
            var diag=[].concat(raw.missing||[],raw.duplicate||[],raw.unknown||[]);
            var w=b.windows||{};
            return '<div class="pocov'+(complete?'':' bad')+'">'
              +'<b>'+(isNum(c.publishedGameCount)?c.publishedGameCount:'?')+' of '
              +(isNum(c.expectedGameCount)?c.expectedGameCount:'?')+'</b>'
              +'<span>canonical playoff games analysed</span>'
              +'<b>'+(complete?'COVERAGE COMPLETE':'COVERAGE INCOMPLETE')+'</b>'
              +(isNum(c.missingGameCount)&&c.missingGameCount?'<span>missing '+c.missingGameCount+'</span>':'')
              +(isNum(c.duplicateGameCount)&&c.duplicateGameCount?'<span>duplicate '+c.duplicateGameCount+'</span>':'')
              +(isNum(c.unknownGameCount)&&c.unknownGameCount?'<span>unknown '+c.unknownGameCount+'</span>':'')
              +(diag.length?'<span title="'+esc(JSON.stringify(diag))+'">'+diag.length+' diagnostic(s)</span>':'')
              +((w.excludedUnresolved&&w.excludedUnresolved.games)
                ?'<span title="'+esc(w.excludedUnresolved.note||'')+'">'
                  +w.excludedUnresolved.games+' future game(s) still awaiting participants</span>':'')
              +'</div>';
          }

          function renderPlayoffs(){
            var el=$('playoffs');
            if(!el)return;
            var b=poBlock();
            if(!b){
              el.innerHTML=hmSec('Playoffs','no postseason block in this payload',
                '<div class="poempty">This build of the dashboard reads a <code>postseason</code> '
                +'block from the payload and the current payload does not carry one. Nothing is '
                +'inferred from the regular-season slate — a playoff surface assembled out of '
                +'guesses would be worse than an empty one.</div>');
              return;
            }
            if(!b.active){
              el.innerHTML=hmSec('Playoffs','no postseason games',
                '<div class="poempty">'+esc(b.reason==='no_postseason_games_in_schedule'
                  ? 'The canonical schedule has no postseason game for this date.'
                  : ('Postseason block inactive: '+(b.reason||'no reason recorded')+'.'))+'</div>');
              return;
            }
            var games=(b.games||[]).slice().sort(function(x,y){
              return String(x.gameDate||'').localeCompare(String(y.gameDate||''));});
            var out=poCoverage();
            out+=hmSec("Today’s playoff games",
              games.length+' game'+(games.length===1?'':'s')+' · every canonical game gets a record',
              games.length?('<div class="pogrid">'+games.map(poGameCard).join('')+'</div>')
                :'<div class="poempty">No playoff game is scheduled for this slate date.</div>');
            out+=hmSec('Live bracket — actual results',
              'reconstructed from the canonical schedule; uses no browser storage',
              poBracket());
            out+=hmSec('Model bracket','simulation estimate, calibration not measured',
              poModelBracket());
            el.innerHTML=out;
          }

          function renderProps(){"""

          # ------------------------------------------------------- 5. call the renderer
          # renderAll already isolates every section behind its own try/catch and routes
          # a failure into renderDiag. Adding a second, parallel guard here would give
          # the playoffs section different failure behaviour from the other twelve for
          # no reason -- so it joins the existing list instead.
          CALL_ANCHOR = ("  [['meta',renderMeta],['home',renderHome],['slate',renderSlate],"
                         "['picks',renderPicks],['matchups',renderMatchups],")
          CALL_NEW = ("  [['meta',renderMeta],['home',renderHome],"
                      "['playoffs',renderPlayoffs],['slate',renderSlate],"
                      "['picks',renderPicks],['matchups',renderMatchups],")


          def patch(text: str, path: str) -> str:
              edits = [
                  ("playoffs css", CSS_ANCHOR, CSS_NEW),
                  ("playoffs section", SEC_ANCHOR, SEC_NEW),
                  ("nav label", NAV_OLD, NAV_NEW),
                  ("primary nav", PRIM_OLD, PRIM_NEW),
                  ("renderer", RENDER_ANCHOR, RENDERER),
                  ("render call", CALL_ANCHOR, CALL_NEW),
              ]
              for label, old, new in edits:
                  n = text.count(old)
                  if n != 1:
                      FAIL.append("%s / %s: anchor found %d time(s), expected 1"
                                  % (path, label, n))
                      continue
                  text = text.replace(old, new, 1)
              return text


          def main() -> int:
              out = {}
              for fn in FILES:
                  p = pathlib.Path(fn)
                  if not p.exists():
                      FAIL.append("%s: missing" % fn)
                      continue
                  s = p.read_text(encoding="utf-8")
                  out[fn] = (s, patch(s, fn))
              if FAIL:
                  print("ANCHOR FAILURES -- nothing written:")
                  for f in FAIL:
                      print("  - " + f)
                  return 1
              for fn, (before, after) in out.items():
                  pathlib.Path(fn).write_text(after, encoding="utf-8")
                  print("  patched %-16s %d -> %d bytes" % (fn, len(before), len(after)))
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PEOF
          python3 pl1.py 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Gate
        run: |
          python3 - <<'GEOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, pathlib, sys
          bad, ok = [], []
          def chk(c, l): (ok if c else bad).append(l)
          for fn in ("current.html", "index.html", "preview.html"):
              s = pathlib.Path(fn).read_text(encoding="utf-8")
              M = '<script id="bb-data" type="application/json">'
              i = s.index(M) + len(M)
              json.loads(s[i:s.index("</script>", i)])
              chk(True, fn + ": payload still parses")
              for must in ("function renderPlayoffs(", "function poGameCard(",
                           "function poBracket(", "function poCoverage(",
                           'id="playoffs"', "['playoffs',renderPlayoffs]",
                           "NAV_PRIMARY=['home','playoffs'"):
                  chk(must in s, fn + ": has " + must)
              chk(s.count("function renderPlayoffs(") == 1, fn + ": exactly one renderPlayoffs")
              # Releases 1 and 2 must survive
              for must in ("function renderHome(", "function renderProps(",
                           "function ppCard(", "function legRetired(", "--bg:#0b1220"):
                  chk(must in s, fn + ": earlier release intact -- " + must)
              for tid in ("home","playoffs","slate","picks","matchups","props","parlay",
                          "performance","library","simulator","admin","method","backtests"):
                  chk(('id="' + tid + '"') in s, fn + ": section " + tid + " present")
              # honesty invariants
              chk("not a calibrated" in s, fn + ": simulator disclosure present")
              chk("uses no browser storage" in s, fn + ": actual-bracket claim stated")
              for forbidden in ("GUARANTEED", "SAFE BET"):
                  chk(forbidden not in s, fn + ": does not contain " + forbidden)
          a = pathlib.Path("current.html").read_text(encoding="utf-8")
          b = pathlib.Path("index.html").read_text(encoding="utf-8")
          c = pathlib.Path("preview.html").read_text(encoding="utf-8")
          chk(a == b == c, "the three pages agree")
          for x in ok: print("ok   " + x)
          if bad:
              print("")
              for x in bad: print("FAIL " + x)
              print("\n%d GATE FAILURE(S)" % len(bad))
              sys.exit(1)
          print("\ngate passed: %d checks" % len(ok))
          GEOF

