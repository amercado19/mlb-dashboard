name: apply-playoffs-ux

# PLAYOFF RELEASE 2 (presentation) + the repair of this repository's only
# push gate, in one commit, behind that gate.
#
# WHY BOTH IN ONE JOB. tests.yml has failed on every push for days: eleven
# assertions from a stale harness, one from a product defect, one from a
# selector that moved. A gate that is always red gates nothing, so shipping a
# UX release "verified by CI" while CI was red would be a claim I could not
# support. The suite runs HERE, BEFORE the commit is made, and if it fails
# nothing is pushed.
#
# WHY IT RETRIES. The pipeline bot rewrites current.html every ~25 minutes. A
# rebase of a 1.4MB single-file patch onto one of those publishes would
# conflict on every hunk, so each attempt resets to the newest main and
# RE-APPLIES to that content. Both patchers are anchored on renderer source,
# which a publish does not touch.
#
# WHY IT STAGES BY NAME. node_modules is tracked in this repository and the
# test step installs into it, so `git add -A` would commit a few hundred
# untracked dependency files. Only the eight paths this release actually
# touches are staged.
#
# WHY IT DELETES ITSELF. A patch that can be applied twice will be. Both
# patchers refuse a second run, and the installer and its two scripts go in
# the same commit so there is nothing left to dispatch by accident.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.47.0
          npx playwright install --with-deps chromium

      - name: Apply, verify and push
        run: |
          set -uo pipefail
          git config user.name "amercado19"
          git config user.email "andresmercado1919@gmail.com"

          # Kept outside the work tree so a reset cannot take them away.
          mkdir -p /tmp/inst
          cp pl3.py pl4.py /tmp/inst/

          attempt=0
          while [ "$attempt" -lt 4 ]; do
            attempt=$((attempt + 1))
            echo "::group::attempt $attempt"
            echo "#### attempt $attempt" >> "$GITHUB_STEP_SUMMARY"

            git fetch origin main -q
            git reset --hard origin/main -q
            cp /tmp/inst/pl3.py /tmp/inst/pl4.py .
            echo "base $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

            python3 pl3.py 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$?" != "0" ]; then
              echo "::error::pl3 refused to apply -- nothing written"
              exit 1
            fi
            python3 pl4.py 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$?" != "0" ]; then
              echo "::error::pl4 refused to apply -- nothing written"
              exit 1
            fi

            python3 - <<'PEOF' 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          import pathlib, sys
          NEED = {
              "poTip": "function poTip(btn){",
              "poNow": "function poNow(g){",
              "poLegend": "function poLegend(){",
              "poSetRound": "function poSetRound(r){",
              "poLinks": "function poLinks(g){",
              "chip is a button": 'class="pomkc s-\'+esc(st)+\'" aria-expanded="false"',
              "reason panel": '<div class="potip"></div>',
              "why is collapsed": '<details class="powhyd"',
              "round tabs css": ".pobr.sel .pobrr{display:none}",
              "advance line": 'class="pobsadv"',
              "matchup anchor": 'id="mxg-\'+g.gamePk+\'"',
              "agreement why renders": 'class="masumw"',
          }
          ONCE = (".ponow{font-family:var(--mono)", "function poTip(btn){",
                  'class="masumw"')
          bad = []
          for fn in ("current.html", "index.html", "preview.html"):
              s = pathlib.Path(fn).read_text(encoding="utf-8")
              for label, needle in NEED.items():
                  if needle not in s:
                      bad.append("%s: %s missing" % (fn, label))
              for needle in ONCE:
                  n = s.count(needle)
                  if n != 1:
                      bad.append("%s: %r appears %d times, expected 1" % (fn, needle, n))
              # the no-order lineup drawer must now carry the badge too
              if s.count("<span class=\"s3n\">'+lineupWord3(gState)+'") != 2:
                  bad.append("%s: expected the lineup badge in BOTH drawer branches, found %d"
                             % (fn, s.count("<span class=\"s3n\">'+lineupWord3(gState)+'")))
          t = pathlib.Path("tests/contract_e2e.test.js").read_text(encoding="utf-8")
          if "view lineup/i.test" not in t:
              bad.append("contract_e2e: the lineup selector was not repointed")
          if ".s3st" in t:
              bad.append("contract_e2e: still reads the removed .s3st selector")
          h = pathlib.Path("tests/daily_hero.test.js").read_text(encoding="utf-8")
          for n in ("mktDeadRow", "recFor", "_HERO_D"):
              if n not in h:
                  bad.append("daily_hero: harness is missing %s" % n)
          print("### post-conditions")
          print("```")
          for b in bad:
              print("FAIL " + b)
          if not bad:
              print("ok   every marker present, and exactly once where it must be")
          print("```")
          sys.exit(1 if bad else 0)
          PEOF
            if [ "$?" != "0" ]; then
              echo "::error::post-conditions failed -- refusing to commit"
              exit 1
            fi

            echo "### the dashboard suite, which this commit also repairs" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            bash tests/run_all.sh > /tmp/suite.txt 2>&1
            rc=$?
            grep -E '^(pass|FAIL)|test file|all test' /tmp/suite.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            if [ "$rc" != "0" ]; then
              echo "::error::the dashboard suite failed -- refusing to commit"
              tail -150 /tmp/suite.txt
              exit 1
            fi

            # STAGE BY NAME. node_modules is tracked here and the test step
            # installs into it; `git add -A` would sweep that in.
            git add -- current.html index.html preview.html \
                       tests/contract_e2e.test.js tests/daily_hero.test.js
            git rm -q --ignore-unmatch -- pl3.py pl4.py \
                       .github/workflows/apply-playoffs-ux.yml

            if git diff --cached --quiet; then
              echo "nothing staged -- already applied?" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            git diff --cached --stat >> "$GITHUB_STEP_SUMMARY"

            git commit -q -F - <<'MEOF'
          Playoff Release 2: presentation, and the push gate that was always red

          TRACK B OF THE CONVERGED PLAN. UX may change what is SHOWN, how it is
          grouped, what is progressively disclosed and what is interactive. It
          may not change what is CLAIMED, and it may not increase the apparent
          epistemic strength of a state -- sorting, prominence, default
          expansion and iconography can turn WATCH into something that feels
          like PICK without changing the word. So chips are not reordered by
          favourability, nothing auto-expands because it is a PICK, and the
          state glyphs are one family of circles with no direction, PICK and
          LEAN deliberately sharing one.

          The playoff card now reads in the order a phone needs: who is playing
          and who leads the series, when and what state the game is in, WHAT IS
          ACTIONABLE, the starters, the market chips, and last the WHY block --
          collapsed, with a summary that counts what is inside it rather than
          hiding an unknown quantity. Chip reasons were title= only, which on a
          phone is not a subtle explanation but an absent one; every chip is now
          a button whose press puts the producer's own sentence inside the card,
          reachable by tap and by keyboard. A legend states, for all six states,
          whether it is temporary or permanent and what "actionable" means, so
          the per-card summary is a restatement of published states rather than
          a new claim. The bracket gets round tabs below 700px, in CSS, with
          every round still in the DOM -- hiding a round by removing it would
          make the coverage checks pass by looking at less of the page. A
          clinched series names who advances and where, on its own line. And the
          cards finally reach the rest of the product: the game's full matchup
          card, and that game's own 1+ hit and home-run boards, but only when
          those boards published rows for that game.

          AND THE GATE. tests.yml has failed on every push for days, so a real
          regression would have landed inside a wall of pre-existing failures
          with nothing to distinguish it. Three files, none failing for the
          reason its name suggests. daily_hero's eleven failures were a stale
          harness: hProp and hMoneyline route every row through mktDeadRow and
          recFor now, the harness never brought those across, hTileSafe caught
          the ReferenceError and rendered an empty card, and eleven assertions
          about what a Hero card may claim failed because no card was ever
          built. model_agreement's single failure was the test being right: its
          why sentence had moved into a title= attribute, the same hover-only
          defect the playoff chips had, so the sentence renders now instead of
          the assertion being loosened. contract_e2e was reading .s3st for the
          lineup word, which was deliberately removed from the card head and now
          lives on the View-lineup drawer badge; the assertion's intent is
          unchanged and only the selector moves -- and the no-batting-order
          branch of that drawer omitted the badge entirely, so those cards
          genuinely could not say any of the four words. That one was real.

          Verified before this commit was made: the full node suite green for
          the first time in days, and the playoff surface checked in a real
          browser at 375/390/414/768/1200/1440 -- four cards, four series,
          thirty-two chips, the rendered (market,state) set compared pair by
          pair against the payload, chips in PO_MARKET_ORDER rather than sorted
          by strength, every state carrying its word and not only its colour, a
          reason revealed by click and closed by a second click, exactly one
          expanded chip at a time, WHY closed below 768 and open above, one
          visible round column below 700 and four above, and a synthetic
          clinched series to exercise the advance line and the default round
          that today's 1-0 slate cannot reach.

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01ANJSLwtfnVuf8PPgpvpWtb
          MEOF

            if git push origin HEAD:main; then
              echo "PUSHED $(git rev-parse --short HEAD) on attempt $attempt" >> "$GITHUB_STEP_SUMMARY"
              echo "::endgroup::"
              exit 0
            fi
            echo "push rejected (main moved) -- re-applying onto the new head"
            echo "::endgroup::"
            sleep 5
          done

          echo "::error::could not push after $attempt attempts"
          exit 1
