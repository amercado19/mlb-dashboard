name: apply-freshness-banner

# ONE-SHOT. Adds the stale-data banner to the Slate, runs the suite, commits
# and deletes itself.
#
# The banner is keyed on the AGE OF THE SOURCE CHECK, not on whether a lineup
# exists. On 2026-09-16 the page showed PROJECTED for every game at 12:35 ET
# from a 06:18Z payload and said nothing; PROJECTED is correct at 2am and a lie
# by lunchtime. Its thresholds mirror scripts/live_refresh_gate.py so the
# page and the pipeline cannot disagree about what "stale" means.
#
# It renders NOTHING when the payload is inside its limit, so a healthy Slate
# is byte-identical to before.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply the ops
        run: |
          python3 - <<'PYEOF'
          import base64, gzip, json, pathlib, sys
          B64 = "".join("""
          H4sIAD/PqmoC/71W23LbNhD9lY3ahmQsUpRvtSnJU8dW4rS+ZCzlIbE8GZCERIxJgAOAllTb/94FqJsd56md6oEiFwdn7ws8NMaS
          qqwRwc1NI1ATydKHlKkyJ/PIfHTMw9e0QImmfiLyquAqkrSkRLuk0sIfszxvFowXZObin7u7E5azZjsMf/Oa7bH0vM6ElFF7t5w9
