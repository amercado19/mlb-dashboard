          6LCc1YJYyJTKqI3fSuQshV/i3b2d8HCx4Od0rKPdn61KkrJKGbZOTJK7iRQVTyM5iYnbPgibBzvNw2bQDr1n9kP8MBZc+4r9TaN2
          O9jD3VYwpWyS6eggDDs51Rr5VUkSY24Q7tKig74JGS1MeE6JQP6MFTlr+D2Rru/rmX5hBNuEh2sjlJ7nNOJCFiR/RlFUmqbevy2W
          2ybcNPBlXHGbMJCUYyQHBux6D3U54XrrHfirH3y47g/OLvuDAbw/vrzsX4O7HW7v++Gh3973NoA//kYcAK44rPGgM6agJBMKKhNT
          msLn66s/+yfD/inkjNOqVDAWEug9lXOYkIIC0Vgs0c6eJesPYSxFAQQ55rkgKcQVy7UBhftR++BbEwhPQREsFy5QGZ8AiUWlgelg
          Q9eUKMuHGJhKgSh0FEm2SYGyhSlAZ0xpZZZiZIjnkGPgMs3QKp2hB8a8KRbjio7gTlqbYADWz4wYUxAyBy1A0zy3aykbjynGP6HB
          iNvNA2EXYsI5lYBhuqNzDBCmyYiPP/bh6gMMz/owuPpyfdKHk7P+yV9N6wJiphlFmARiuRYOZKQsKVdGsfUlgFHjUoAYj1nCSL6E
          lUJhecGc6lHDGj9qiEpCSjRBOyyhFrgtTw3THRdTg5NrJzQojTWk7GbB83kdH5oI/EZPCJiyx2QElmyYmQCabkBKBQWTEnOuEslK
          rVo5u6ffJbXd8n2CtEE5R/NJovN5B9jYcuupsEVi+XAmkYmkGHnBKXpnEIXRW6fWGMW0KbgKPYgp3DPF4nwV+E960QhqXTNYUpgo
          DCpfZLKuNuRkXLGUIqHC8BVMN3E6LaKeUZLrbA62oUxI5mppOBAFSU4JNy9oDFZMAO9aG71o/T03jBeowsxkNRQfscRMYwL6vSHq
          9Xq8yvPHx2ciHH90jBlNPfRHVzhncA52ftjc7R2GHqwge68hcOOKZOdVjp39NWK/RjxT+vTSNU6Vem9r25ViqmqvcLrBhPLeaYBP
          KjFs6bE2SXbfoGClwHE6S7TundqSIFJR12BqtH4Ni+2Hsey5dgdWrev52mvth/izGJxzJrmcznQ9a3SGic+IrQOTP7loC5upmtOA
          bfAtg3Xl8fHm1gtwbPVJkrlLr11Zu2gjJwOl3741z8CcU+WbXs/58vnk6uLT5UdnaXqnhtuY6J4MloHQrwBMKnruRPtr3zY9W6Wr
          67f3XmzHFevEZg11jcSrnTPfFvrkLRO/gd+MMzz7YTSX7VOViSjM2WkDuer+jTDa1um9qHlrxFJnnbxuzyJ/phV1LpsOp3TdxSsr
          1tpMH/c4nYKJlqu9QItzkZCcDnGWD7REtOtQ7n8ZOM06SAAPZs5/w4ESOccFlSwhrUs6/f5VyDuniaNERg6v7IJj7lF4QEfONl6G
          Jkw7i8gtbe6m7B67nyjVGzVWtwCcoVLkFEVmeFZq1DhyauVbTjc+Oj0eHsN1356+cNo/P/7aP+224g2MuXccnROlMd6pmTjOFlWJ
          a5z1thxzVo6qMIx/R/kF0VlgL0iLuBoAWo0tIlaES/i6HxCw2GuuiWFzg8bmasHSbVlT1paxo/PFYW5mbykFvhV4AJpqwMme430R
          EiJx9i+OHsXwIDTNyINui20wtTB0R86LefLDtcVebAB+dR1lhI4XMDNozoYX572UsHx+RqVwva2UJjj6BR9UBV5O5ybzJYoLshDg
          O5ZTuoUV1d67FIZ+KxbpvFNfjX6i4dXxtvVf6b29ffoHqCZz+JIMAAA=
          """.split())
          ops = json.loads(gzip.decompress(base64.b64decode(B64)).decode())['fresh']
          planned = []
          for t in ('current.html', 'index.html', 'preview.html'):
              p = pathlib.Path(t)
              s = p.read_text(encoding='utf-8')
              for k, (old, new) in enumerate(ops):
                  n = s.count(old)
                  if n != 1:
                      sys.exit('%s: op %d matched %d times (need exactly 1) '
                               '-- NOTHING WRITTEN' % (t, k, n))
                  s = s.replace(old, new, 1)
              planned.append((p, s))
          for p, s in planned:
              p.write_text(s, encoding='utf-8')
              print('applied %d op(s) to %s' % (len(ops), p))
          PYEOF

      - name: The banner must not fire on a fresh payload
        run: |
          python3 - <<'PYEOF'
          import pathlib, sys
          src = pathlib.Path('current.html').read_text(encoding='utf-8')
          for token in ('freshnessBanner', 'freshLimitMins', 'freshwarn',
                        'DATA REFRESH DELAYED'):
              if token not in src:
                  sys.exit('missing expected token %r' % token)
          # The thresholds must match the pipeline gate's policy exactly.
          for v in ('return 15', 'return 30', 'return 60', 'return 180'):
              if v not in src:
                  sys.exit('freshness threshold %r is missing' % v)
          print('ok: banner present and thresholds mirror the pipeline gate')
          PYEOF

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.47.0
          npx playwright install --with-deps chromium

      - name: Run the suite
        run: bash tests/run_all.sh

      - name: Commit, and remove this workflow in the same commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-freshness-banner.yml
          git add -A
          if git diff --cached --quiet; then
            echo "nothing staged -- refusing to make an empty commit"
            exit 1
          fi
          git diff --cached --name-status
          git commit -F - <<'MSGEOF'
          Say so when the data is old, instead of showing PROJECTED as if current

          On 2026-09-16 this page showed PROJECTED lineups for all fifteen games
          at 12:35 ET, from a payload built at 06:18Z, and gave no indication
          that anything was wrong. PROJECTED was not a false label -- at 2am no
          official lineup exists -- but by lunchtime the same word was a lie,
          and the page had no way to tell the two apart.

          freshnessBanner() keys on the AGE OF THE SOURCE CHECK rather than on
          whether a lineup happens to exist, because "no official lineup posted
          yet" and "our data is too old to know" are different states and only
          the second is a warning. Thresholds are first-pitch aware -- 15 min
          inside 90 minutes of a game, 30 to three hours, 60 to six, 180
          otherwise -- and they mirror scripts/live_refresh_gate.py exactly. If
          the page and the pipeline ever disagree about what stale means, one of
          them is wrong and that should be visible rather than silent.

          It renders NOTHING when the payload is inside its limit and nothing
          when no game is upcoming, so a healthy Slate is unchanged and the v3
          card stays as clean as it was. Verified at 375/414/768/1200/1440 with
          zero horizontal overflow, 15 cards, no renderer diagnostics and no
          page errors, in both the stale and the fresh state.

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01ANJSLwtfnVuf8PPgpvpWtb
          MSGEOF
          git push origin HEAD:main
