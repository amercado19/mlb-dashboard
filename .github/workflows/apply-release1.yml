          The published modelParlay is ATL +1.5 + AZ +1.5 + Eduardo Valencia
          1+ Double. That third leg is betType h2, and h2's governance status
          is KILL: "2B props hit 23.7% over 30 days, unprofitable at any
          realistic price". A killed market cannot be a pick, so it cannot be
          a leg of one either -- a parlay is a conjunction of
          recommendations and cannot be cleaner than its worst leg.

          Both surfaces now refuse the ticket, on the same terms the
          started-game rule already used: REFUSED, NEVER TRIMMED. Dropping
          the dead leg would publish a two-leg bet under a three-leg
          ticket's name and probability. The producer is still emitting it;
          that is filed as a pipeline defect and is not fixed here.

