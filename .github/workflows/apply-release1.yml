          cat > r1_fix.py <<'PEOF'
          """RELEASE 1, STAGE D — three defects found by looking at the rendered page.

          1. A RETIRED MARKET IS INSIDE A CURRENT RECOMMENDATION
          ------------------------------------------------------
          Today's published `modelParlay` is:

              ATL +1.5  ·  AZ +1.5  ·  Eduardo Valencia 1+ Double

          That third leg has `betType: "h2"`, and h2's governance status is **KILL** —
          "2B props hit 23.7% over 30 days, unprofitable at any realistic price". A
          killed market is not allowed to be a pick, and it is not allowed to be a leg
          of a pick either; a parlay is a conjunction of recommendations, so it cannot
          be cleaner than its worst leg.

          The producer is emitting it, which is a pipeline defect and is filed as one.
          What this change does is the consumer half, and it follows the rule the
          Model Parlay tile already established for started games: **refuse the
          ticket, never trim it**. Dropping the dead leg would publish a two-leg bet
          under a three-leg ticket's name and probability, which is a different bet.

          The same predicate is applied on Home and on the Picks hero, because two
          surfaces disagreeing about whether a ticket is live is worse than either
          answer on its own.

          2. THE PARLAY CARDS DID NOT CLOSE THEIR OWN DIVS
          ------------------------------------------------
          `hmParlay` opened `.hmpar` and never closed it, so the priced card nested
          inside the model card and the entire following section — Recent results —
          was absorbed into the parlay grid and rendered as a second column. Visible
          immediately in a screenshot, invisible to a passing JS test, which is why
          §25 asks for real browser screenshots.

          3. RECENT RESULTS SHOWED THE OLDEST WEEK, NOT THE NEWEST
          ---------------------------------------------------------
          `boardHistory` is published NEWEST FIRST (index 0 is 2026-09-21, the last
          index is 2026-08-23). `slice(-7)` therefore took the seven oldest days and
          labelled them "last 7 graded days" — a month stale, presented as current.
          Sorted explicitly by date now rather than trusting array order, so the
          section cannot silently invert again if the producer's ordering changes.
          """
          from __future__ import annotations

          import pathlib
          import sys

          FILES = ("current.html", "index.html", "preview.html")
          FAIL: list[str] = []

          # ---------------------------------------------- 1. the retired-leg predicate
          RETIRED_JS = r"""
          /* A LEG'S MARKET MUST BE ALIVE, NOT JUST ITS GAME.
             `mktDead` answers "has this game started". It says nothing about whether
             the market the leg sits in has been retired. Today's model parlay carries
             a 1+ Double leg whose market is KILL ("2B props hit 23.7% over 30 days,
             unprofitable at any realistic price"), and nothing was stopping it.
             betType is the leg's own vocabulary; the boards are keyed by family, and
             these are the pairs that differ. */
          var LEG_FAM={hit:'h1',h1:'h1',hr:'hr',homerun:'hr',h2:'h2','2b':'h2',
                       tb2:'tb2',hrr:'hrr',ou:'ou',total:'ou'};
          function legRetired(l){
            if(!l)return false;
            var bt=String(l.betType||l.market||l.fam||'').toLowerCase();
            var fam=LEG_FAM[bt];
            /* Unknown or market-less legs (moneyline, run line) are not prop markets
               and have no retirement state to check. Absence is not a failure here. */
            return fam ? boardRetired(fam) : false;
          }
          function legsRetired(legs){
            return (legs||[]).some(legRetired);
          }
          function retiredLegNames(legs){
            return (legs||[]).filter(legRetired)
              .map(function(l){return String(l.desc||l.betType||'leg');});
          }
          """

          # ------------------------------------------------- 2. close the parlay cards
          OLD_PAR = """    out.push('<div class="hmpar"><div class="hmparh">MODEL PARLAY<span>no sportsbook price</span></div>'
                +(deadleg
                  ? '<div class="hmparn">A leg’s game is underway. This ticket is not current.</div>'
                  : '<ol class="hmparl">'+mp.legs.map(function(l){
                      return '<li>'+esc(l.desc||'leg')+'</li>';}).join('')+'</ol>'
                    +'<div class="hmparf">'+(isNum(mp.combinedProbability)
                        ? (100*mp.combinedProbability).toFixed(1)+'% <span>independence estimate</span>'
                        : '<span>combined chance not measured</span>')+'</div>'));
            }"""

          NEW_PAR = """    var retired=retiredLegNames(mp.legs);
              /* REFUSED, NOT TRIMMED. A three-leg ticket minus its dead leg is a
                 two-leg bet wearing a three-leg ticket's name and probability. */
              var why=deadleg
                ? 'A leg’s game is underway, so this ticket is not current.'
                : (retired.length
                   ? 'A leg sits in a retired market (' + retired.join(', ')
                     + '), so this ticket is not offered.'
                   : '');
              out.push('<div class="hmpar"><div class="hmparh">MODEL PARLAY<span>no sportsbook price</span></div>'
                +(why
                  ? '<div class="hmparn">'+esc(why)+'</div>'
                  : '<ol class="hmparl">'+mp.legs.map(function(l){
                      return '<li>'+esc(l.desc||'leg')+'</li>';}).join('')+'</ol>'
                    +'<div class="hmparf">'+(isNum(mp.combinedProbability)
                        ? (100*mp.combinedProbability).toFixed(1)+'% <span>independence estimate</span>'
                        : '<span>combined chance not measured</span>')+'</div>')
                +'</div>');
            }"""

          OLD_PP = """      +'<div class="hmparf">'+(isNum(c.americanOdds)
                    ? (c.americanOdds>0?'+':'')+c.americanOdds+' <span>book price</span>'
                    : '<span>no book price</span>')+'</div>');
            }"""
          NEW_PP = """      +'<div class="hmparf">'+(isNum(c.americanOdds)
                    ? (c.americanOdds>0?'+':'')+c.americanOdds+' <span>book price</span>'
                    : '<span>no book price</span>')+'</div></div>');
            }"""

          # guard the priced card the same way
          OLD_PPG = """  var pp=D.pricedParlay||D.topParlay;
            if(pp&&(pp.legs||[]).length&&pp.parlayValid!==false){
              var c=pp.combined||{};"""
          NEW_PPG = """  var pp=D.pricedParlay||D.topParlay;
            if(pp&&(pp.legs||[]).length&&pp.parlayValid!==false
               &&!legsRetired(pp.legs)&&!(pp.legs||[]).some(function(l){return mktDead(l.gamePk);})){
              var c=pp.combined||{};"""

          # --------------------------------------------- 3. newest seven, by date
          OLD_BH = """  var bh=(D.boardHistory||[]).slice(-7).reverse();"""
          NEW_BH = """  /* boardHistory is published NEWEST FIRST, so slice(-7) took the seven
               OLDEST days and called them "last 7". Sorted explicitly rather than
               trusting the producer's array order. */
            var bh=(D.boardHistory||[]).slice().sort(function(a,b){
              return String(b.date||'').localeCompare(String(a.date||''));}).slice(0,7);"""

          # ------------------------------- the Picks hero must agree with Home
          OLD_HERO = """  var mpGone=legs.filter(function(l){return l.gamePk!=null&&mktDead(l.gamePk);});"""
          NEW_HERO = """  /* AND THE MARKET MUST BE ALIVE TOO. The started-game rule above was
               added after a ticket was published on two games already underway; the
               same ticket shape can also carry a leg whose MARKET is retired, which
               today's payload does (a 1+ Double leg, h2, status KILL). Refused on the
               same terms and for the same reason: a three-leg ticket minus its dead
               leg is a different bet under this one's name. */
            var mpRet=retiredLegNames(legs);
            if(mpRet.length)
              return hNone('Best model parlay',
                'A leg sits in a retired market (' + mpRet.join(', ')
                + '). The ticket is refused rather than trimmed.',
                'RETIRED MARKET IN TICKET');
            var mpGone=legs.filter(function(l){return l.gamePk!=null&&mktDead(l.gamePk);});"""


          def patch(text: str, path: str) -> str:
              edits = [
                  ("retired-leg predicate", "function hmSec(title,sub,body,more){",
                   RETIRED_JS.strip("\n") + "\n\nfunction hmSec(title,sub,body,more){"),
                  ("model parlay card close", OLD_PAR, NEW_PAR),
                  ("priced parlay guard", OLD_PPG, NEW_PPG),
                  ("priced parlay card close", OLD_PP, NEW_PP),
                  ("recent results ordering", OLD_BH, NEW_BH),
                  ("hero agrees with home", OLD_HERO, NEW_HERO),
              ]
              for label, old, new in edits:
                  n = text.count(old)
                  if n != 1:
                      FAIL.append("%s / %s: anchor found %d time(s), expected 1"
                                  % (path, label, n))
                      continue
                  text = text.replace(old, new, 1)
              return text


          def main() -> int:
              out = {}
              for fn in FILES:
                  p = pathlib.Path(fn)
                  if not p.exists():
                      FAIL.append("%s: missing" % fn)
                      continue
                  s = p.read_text(encoding="utf-8")
                  out[fn] = (s, patch(s, fn))
              if FAIL:
                  print("ANCHOR FAILURES -- nothing written:")
                  for f in FAIL:
                      print("  - " + f)
                  return 1
              for fn, (before, after) in out.items():
                  pathlib.Path(fn).write_text(after, encoding="utf-8")
                  print("  patched %-16s %d -> %d bytes" % (fn, len(before), len(after)))
              return 0


          if __name__ == "__main__":
              sys.exit(main())
