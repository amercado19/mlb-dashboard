name: apply-release1

# ONE-SHOT INSTALLER. Deletes itself in the same commit.
#
# MLB PREDICT — PREMIUM REDESIGN, RELEASE 1
#
# Three stages, each an anchored patch that aborts the job if any anchor
# does not match exactly once:
#
#   r1_palette  the design system goes dark, by ROLE not by hex. 644 of the
#               file's colour uses already run through var(--...), so :root
#               carries most of it; the other 119 are hardcoded light values
#               in the stylesheet and inside JS string literals, remapped
#               with backgrounds and text treated differently so a tinted
#               status box survives inversion instead of turning to mud.
#
#   r1_home     five primary destinations and a new Home. Section ids are
#               UNCHANGED, so every deep link and showTab() call still
#               resolves; only labels and the primary row move. The featured
#               picks are dailyHero() verbatim -- a second selection engine
#               for a prettier Home would disagree with the first.
#
#   r1_fix      three defects found by looking at the rendered page, one of
#               which is a real correctness bug: the published modelParlay
#               carries a 1+ Double leg whose market status is KILL. The
#               ticket is now refused, not trimmed.
#
# Verified before packaging, at 375 / 390 / 414 / 768 / 1200 / 1440:
# 0 horizontal overflow, 0 broken images, 0 page errors, 0 [object Object],
# and all 12 sections reachable and populated.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: R1 Palette
        run: |
          cat > r1_palette.py <<'PEOF'
          """RELEASE 1, STAGE A — the design system goes dark, by role not by hex.

          WHY A MAPPING TABLE AND NOT 119 HAND EDITS
          ------------------------------------------
          644 of the roughly 760 colour uses in this file already go through
          var(--...), so redefining :root carries most of the page on its own. What it
          does not carry is 82 hardcoded light values in the stylesheet and 37 more
          inside JS string literals -- the amber run-note box, the green OK panels, the
          red alert panels, the white cards. Left alone those become bright islands on
          a dark page, which is worse than not converting at all.

          Hand-editing 119 sites is how a restyle acquires a long tail of misses. So
          the remap is mechanical and ROLE-AWARE: the same hex is treated differently
          depending on the property it sits on.

            background / border   a light tint becomes a DARK tint of the same hue
            color / fill / stroke  a dark tint becomes a BRIGHT tint of the same hue

          That is what makes a status box survive the inversion. #fffbeb background
          with #92400e text is an amber warning; naively inverting both gives mud.
          Mapping the background to #241a05 and the text to #fbbf24 gives the same
          warning, legibly, on a dark surface.

          WHAT IS DELIBERATELY NOT TOUCHED
          --------------------------------
          The fifteen hexes that are ALREADY dark backgrounds -- the evidence panels
          that were designed dark on purpose -- are harmonised to the new surface
          tokens rather than inverted, because inverting an already-dark value would
          turn the one part of the page that was right into a light island.

          Team brand colours in TEAMS[] are left exactly as they are. They are
          identity, not theme.
          """
          from __future__ import annotations

          import pathlib
          import re
          import sys

          FILES = ("current.html", "index.html", "preview.html")
          FAIL: list[str] = []

          # --------------------------------------------------------------- the tokens
          # Deep navy, not black. The accent stays the product's existing blue family
          # so the page still reads as the same product, one shade brighter so it
          # carries on a dark surface.
          ROOT_OLD = (":root{--bg:#eef1f7;--panel:#ffffff;--panel2:#e6ebf4;"
                      "--line:#bcc7db;--txt:#0a1a3a;--muted:#566586;--accent:#0a3161;"
                      "--accent2:#bf0a30;--win:#0a3161;--draw:#8893a8;--lose:#bf0a30;"
                      "--gold:#c8992f;")

          ROOT_NEW = (":root{color-scheme:dark;--bg:#0b1220;--panel:#121a2b;"
                      "--panel2:#182237;--line:#26314a;--line2:#33415e;--elev:#1c2740;"
                      "--txt:#e8edf7;--muted:#93a2bf;--accent:#4d90fe;"
                      "--accent2:#ff5c72;--win:#3ddc97;--draw:#8893a8;--lose:#ff5c72;"
                      "--gold:#e3b341;")

          SHADOW_OLD = "--card-sh:3px 3px 0 rgba(10,26,58,.16)"
          SHADOW_NEW = "--card-sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28)"

          # ------------------------------------------------- background / border remap
          # Light tint -> dark tint of the same hue. Neutrals go to surface tokens so
          # they keep tracking :root if the palette is ever retuned again.
          BG = {
              "#fff": "var(--panel)", "#ffffff": "var(--panel)",
              "#f8fafc": "var(--panel2)", "#f1f5f9": "var(--panel2)",
              "#f2f5fa": "var(--panel2)", "#eef2f7": "var(--panel2)",
              "#e2e8f0": "var(--elev)", "#e6ebf4": "var(--panel2)",
              "#cbd5e1": "var(--line2)", "#d1d5db": "var(--line2)",
              "#e5e7eb": "var(--line2)", "#f3f4f6": "var(--panel2)",
              "#c3ccdd": "var(--line2)", "#a9c0dc": "var(--line2)",
              "#94a3b8": "var(--line2)", "#9fb4cc": "var(--line2)",
              "#8fa8c8": "var(--line2)", "#ddd": "var(--line2)",
              # amber
              "#fffbeb": "#241a05", "#fef3c7": "#2e2208", "#fdf8ec": "#231b09",
              "#fde68a": "#4a3a0d", "#fcd34d": "#5a4510", "#e7cf8a": "#3d3313",
              "#dfb63f": "#5a4510", "#fbbf24": "#5a4510",
              # green
              "#f0fdf4": "#062617", "#ecfdf3": "#062617", "#dcfce7": "#08351f",
              "#bbf7d0": "#0d4a2c", "#86efac": "#116b3f", "#63d095": "#116b3f",
              # red
              "#fef2f2": "#2a0f12", "#fff5f5": "#2a0f12", "#fee2e2": "#361318",
              "#fecaca": "#4d1a20", "#fca5a5": "#63222a", "#f3b4b4": "#63222a",
              # blue
              "#f0f6ff": "#0d1b30", "#dbeafe": "#102542", "#dce8f6": "#102542",
              "#93c5fd": "#1d4e8f",
              # the panels that were ALREADY dark -- harmonised, not inverted
              "#0f172a": "var(--bg)", "#101a2c": "var(--bg)", "#111826": "var(--bg)",
              "#0d1220": "var(--bg)", "#131313": "var(--panel)", "#141414": "var(--panel)",
              "#161616": "var(--panel)", "#1a1a1a": "var(--panel2)",
              "#1d2740": "var(--line)", "#1d3155": "var(--line)",
              "#242424": "var(--line)", "#282828": "var(--line)", "#222": "var(--line)",
              "#111a26": "var(--line)",
          }

          # ----------------------------------------------------- color / fill / stroke
          # Dark tint -> bright tint of the same hue, so text keeps its meaning.
          FG = {
              "#0a1a3a": "var(--txt)", "#566586": "var(--muted)",
              "#334155": "var(--muted)", "#475569": "var(--muted)",
              "#4d5f7d": "var(--muted)", "#6a7a92": "var(--muted)",
              "#4a4a4a": "var(--muted)", "#4f4f4f": "var(--muted)",
              "#555": "var(--muted)", "#6a6a6a": "var(--muted)",
              "#6f6f6f": "var(--muted)", "#7d7d7d": "var(--muted)",
              "#8a8a8a": "var(--muted)", "#9a9a9a": "var(--muted)",
              # amber text
              "#92400e": "#fbbf24", "#b45309": "#fbbf24", "#78350f": "#fcd34d",
              "#8a6d00": "#e3b341", "#7c3d12": "#fbbf24", "#6a5a2a": "#e3b341",
              "#5c5443": "#e3b341", "#4b3a12": "#e3b341", "#7d7259": "#e3b341",
              # green text
              "#166534": "#4ade80", "#14532d": "#4ade80", "#1b9e4b": "#4ade80",
              "#0c7a43": "#4ade80",
              # red text
              "#991b1b": "#f87171", "#b91c1c": "#f87171", "#7f1d1d": "#f87171",
              # blue / violet text
              "#1e40af": "#7cb0ff", "#3a8fff": "#7cb0ff", "#6fa8ff": "#9cc4ff",
              "#a888f0": "#c0a6ff",
              # light text that must STAY light on a dark surface
              "#fff": "#fff", "#fdf8ec": "#f2e6c8",
          }

          BORDER = dict(BG)
          BORDER.update({
              "#f1f5f9": "var(--line)", "#e2e8f0": "var(--line)",
              "#cbd5e1": "var(--line)", "#c3ccdd": "var(--line)",
              "#94a3b8": "var(--line2)", "#bcc7db": "var(--line)",
          })

          HEX = re.compile(r"#(?:[0-9a-fA-F]{6}|[0-9a-fA-F]{3})\b")
          DECL = re.compile(r"(?P<prop>[a-zA-Z-]+)\s*:\s*(?P<val>[^;{}]+)")


          def role_of(prop: str) -> str:
              p = prop.lower()
              if p.startswith("--"):
                  return "token"
              if p.startswith("background"):
                  return "bg"
              if "border" in p or p == "outline" or p == "outline-color":
                  return "border"
              if p in ("color", "fill", "stroke", "caret-color"):
                  return "fg"
              if "shadow" in p:
                  return "shadow"
              return "other"


          def remap_decl(m: re.Match) -> str:
              prop, val = m.group("prop"), m.group("val")
              role = role_of(prop)
              if role in ("token", "other", "shadow"):
                  return m.group(0)
              table = {"bg": BG, "border": BORDER, "fg": FG}[role]

              def sub(h):
                  return table.get(h.group(0).lower(), h.group(0))

              return prop + ":" + HEX.sub(sub, val)


          def patch(text: str, path: str) -> str:
              # --- 1. the tokens themselves
              for old, new, label in ((ROOT_OLD, ROOT_NEW, "root tokens"),
                                      (SHADOW_OLD, SHADOW_NEW, "card shadow")):
                  if text.count(old) != 1:
                      FAIL.append("%s / %s: anchor found %d time(s), expected 1"
                                  % (path, label, text.count(old)))
                      continue
                  text = text.replace(old, new, 1)
              if FAIL:
                  return text

              # --- 2. the stylesheet, role-aware
              a, b = text.index("<style>"), text.index("</style>")
              css = text[a:b]
              css2 = DECL.sub(remap_decl, css)
              text = text[:a] + css2 + text[b:]

              # --- 3. inline style="..." strings built in JS. Same rules; these are
              #        the 37 uses that a stylesheet-only pass would miss entirely.
              def fix_inline(m):
                  return 'style="' + DECL.sub(remap_decl, m.group(1)) + '"'

              text = re.sub(r'style="([^"]*#[^"]*)"', fix_inline, text)

              # color-scheme:dark is inside ROOT_NEW: without it the browser keeps
              # painting form controls, scrollbars and autofill light on a dark page.
              return text


          def main() -> int:
              out = {}
              for fn in FILES:
                  p = pathlib.Path(fn)
                  if not p.exists():
                      FAIL.append("%s: missing" % fn)
                      continue
                  s = p.read_text(encoding="utf-8")
                  out[fn] = (s, patch(s, fn))
              if FAIL:
                  print("ANCHOR FAILURES -- nothing written:")
                  for f in FAIL:
                      print("  - " + f)
                  return 1
              for fn, (before, after) in out.items():
                  pathlib.Path(fn).write_text(after, encoding="utf-8")
                  print("  patched %-16s %d -> %d bytes" % (fn, len(before), len(after)))
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PEOF
          python3 r1_palette.py
          rm -f r1_palette.py

      - name: R1 Home
        run: |
          cat > r1_home.py <<'PEOF'
          """RELEASE 1, STAGE B+C — five destinations, and a Home that answers the
          four questions before the reader scrolls.

          WHAT HOME IS FOR
          ----------------
          What games are today. What are the best current picks. Which player matchups
          matter. What can I look at next. Everything on it is composed from data the
          pipeline already publishes; no section here selects anything new.

          The featured picks are `dailyHero()` UNCHANGED. That is deliberate: the five
          tiles are an existing, governed product with their own refusal states
          (NO BET AT THIS PRICE, RANKING ONLY, NO PREGAME MARKET, PROVISIONAL), and
          re-picking them for a prettier Home would be a second selection engine
          disagreeing with the first.

          NAVIGATION
          ----------
          Five primary destinations, mapped onto sections that already exist:

            Home              new
            Game Predictions  #slate
            Player Props      #props
            Parlays           #parlay
            Results           #library

          Nothing is deleted or renamed at the id level, so every deep link, every
          showTab() call and every internal cross-link still resolves. Picks keeps its
          section and moves into More beside Matchups, Performance, Simulator, Admin,
          How it works and Backtests.

          GAME STATE IS NOT DECORATION
          ----------------------------
          Home orders games upcoming-first, marks live ones, and moves finals into
          their own row. A started game's prediction is still shown, labelled PREGAME
          PICK — GAME LIVE or FINAL, and it is never rendered as an actionable price.
          The predicate is the page's existing `mktDead` / `gameStateOf`, not a second
          eligibility system.

          PLAYER CARDS
          ------------
          The headshot helpers already existed (`hFace`, initials fallback on error) and
          were being used at 30px. Here they are the anchor of the card at 64px, which
          is what "player-first" actually means.

          Every one-line reason is assembled from fields present on the row —
          batting order, lineup status, the starter's xERA, ISO, hits per game. A
          factor is stated only when its field is there. There are no invented Statcast
          numbers and no adjectives the data does not support.
          """
          from __future__ import annotations

          import pathlib
          import sys

          FILES = ("current.html", "index.html", "preview.html")
          FAIL: list[str] = []

          # ------------------------------------------------------------------- markup
          OLD_MAIN = """<main>
            <section id="slate"></section>
            <section id="picks" class="active"></section>"""
          NEW_MAIN = """<main>
            <section id="home" class="active"></section>
            <section id="slate"></section>
            <section id="picks"></section>"""

          # ------------------------------------------------------------------ the nav
          OLD_TABS = ("var TABS=[['picks','Picks'],['slate','Slate'],"
                      "['matchups','Matchups'],['props','Props'],['parlay','Parlay'],"
                      "['performance','Performance'],['simulator','Simulator'],"
                      "['library','Library'],['admin','Admin / Health'],"
                      "['method','How it works'],['backtests','Backtests']];")
          NEW_TABS = ("""/* Section ids are UNCHANGED. Only the labels and the order of the
             primary row move, so every existing deep link, cross-link and showTab()
             call still resolves to the same section. */
          var TABS=[['home','Home'],['slate','Game Predictions'],"""
                     "['props','Player Props'],['parlay','Parlays'],"
                     "['library','Results'],['picks','Picks'],"
                     "['matchups','Matchups'],['performance','Performance'],"
                     "['simulator','Simulator'],['admin','Admin / Health'],"
                     "['method','How it works'],['backtests','Backtests']];")

          OLD_PRIM = "var NAV_PRIMARY=['picks','slate','props','parlay','performance'];"
          NEW_PRIM = "var NAV_PRIMARY=['home','slate','props','parlay','library'];"

          OLD_DISPATCH = "[['meta',renderMeta],['slate',renderSlate],['picks',renderPicks],"
          NEW_DISPATCH = ("[['meta',renderMeta],['home',renderHome],"
                          "['slate',renderSlate],['picks',renderPicks],")

          # ------------------------------------------------------------------- render
          HOME_JS = r"""
          /* ==================== HOME ==================== */

          function hmSec(title,sub,body,more){
            if(!body)return '';
            /* A DIV, NOT A SECTION. `main section{display:none}` is how the page
               switches tabs, so a nested <section> inside #home is hidden by the very
               rule that shows #home. */
            return '<div class="hmsec"><div class="hmh"><h2>'+esc(title)+'</h2>'
              +(sub?'<span class="hmsub">'+esc(sub)+'</span>':'')
              +(more?'<button class="hmmore" onclick="showTab(\''+more[0]+'\')">'
                 +esc(more[1])+' &rsaquo;</button>':'')
              +'</div>'+body+'</div>';
          }

          /* ---- one game, compact. Upcoming first; a started game keeps its
             prediction but loses its price. ---- */
          function hmGame(r){
            var g=r.g,m=r.m,p=r.b.pred,st=r.st;
            var tm={away:p.away||teamsOf(g).away,home:p.home||teamsOf(g).home};
            var live=st.key==='LIVE',done=st.key==='FINAL',dead=!st.marketOpen;
            var note=live?'PREGAME PICK &mdash; GAME LIVE':(done?'FINAL':'');
            return '<button class="hmg'+(live?' hmg-live':'')+(done?' hmg-done':'')+'"'
              +' onclick="showTab(\'slate\')" title="Open Game Predictions">'
              +'<div class="hmgt">'+hTeam(tm.away)+'<b>'+esc(tm.away)+'</b>'
                +'<span class="hmat">@</span>'+hTeam(tm.home)+'<b>'+esc(tm.home)+'</b></div>'
              +'<div class="hmgm">'+esc(etTime(g.time||m.time||p.pred.time))
                +(live?'<span class="hmlive">LIVE</span>':(done?'<span class="hmfin">FINAL</span>':''))+'</div>'
              +'<div class="hmgw">'+(p.winner?'<span class="hmgwl">model</span><b>'+esc(p.winner)+'</b>'
                  +(isNum(p.wp)?'<span class="hmgwp">'+p.wp.toFixed(0)+'%</span>':''):'<span class="hmgwl">no model winner</span>')+'</div>'
              +(note?'<div class="hmgn">'+note+'</div>':'')
              +'</button>';
          }

          function hmGames(){
            var gc=(D.gameCards||[]).slice();
            var mlByPk={};(D.ml||[]).forEach(function(x){mlByPk[x.gamePk]=x;});
            if(!gc.length)return '<div class="empty">No games in today’s slate.</div>';
            var rows=gc.map(function(g){
              var m=mlByPk[g.gamePk]||{};
              return {g:g,m:m,b:betFor(g,m),st:gameStateOf(g,m),t:tms(g.time||m.time)||0};
            });
            var out='',any=false;
            [['UPCOMING','Upcoming'],['IN PROGRESS','In progress'],
             ['FINAL','Final'],['POSTPONED','Postponed']].forEach(function(k){
              var v=rows.filter(function(r){return r.st.group===k[0];})
                        .sort(function(a,b){return a.t-b.t;});
              if(!v.length)return;
              any=true;
              out+='<div class="hmgrp"><span>'+esc(k[1])+'</span><i>'+v.length+'</i></div>'
                +'<div class="hmgg">'+v.map(hmGame).join('')+'</div>';
            });
            /* A finished slate is a state, not an empty page. */
            if(!any)return '<div class="empty">No games in today’s slate.</div>';
            return out;
          }

          /* ---- the player card. The headshot is the anchor, not a decoration. ---- */
          function hmReason(r,fam){
            /* Only states a factor whose field is actually present. */
            var b=[];
            if(isNum(r.battingOrder)&&r.battingOrder>0)b.push('Batting '+ord2(r.battingOrder));
            var ls=String(r.lineupStatus||'').toUpperCase();
            if(ls.indexOf('CONFIRM')>=0)b.push('confirmed');
            else if(ls.indexOf('PROJECT')>=0)b.push('projected lineup');
            if(fam==='hr'){
              if(isNum(r.iso))b.push('.'+String(r.iso.toFixed(3)).slice(2)+' ISO');
              if(isNum(r.hr))b.push(r.hr+' HR');
            }else{
              if(isNum(r.avg))b.push('.'+String(r.avg.toFixed(3)).slice(2)+' AVG');
              if(isNum(r.hpg))b.push(r.hpg.toFixed(2)+' hits/game');
            }
            if(isNum(r.spXera))b.push('vs '+r.spXera.toFixed(2)+' xERA');
            return b.join(' · ');
          }
          function ord2(n){
            var s=['th','st','nd','rd'],v=n%100;
            return n+(s[(v-20)%10]||s[v]||s[0]);
          }

          function hmPlayer(r,fam,label){
            var num=isNum(r.model_prob)?(100*r.model_prob).toFixed(0)+'%'
                  :(isNum(r.metric)?String(r.metric):(isNum(r.score)?String(r.score):SH_ABSENT));
            var unit=isNum(r.model_prob)?'model probability':label+' score';
            /* RANKING ONLY is the honest label whenever no probability is published.
               It is not a softer way of saying the same thing -- a score is not a
               chance, and the card must not let one read as the other. */
            var chip=isNum(r.model_prob)
                ? pill('MODEL PROBABILITY','b-ok','A published, verified probability for this market.')
                : pill('RANKING ONLY','b-unk','No verified probability is published for this market. The number is a rank within this board, not a chance.');
            var why=hmReason(r,fam);
            return '<div class="hmp">'
              +'<div class="hmpf">'+hFace(r.playerId,r.name)+'</div>'
              +'<div class="hmpb">'
                +'<div class="hmpn">'+esc(r.name||SH_ABSENT)+'</div>'
                +'<div class="hmpt">'+hTeam(r.team)+'<span>'+esc(r.team||'')+'</span>'
                  +'<span class="hmpm">'+esc(label)+'</span></div>'
                +'<div class="hmpv"><b>'+esc(num)+'</b><span>'+esc(unit)+'</span></div>'
                +'<div class="hmpc">'+chip+'</div>'
                +(why?'<div class="hmpw">'+esc(why)+'</div>':'')
              +'</div></div>';
          }

          function hmBoard(fam,label,n){
            if(boardRetired(fam))return '';
            var rows=((D.boards||{})[fam]||[]).filter(function(r){return !mktDeadRow(r);});
            if(!rows.length)return '';
            return '<div class="hmpg">'+rows.slice(0,n||4).map(function(r){
              return hmPlayer(r,fam,label);}).join('')+'</div>';
          }

          function hmHomeRun(){
            if(boardRetired('hr'))return '';
            var rows=((D.hrProps&&D.hrProps.length)?D.hrProps:((D.boards||{}).hr||[]))
              .filter(function(r){return !mktDeadRow(r);});
            if(!rows.length)return '';
            return '<div class="hmpg">'+rows.slice(0,4).map(function(r){
              return hmPlayer(r,'hr','home run');}).join('')+'</div>';
          }

          /* ---- parlay spotlight. The model/priced distinction is the product, so
             the two are never merged into one card. ---- */
          function hmParlay(){
            var out=[];
            var mp=D.modelParlay;
            if(mp&&(mp.legs||[]).length){
              var deadleg=(mp.legs||[]).some(function(l){return mktDead(l.gamePk);});
              out.push('<div class="hmpar"><div class="hmparh">MODEL PARLAY<span>no sportsbook price</span></div>'
                +(deadleg
                  ? '<div class="hmparn">A leg’s game is underway. This ticket is not current.</div>'
                  : '<ol class="hmparl">'+mp.legs.map(function(l){
                      return '<li>'+esc(l.desc||'leg')+'</li>';}).join('')+'</ol>'
                    +'<div class="hmparf">'+(isNum(mp.combinedProbability)
                        ? (100*mp.combinedProbability).toFixed(1)+'% <span>independence estimate</span>'
                        : '<span>combined chance not measured</span>')+'</div>'));
            }
            var pp=D.pricedParlay||D.topParlay;
            if(pp&&(pp.legs||[]).length&&pp.parlayValid!==false){
              var c=pp.combined||{};
              out.push('<div class="hmpar"><div class="hmparh">PRICED PARLAY<span>real book price</span></div>'
                +'<ol class="hmparl">'+pp.legs.slice(0,6).map(function(l){
                    return '<li>'+esc(l.desc||'leg')+'</li>';}).join('')+'</ol>'
                +'<div class="hmparf">'+(isNum(c.americanOdds)
                    ? (c.americanOdds>0?'+':'')+c.americanOdds+' <span>book price</span>'
