name: apply-playoffs-11

# PLAYOFF RELEASE 1.1 -- two honesty fixes an adversarial review earned.
# Refuses to run twice: the first step aborts if the new copy is already in
# place, because an anchored patch whose anchors survive it will apply twice.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refuse if already applied
        run: |
          if grep -q "What the model produced" current.html; then
            echo "already applied -- not patching twice" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "clean, proceeding" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply 1.1
        run: |
          cat > pl2.py <<'PEOF'
          """PLAYOFF RELEASE 1.1 — two honesty fixes an adversarial review earned.

          1. THE STARTED-GAME NOTE WAS FALSE.
             It said "the states above are the record of what was published before
             first pitch". They are not. The adapter recomputes every state on every
             publish, so after first pitch a card could show a WATCH that only became
             WATCH once lineups confirmed — i.e. AFTER the cutoff — while the copy
             claimed it was a pregame record. That is exactly the look-ahead the
             frozen-pick machinery exists to prevent, asserted in prose. The note now
             says what is true: nothing here is actionable, these are the states as of
             this publish, and the frozen record lives in the pick snapshots.

          2. MODEL OUTPUT AND MATCHUP CONTEXT WERE UNDER ONE HEADING.
             "Why the model leans this way" listed a win probability (something the
             model produced) beside a starter's xERA and a park HR factor (inputs and
             surroundings). Under one heading, baseball context impersonates model
             attribution: a reader concludes the model weighed the park because the
             park is in the list. Split into "What the model produced" — win
             probability, projected runs, model agreement — and "Matchup context",
             labelled as inputs and surroundings and not attribution.

          Neither fix changes a single published number. Both change what the page
          claims about the numbers, which is the part that was wrong.
          """
          from __future__ import annotations

          import pathlib
          import sys

          FILES = ("current.html", "index.html", "preview.html")
          FAIL: list[str] = []

          EDITS = [
              ("started-game note",
               """    +(dead?'<div class="poempty">This game is underway or final. The states above are '
                +'the record of what was published before first pitch; nothing here is current.</div>':'')""",
               """    +(dead?'<div class="poempty">This game is underway or final, so nothing here is '
                +'actionable. These are the market states as of <b>this publish</b> \\u2014 not a '
                +'frozen pre-first-pitch record. What was recommended before first pitch is kept '
                +'by the pick snapshots, and this card is not that record.</div>':'')"""),

              ("two accumulators",
               """  var out=[];
            function row(k,v){if(v)out.push('<li><b>'+esc(k)+'</b><span>'+v+'</span></li>');}""",
               """  var out=[],drv=[];
            function row(k,v){if(v)out.push('<li><b>'+esc(k)+'</b><span>'+v+'</span></li>');}
            /* mrow = something this model produced. row = an input or a surrounding. */
            function mrow(k,v){if(v)drv.push('<li><b>'+esc(k)+'</b><span>'+v+'</span></li>');}"""),

              ("projected runs is model output", "    row('Projected runs'", "    mrow('Projected runs'"),
              ("model agreement is model output", "    row('Model agreement',t);", "    mrow('Model agreement',t);"),
              ("win probability is model output", "    row('Win probability'", "    mrow('Win probability'"),

              ("split the headings",
               """  if(!out.length)return '';
            return '<div class="powhy"><div class="powhyh">Why the model leans this way</div>'
              +'<ul>'+out.join('')+'</ul></div>';""",
               """  if(!out.length&&!drv.length)return '';
            /* MODEL OUTPUT AND MATCHUP CONTEXT ARE NOT THE SAME CLAIM. A win
               probability and a projected run total are things this model produced. A
               starter's xERA, a bullpen's season ERA and a park's HR factor are inputs
               and surroundings -- true and useful, and NOT evidence that the model
               weighed them. Under one heading the context impersonates attribution. */
            return '<div class="powhy">'
              +(drv.length?'<div class="powhyh">What the model produced</div><ul>'
                  +drv.join('')+'</ul>':'')
              +(out.length?'<div class="powhyh"'+(drv.length?' style="margin-top:10px"':'')
                  +'>Matchup context \\u2014 inputs and surroundings, not model attribution</div>'
                  +'<ul>'+out.join('')+'</ul>':'')
              +'</div>';"""),
          ]


          def patch(text: str, path: str) -> str:
              for label, old, new in EDITS:
                  n = text.count(old)
                  if n != 1:
                      FAIL.append("%s / %s: anchor found %d time(s), expected 1"
                                  % (path, label, n))
                      continue
                  text = text.replace(old, new, 1)
              return text


          def main() -> int:
              out = {}
              for fn in FILES:
                  p = pathlib.Path(fn)
                  if not p.exists():
                      FAIL.append("%s: missing" % fn)
                      continue
                  s = p.read_text(encoding="utf-8")
                  out[fn] = (s, patch(s, fn))
              if FAIL:
                  print("ANCHOR FAILURES -- nothing written:")
                  for f in FAIL:
                      print("  - " + f)
                  return 1
              for fn, (before, after) in out.items():
                  pathlib.Path(fn).write_text(after, encoding="utf-8")
                  print("  patched %-16s %d -> %d bytes" % (fn, len(before), len(after)))
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PEOF
          python3 pl2.py 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Gate
        run: |
          python3 - <<'GEOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, pathlib, sys
          bad, ok = [], []
          def chk(c,l): (ok if c else bad).append(l)
          for fn in ("current.html","index.html","preview.html"):
              s=pathlib.Path(fn).read_text(encoding="utf-8")
              M='<script id="bb-data" type="application/json">'
              i=s.index(M)+len(M); json.loads(s[i:s.index("</script>",i)])
              chk(True, fn+": payload parses")
              chk("What the model produced" in s, fn+": model-output heading present")
              chk("not model attribution" in s, fn+": context is labelled as context")
              chk("this card is not that record" in s, fn+": started-game note is honest")
              chk("the record of what was published before first pitch" not in s,
                  fn+": the false pregame-record claim is gone")
              chk(s.count("function poWhy(") == 1, fn+": one poWhy")
              for must in ("function renderPlayoffs(", "function renderHome(", "function renderProps(",
                           'id="playoffs"', "--bg:#0b1220"):
                  chk(must in s, fn+": intact -- "+must)
          a=pathlib.Path("current.html").read_text(encoding="utf-8")
          b=pathlib.Path("index.html").read_text(encoding="utf-8")
          c=pathlib.Path("preview.html").read_text(encoding="utf-8")
          chk(a==b==c, "the three pages agree")
          for x in ok: print("ok   "+x)
          if bad:
              print("")
              for x in bad: print("FAIL "+x)
              print("\n%d GATE FAILURE(S)"%len(bad)); sys.exit(1)
          print("\ngate passed: %d checks"%len(ok))
          GEOF

      - name: Commit and remove this installer
        run: |
          rm -f .github/workflows/apply-playoffs-11.yml pl2.py
          git config user.name "amercado19"
          git config user.email "andresmercado1919@gmail.com"
          git add -A
          git commit -F - <<'MEOF'
          Playoffs 1.1: the started-game note was false, and context was impersonating attribution

          THE NOTE CLAIMED A PREGAME RECORD IT DID NOT HAVE

          A started game's card said "the states above are the record of what was
          published before first pitch". They are not. The adapter recomputes every
          market state on every publish, so a card could show an h1 WATCH that only
          became WATCH once lineups confirmed -- after first pitch -- while the copy
          underneath called it a pregame record. That is the exact look-ahead the
          frozen-pick machinery exists to prevent, asserted in prose instead of
          committed in data.

          It now says what is true: the game is underway or final, nothing here is
          actionable, these are the states as of THIS publish, and the record of what
          was recommended before first pitch is kept by the pick snapshots -- which
          this card is not.

          MODEL OUTPUT AND MATCHUP CONTEXT WERE UNDER ONE HEADING

          "Why the model leans this way" listed a win probability, which this model
          produced, beside a starter's xERA and a park HR factor, which are an input
          and a surrounding. Under one heading the context impersonates attribution: a
          reader concludes the model weighed the park because the park is in the list.

          Split in two. "What the model produced" carries the win probabilities, the
          projected run totals and the model-agreement status. "Matchup context --
          inputs and surroundings, not model attribution" carries the starters and
          their xERA gap, both bullpen ERAs, the park and air, and the lineup state.

          Not one published number changed. What the page claims about the numbers did,
          and that was the part that was wrong.

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01ANJSLwtfnVuf8PPgpvpWtb
          MEOF
          git push
