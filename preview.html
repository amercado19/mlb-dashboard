<!doctype html>
<html lang="en">
<head>
<script>
(function(){try{var u=new URL(location.href);
 if(!u.searchParams.get('fresh')&&!sessionStorage.getItem('bbfresh')){
   sessionStorage.setItem('bbfresh','1');u.searchParams.set('fresh',Date.now());
   location.replace(u.toString());}}catch(e){}})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>MLB 2026 — Daily Edge</title>
<link rel="apple-touch-icon" href="icon-picks.png">
<link rel="icon" type="image/png" href="icon-picks.png">
<meta name="apple-mobile-web-app-title" content="MLB Picks">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap');
:root{--bg:#eef1f7;--panel:#ffffff;--panel2:#e6ebf4;--line:#bcc7db;--txt:#0a1a3a;--muted:#566586;--accent:#0a3161;--accent2:#bf0a30;--win:#0a3161;--draw:#8893a8;--lose:#bf0a30;--gold:#c8992f;--mono:'Space Mono','SFMono-Regular',ui-monospace,monospace;--sans:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;--card-sh:3px 3px 0 rgba(10,26,58,.16);}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);background-image:radial-gradient(rgba(10,49,97,.06) 1px,transparent 1px);background-size:18px 18px;}
header{padding:20px 16px 0;max-width:1100px;margin:0 auto}
h1{font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;font-size:26px;margin:0 0 4px;font-weight:700}
h1 span{color:var(--accent2)}
.meta{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.meta .rf{font-family:var(--mono);background:var(--panel);border:2px solid var(--txt);color:var(--txt);padding:4px 10px;border-radius:8px;cursor:pointer;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;box-shadow:2px 2px 0 rgba(44,34,24,.18)}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
nav button{background:var(--panel);border:2px solid var(--txt);color:var(--txt);padding:7px 15px;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;font-family:var(--mono);box-shadow:2px 2px 0 rgba(44,34,24,.18);transition:.08s}
nav button.active{background:var(--accent2);color:#fdf8ec;border-color:var(--txt)}
nav button:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 rgba(44,34,24,.22)}
main{max-width:1100px;margin:0 auto;padding:0 16px 60px}
section{display:none}section.active{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
@media(max-width:880px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;box-shadow:var(--card-sh);overflow:hidden;margin-bottom:14px}
.card-h{background:var(--accent);color:#fdf8ec;text-transform:uppercase;letter-spacing:1px;font-weight:700;font-size:13px;padding:10px 14px;font-family:var(--mono);display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-h .t{font-size:11px;opacity:.85;font-weight:400}
.card-b{padding:13px 14px}
.tlogo{width:22px;height:22px;object-fit:contain;vertical-align:middle}
.teams{display:flex;flex-direction:column;gap:8px;margin-bottom:11px}
.team{display:flex;align-items:center;gap:9px}
.abbr{font-family:var(--mono);font-weight:700;font-size:13px;min-width:46px}
.team .nm{font-size:12.5px;flex:1;color:var(--muted)}
.team .rs{font-family:var(--mono);font-weight:700;font-size:18px;margin-left:auto}
.team.fav .abbr{color:var(--accent)}
.probbar{display:flex;height:9px;border-radius:5px;overflow:hidden;border:1px solid var(--line);margin:6px 0 4px}
.probbar i{display:block;height:100%}
.probrow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-bottom:10px}
.pickline{font-family:var(--mono);font-size:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px}
.pickline b{font-size:13px}
.wind{display:flex;gap:6px;justify-content:space-around;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px;margin:8px 0;font-family:var(--mono)}
.wz{display:flex;flex-direction:column;align-items:center;font-size:9px;color:var(--muted)}
.wza{font-size:15px;line-height:1}.wzm{font-weight:700;color:var(--txt)}
.subrow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:6px;flex-wrap:wrap;gap:6px}
.kv{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px dotted var(--line)}
.kv .k{color:var(--muted)}.kv .v{font-family:var(--mono);font-weight:700}
.sp{font-size:12px;color:var(--muted);margin:8px 0 2px}
.sp b{color:var(--txt);font-family:var(--sans);font-weight:700}
.arse{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px}
.badge{font-family:var(--mono);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:2px 6px;border-radius:5px;display:inline-block;line-height:1.5}
.b-strong{background:rgba(19,128,134,.18);color:var(--accent)}
.b-lean{background:rgba(217,154,7,.20);color:var(--gold)}
.b-pass{background:rgba(138,119,82,.16);color:var(--muted)}
.b-rank{background:rgba(232,99,42,.16);color:var(--accent2)}
.b-over{background:rgba(19,128,134,.16);color:var(--accent)}
.b-under{background:rgba(204,70,49,.16);color:var(--lose)}
.b-win{background:rgba(19,128,134,.18);color:var(--accent)}
.b-loss{background:rgba(204,70,49,.18);color:var(--lose)}
.prop-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.prop-tabs button{font-family:var(--mono);font-size:11px;font-weight:700;text-transform:uppercase;background:var(--panel);border:1.5px solid var(--line);border-radius:7px;padding:5px 11px;cursor:pointer;letter-spacing:.5px}
.prop-tabs button.on{background:var(--accent);color:#fdf8ec;border-color:var(--accent)}
.prow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:none}
.prow .rk{font-family:var(--mono);font-weight:700;color:var(--muted);font-size:11px;width:24px}
.hs{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--panel2);border:1.5px solid var(--line)}
.prow .pnm{flex:1;font-size:13px;font-weight:500;cursor:pointer}
.prow .pnm:hover{color:var(--accent2);text-decoration:underline}
.prow .ptm{font-family:var(--mono);font-size:11px;color:var(--muted);width:40px}
.prow .pmetric{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--accent);min-width:46px;text-align:right}
.unit{font-size:9px;color:var(--muted);font-weight:400}
.leg{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
.leg:last-child{border-bottom:none}
.leg .ln{font-family:var(--mono);font-weight:700;color:var(--muted);width:22px}
.leg .ld{flex:1;font-size:13px}.leg .lp{font-family:var(--mono);font-weight:700;color:var(--accent)}
.note{font-size:11.5px;color:var(--muted);padding:10px 14px;line-height:1.5}
.empty{font-family:var(--mono);font-size:12px;color:var(--muted);padding:20px;text-align:center}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kbox{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;box-shadow:var(--card-sh);padding:12px;text-align:center}
.kbox .kv2{font-family:var(--mono);font-weight:700;font-size:22px}
.kbox .kl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.kpos .kv2{color:var(--accent)}.kneg .kv2{color:var(--lose)}
details.pl-day{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;box-shadow:var(--card-sh);margin-bottom:8px;padding:9px 13px}
details.pl-day summary{cursor:pointer;font-family:var(--mono);font-size:13px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pl-legs{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
.pl-leg{font-size:12px;padding:2px 0}
.calrow{display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px}
.calrow .cbucket{width:70px;color:var(--muted)}
.caltrack{flex:1;height:8px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;position:relative}
.caltrack i{position:absolute;height:100%;border-radius:5px}
/* ---- matchup modal (sticker themed) ---- */
#mxOverlay{display:none;position:fixed;inset:0;background:rgba(44,34,24,.55);z-index:9998;overflow-y:auto;padding:22px 12px}
#mxModal{max-width:1000px;margin:0 auto;background:var(--panel);border:1.5px solid var(--txt);border-radius:14px;box-shadow:5px 5px 0 rgba(44,34,24,.25);position:relative;padding:16px 16px 28px}
#mxClose{position:absolute;top:8px;right:12px;font-size:18px;color:var(--accent2);cursor:pointer;font-weight:800;font-family:var(--mono)}
.mx-h2{font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#fdf8ec;background:var(--accent);margin:16px -2px 8px;padding:6px 10px;border-radius:6px;font-weight:700}
.mx-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1.5px solid var(--line);padding-bottom:10px}
.mx-bat,.mx-pit{display:flex;align-items:center;gap:8px}.mx-pit{flex-direction:row-reverse;text-align:right}
.mx-nm{font-family:var(--mono);font-size:15px;color:var(--txt);font-weight:700}
.mx-sub{font-size:10px;color:var(--muted);font-family:var(--mono)}
.mx-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:780px){.mx-cols{grid-template-columns:1fr}}
.mx-grade{text-align:center;margin:10px 0}
.mx-gcirc{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:90px;height:90px;border-radius:50%;border:3px solid var(--accent);background:var(--panel2)}
.mx-gletter{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--accent)}
.mx-thesis{font-size:11.5px;color:var(--txt);margin-top:8px;line-height:1.45}
.mx-bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:11px}
.mx-blab{width:120px;color:var(--muted);flex:0 0 120px;font-family:var(--mono);font-size:10px}
.mx-btrack{flex:1;height:8px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.mx-bfill{height:100%;background:var(--accent);border-radius:5px}
.mx-bval{width:60px;text-align:right;color:var(--txt);font-family:var(--mono);font-weight:700;flex:0 0 60px}
.mx-tbl{width:100%;border-collapse:collapse;font-size:10.5px;font-family:var(--mono)}
.mx-tbl th{color:var(--muted);text-align:left;padding:4px 6px;border-bottom:1.5px solid var(--line);text-transform:uppercase;font-size:9px}
.mx-tbl td{padding:4px 6px;border-bottom:1px solid var(--line);color:var(--txt)}
.mx-zone{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:150px;margin:6px auto}
.mx-zcell{aspect-ratio:1/1;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;color:#fff;font-weight:800;font-family:var(--mono)}
.mx-cq{display:flex;gap:3px;flex-wrap:wrap;margin:6px 0}.mx-cqsq{width:15px;height:15px;border-radius:3px}
.mx-bb{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.mx-bbc{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px;text-align:center}
.mx-bbev{font-size:14px;font-weight:800;font-family:var(--mono)}.mx-bbsub{font-size:8px;color:var(--muted);font-family:var(--mono)}
.mx-loading{color:var(--muted);font-size:11px;padding:8px;font-family:var(--mono)}.mx-note{font-size:9px;color:var(--accent2);margin-top:4px;font-family:var(--mono)}
.rate{font-family:var(--mono)}

.tpctrl{display:flex;gap:8px;margin-bottom:10px}
.tpsel{font-family:var(--sans);padding:6px;border:1.5px solid var(--line);border-radius:7px;max-width:240px;background:var(--panel)}
.tpauto{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.tpauto button{font-family:var(--mono);font-size:10px;font-weight:700;background:var(--panel2);border:1.5px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer;text-transform:uppercase}
.leg-od{width:60px;font-family:var(--mono);font-weight:700;text-align:center;border:1.5px solid var(--line);border-radius:6px;padding:2px 4px;background:var(--panel);color:var(--txt)}
.leg-od.odbad{border-color:var(--lose);color:var(--lose);background:rgba(204,70,49,.08)}
.tprm{color:var(--lose);font-weight:800;cursor:pointer;font-family:var(--mono);margin-left:6px}

.prop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-bottom:14px}
.psq{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;box-shadow:var(--card-sh);padding:14px 8px;text-align:center;cursor:pointer;aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:center;transition:.08s}
.psq:hover{transform:translate(-1px,-1px)}
.psq.on{background:var(--accent2);color:#fdf8ec;border-color:var(--txt)}
.psq .ic{font-size:26px}
.psq .lb{font-family:var(--mono);font-weight:700;font-size:12px;text-transform:uppercase;margin-top:6px;letter-spacing:.5px}
.psq .ct{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:3px}
.psq.on .ct{color:#fdf8ec}
.gprops{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.gprops summary{cursor:pointer;font-family:var(--mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--accent)}

.byo{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.byoin{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;gap:3px;letter-spacing:.5px}
.byoin input{width:52px;font-family:var(--mono);font-weight:700;font-size:14px;text-align:center;border:1.5px solid var(--line);border-radius:7px;padding:4px;background:var(--panel);color:var(--txt)}
.sgptag{font-family:var(--mono);font-size:10px;color:var(--accent);text-transform:uppercase;margin:8px 0 2px;font-weight:700;letter-spacing:.5px}
.tppay{font-family:var(--mono);font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:10px 0;line-height:1.5}
.evf{font-family:var(--mono);font-size:9px;font-weight:800;color:var(--lose);margin-left:4px}

.luok{color:#1b9e4b;font-weight:800;font-family:var(--mono);margin-left:4px}

/* ==== health / status vocabulary (2026-09-02) ====================
   One badge family for every "how good is this data" statement.
   b-unk is deliberately grey + dashed: UNKNOWN must never read as green. */
.b-ok{background:#dcfce7;color:#0c7a43;border:1px solid #86efac}
.b-warn{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
.b-crit{background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5}
.b-unk{background:#eef2f7;color:#475569;border:1px dashed #94a3b8}
.b-info{background:#dbeafe;color:#1e40af;border:1px solid #93c5fd}
/* ELITE gets its own solid treatment — it used to share the GOOD badge */
.b-elite{background:var(--accent);color:#fdf8ec;border:1px solid var(--accent);box-shadow:1px 1px 0 rgba(10,26,58,.32)}
.b-good{background:rgba(19,128,134,.18);color:var(--accent);border:1px solid rgba(19,128,134,.35)}

/* ==== canonical prediction block on the game card ==== */
.pred{border:1.5px solid var(--line);border-radius:10px;background:var(--panel2);padding:9px 11px;margin:9px 0}
.plab{font-family:var(--mono);font-size:9px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);font-weight:700}
.pred .pwin{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-weight:700;font-size:18px;margin-top:3px;flex-wrap:wrap}
.pred .pwp{font-size:14px;color:var(--accent)}
.pred .psc{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.recrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.recrow b{color:var(--muted);font-size:9px;letter-spacing:.5px}
.splab{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:3px;line-height:1.65}
.splab i{font-style:normal;color:var(--txt);font-weight:700}
.lucard{margin-top:9px;border-top:1px dashed var(--line);padding-top:7px}
.lucard summary{cursor:pointer;font-family:var(--mono);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--accent)}
.luteam{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;margin:7px 0 2px}
.lurow{display:flex;align-items:center;gap:7px;font-size:11.5px;padding:2px 0;flex-wrap:wrap}
.lurow .lo{font-family:var(--mono);color:var(--muted);width:15px;font-size:10px;flex:0 0 15px}
.lurow .lnm{flex:1;min-width:110px}

/* ==== admin / health tab ==== */
#runstrip{max-width:1100px;margin:2px auto 0;padding:5px 0;font-family:var(--mono);font-size:10.5px;color:var(--muted);display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap}
#runstrip b{color:var(--txt)}
#runnote{max-width:1100px;margin:4px auto 0;font-size:11px;line-height:1.55;color:#4b3a12;background:#fffbeb;border:1px solid #e7cf8a;border-radius:8px;padding:7px 11px}
.ahs{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;box-shadow:var(--card-sh);margin-bottom:12px;overflow:hidden}
.ahs>.ahh{background:var(--accent);color:#fdf8ec;font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:1px;padding:8px 13px;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.ahb{padding:11px 13px}
.ahb .note{padding:0;margin:6px 0 0}
.ahgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:9px}
.ahbox{border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--panel2)}
.ahbox .hl{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
.ahbox .hv{font-family:var(--mono);font-size:17px;font-weight:700;margin-top:3px;word-break:break-word}
.ahbox .hsx{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.45}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:4px}
table.aht{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:10.5px;min-width:560px}
table.aht th{text-align:left;color:var(--muted);text-transform:uppercase;font-size:8.5px;letter-spacing:.5px;padding:5px 7px;border-bottom:1.5px solid var(--line);white-space:nowrap}
table.aht td{padding:5px 7px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
table.aht td.wrap{white-space:normal;font-family:var(--sans);font-size:11px;color:var(--muted);min-width:150px}
table.aht tr:last-child td{border-bottom:none}
.sevrow{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dotted var(--line);font-size:11.5px;line-height:1.5;flex-wrap:wrap}
.sevrow:last-child{border-bottom:none}
.sevrow .sevw{flex:1;min-width:180px}
.sevrow .seva{font-family:var(--mono);font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

    var c=cov!=null?' ('+Math.round(cov*100)+'%)':'';
    if(post)return r('HIGH','still partial'+c+' '+when);
    if(win)return r('MEDIUM','partial'+c+' inside the lineup window ('+when+')');
    if(early)return r('LOW','partial'+c+' — expected before lineups post');
    return r('MEDIUM','partial'+c+' and the lock time is unknown');
  }
  return r('MEDIUM','unrecognised status "'+st+'" — treated as UNKNOWN');
}

/* ---------- lineup provenance index ----------
   The board rows (hr / h1 / tb2 / hrr / hrProps) carry lineupStatus + eligible.
   gameCards[].away_bat / home_bat do NOT (yet). This index lets the Slate show
   the SAME marker the Props tab shows for the same player, instead of the ghost
   rows it used to render with no marker at all. When a batter is on no board we
   fall back to the game-level official/projected state and say so. */
function lineupIndex(){
  if(window._LUIX)return window._LUIX;
  var ix={};
  function take(r){
    if(!r||r.playerId==null)return;
    if(r.lineupStatus===undefined&&r.eligible===undefined)return;
    var rec={lineupStatus:r.lineupStatus,eligible:r.eligible,lineupReason:r.lineupReason,
      lineupSource:r.lineupSource,battingOrder:r.battingOrder,rosterStatus:r.rosterStatus,
      projectionSourceGame:r.projectionSourceGame,lineupAgeHours:r.lineupAgeHours};
    var k=r.gamePk+'|'+r.playerId;
    if(!ix[k]||(rec.lineupSource==='official'&&ix[k].lineupSource!=='official'))ix[k]=rec;
    if(!ix[r.playerId])ix[r.playerId]=rec;
  }
  var bf=D.boardsFull||D.boards||{};
  Object.keys(bf).forEach(function(k){(bf[k]||[]).forEach(take);});
  (D.hrProps||[]).forEach(take);(D.hitProps||[]).forEach(take);
  window._LUIX=ix;return ix;
}
function lineupFor(row,gamePk){
  if(!row)return null;
  if(row.lineupStatus!==undefined||row.eligible!==undefined)return row;
  if(row.playerId==null)return null;
  var ix=lineupIndex();
  return ix[(gamePk!=null?gamePk:row.gamePk)+'|'+row.playerId]||ix[row.playerId]||null;
}
/* Game-level fallback marker. Deliberately visually distinct from the
   per-player chip so nobody reads it as a confirmed individual status. */
function gameLevelTag(g){
  if(g&&g.lineups_official===true)
    return ' <span class="badge b-ok" title="No per-player status for this batter in the payload. The GAME’s lineup is official, so this is the game-level state, not an individual confirmation.">CONFIRMED · game-level</span>';
  if(g&&(g.lineups_projected===true||g.lineups_official===false))
    return ' <span class="badge b-warn" title="No per-player status for this batter. The GAME’s lineup was still projected at run time — treat this batter as unconfirmed.">PROJECTED · game-level</span>';
  return ' <span class="badge b-unk" title="The payload does not say whether this game’s lineup is official.">LINEUP UNKNOWN</span>';
}
function gameLineupChip(g){
  if(g.lineups_official===true)return pill('LINEUP CONFIRMED','b-ok','Official lineup posted for this game.');
  if(g.lineups_projected===true||g.lineups_official===false)return pill('LINEUP PROJECTED','b-warn','Official lineup was not posted at run time — batters and props for this game use projections.');
  return pill('LINEUP UNKNOWN','b-unk','The payload did not state whether this game’s lineup is official.');
}

/* ---------- canonical prediction ----------
   MODEL PREDICTION and BET/WATCH/PASS are different questions and are rendered
   as different things. The prediction says who wins; the recommendation is a
   verdict on the PRICE. A PASS therefore never means "no opinion". */
function predictionFor(g,m){
  g=g||{};m=m||{};var tm=teamsOf(g);
  /* When called with only an ml entry (no game card), take the sides from it. */
  if(!g.game&&!g.away_sp&&(m.away||m.home))tm={away:m.away||tm.away,home:m.home||tm.home};
  var src='canonical';
  var winner=g.projectedWinner||m.projectedWinner||null;
  var aw=isNum(g.awayWinProb)?g.awayWinProb:(isNum(m.awayWinProb)?m.awayWinProb:null);
  var hw=isNum(g.homeWinProb)?g.homeWinProb:(isNum(m.homeWinProb)?m.homeWinProb:null);
  if(aw!=null&&aw<=1)aw=aw*100;
  if(hw!=null&&hw<=1)hw=hw*100;
  if(aw==null&&hw!=null)aw=100-hw;
  if(hw==null&&aw!=null)hw=100-aw;
  /* A (side, confidence) pair must come from ONE object. gameCards.pick/conf and
     ml.pickSide/conf disagree on some games in real payloads, and splicing a
     side from one onto a confidence from the other invents a third answer. */
  function pairOf(o,sideVal){
    var c=isNum(o.confidence)?o.confidence:isNum(o.conf)?o.conf:null;
    return (sideVal&&isNum(c))?{side:sideVal,conf:c}:null;
  }
  var mSide=m.team||(m.pickSide==='home'?tm.home:m.pickSide==='away'?tm.away:null);
  var pML=pairOf(m,mSide),pGC=pairOf(g,g.pick);
  var pair=pML||pGC;
  var conf=pair?pair.conf:null;
  /* Do the two sources imply different winners? Say so rather than pick one. */
  var disagree=null;
  if(pML&&pGC){
    var wML=(pML.side===tm.away?pML.conf:100-pML.conf)>=50?tm.away:tm.home;
    var wGC=(pGC.side===tm.away?pGC.conf:100-pGC.conf)>=50?tm.away:tm.home;
    if(wML!==wGC)disagree='The moneyline row implies '+wML+' and the game card implies '+wGC+'. Showing the moneyline row, which is the priced one.';
  }
  if(winner==null||aw==null){
    /* Canonical fields are not in this build yet — derive the same shape and
       label it DERIVED rather than pretend it came from the model. */
    src='derived';
    if(!pair)return {ok:false,src:'none',away:tm.away,home:tm.home};
    if(aw==null){aw=(pair.side===tm.away)?pair.conf:100-pair.conf;hw=100-aw;}
    /* The projected winner is the side above 50% — NOT whichever side the pick
       field names. A PASS game often names a side the model has at 47%. */
    winner=isNum(aw)?(aw>=50?tm.away:tm.home):null;
  }
  if(winner==null&&isNum(aw))winner=aw>=50?tm.away:tm.home;
  var wp=winner===tm.away?aw:winner===tm.home?hw:null;
  return {ok:true,src:src,winner:winner,away:tm.away,home:tm.home,aw:aw,hw:hw,wp:wp,conf:conf,
    confSide:pair?pair.side:null,disagree:disagree,
    version:g.predictionVersion||m.predictionVersion||g.modelVersion||m.modelVersion||null};
}
function recFor(g,m){
  g=g||{};m=m||{};
  var r=g.moneylineRecommendation||m.moneylineRecommendation;
  if(r)return {rec:String(r).toUpperCase(),src:'canonical'};
  var t=String(g.tier||m.tier||'').toUpperCase();
  if(!t)return null;
  return {rec:t==='STRONG'?'BET':t==='LEAN'?'WATCH':'PASS',src:'derived'};
}
function recPill(r){
  var tip={BET:'The model’s edge clears the bet threshold at the posted price.',
    WATCH:'The model has a side, but the edge is too thin to bet at this price.',
    PASS:'No bet at this price. This is a verdict on the PRICE — the model still has a projected winner above.'}[r]||'';
  return pill(r,{BET:'b-ok',WATCH:'b-warn',PASS:'b-unk'}[r]||'b-unk',tip);
}
function predBlock(g,m){
  var p=predictionFor(g,m);
  if(!p.ok)return '<div class="pred"><div class="plab">Model prediction — projected winner</div>'
    +'<div class="pwin" style="font-size:13px;color:var(--muted)">'+INS+'</div>'
    +'<div class="psc">This payload carries no pick, confidence or win probability for this game.</div></div>';
  var derived=p.src==='derived'?' '+pill('DERIVED','b-unk','Win probability derived from the model pick + confidence. The pipeline’s canonical projectedWinner / awayWinProb / homeWinProb fields are '+NOT_IN_BUILD+'.'):'';
  var sc=(g.away_runs!=null&&g.home_runs!=null)
    ?('Projected score <b>'+esc(p.away)+' '+g.away_runs+'</b> — <b>'+esc(p.home)+' '+g.home_runs+'</b>')
    :('Projected score '+INS);
  return '<div class="pred"><div class="plab">Model prediction — projected winner'+derived+'</div>'
    +'<div class="pwin">'+teamLogo(p.winner)+'<span>'+esc(p.winner||'—')+'</span>'
    +'<span class="pwp">'+(isNum(p.wp)?p.wp.toFixed(0)+'% to win':INS)+'</span></div>'
    +'<div class="psc">'+esc(p.away)+' '+(isNum(p.aw)?p.aw.toFixed(0)+'%':'—')+' · '+esc(p.home)+' '+(isNum(p.hw)?p.hw.toFixed(0)+'%':'—')
    +' &nbsp;|&nbsp; '+sc+(p.version?' &nbsp;|&nbsp; '+esc(p.version):'')+'</div></div>';
}
function recBlock(g,m){
  m=m||{};
  var p=predictionFor(g,m),r=recFor(g,m);
  var imp=isNum(m.implied)?m.implied:null,edge=isNum(m.edge)?m.edge:null;
  var tail=r?recPill(r.rec)+(r.src==='derived'?' '+pill('FROM TIER','b-unk','moneylineRecommendation is '+NOT_IN_BUILD+' — mapped from the pick tier (STRONG→BET, LEAN→WATCH, PASS→PASS).'):'')
           :pill('NO RECOMMENDATION','b-unk','No tier or recommendation for this game.');
  /* MODEL, MARKET and EDGE all describe the SAME side — name it, so a card whose
     projected winner differs from the priced side can never read as a
     contradiction. */
  var side=p.confSide||m.team||(m.pickSide==='home'?m.home:m.pickSide==='away'?m.away:null)||p.winner;
  var sideTxt=side?' ('+esc(side)+')':'';
  var mismatch=(side&&p.winner&&side!==p.winner)
    ?' '+pill('EVALUATED SIDE: '+side,'b-info','The model’s projected winner is '+p.winner+'. The side being priced and evaluated for value here is '+side+' — that is normal for a value play on the underdog. All three numbers below describe '+side+'.'):'';
  var dis=p.disagree?' '+pill('SOURCES DISAGREE','b-warn',p.disagree):'';
  return '<div class="recrow"><span class="plab" style="flex:0 0 100%">Bet recommendation — a verdict on the PRICE, not on the winner above'+mismatch+dis+'</span>'
    +'<span title="Model confidence in '+esc(side||'the priced side')+', independent of price."><b>MODEL'+sideTxt+'</b> '+(isNum(p.conf)?p.conf+'%':INS)+'</span>'
    +'<span title="What the posted price implies for '+esc(side||'the same side')+'."><b>MARKET'+sideTxt+'</b> '+(imp!=null?imp+'%':INS)+'</span>'
    +'<span title="Model confidence minus the price’s implied probability."><b>EDGE</b> '+(edge!=null?(edge>0?'+':'')+edge+'pt':INS)+'</span>'
    +tail+'</div>';
}

/* ---------- starting pitcher role + workload ----------
   Quality, role and workload are three separate facts. A GOOD pitcher opening
   for 1.7 innings is not a good start, so they never collapse into one badge. */
function spWorkload(sp){
  if(!sp)return '';
  var hasRole=(sp.role!==undefined||sp.expIp!==undefined||sp.impactLabel!==undefined||sp.impactShare!==undefined||sp.gs!==undefined);
  var q='Quality '+spTierBadge(sp.tier||'UNKNOWN')
       +(sp.qualitySample?' <span style="color:var(--muted)">'+esc(sp.qualitySample)+'</span>':(isNum(sp.ip)?' <span style="color:var(--muted)">('+sp.ip.toFixed(0)+' IP)</span>':''));
  if(!hasRole)
    return '<div class="splab">'+q+' · Role '+pill('UNKNOWN','b-unk','Pitcher role classification ('+NOT_IN_BUILD+'). Until it lands, xERA is assumed to be a full-start number.')
      +' · Exp IP <i>'+NOT_IN_BUILD+'</i></div>';
  var role=sp.role?String(sp.role).replace(/_/g,' '):'UNKNOWN';
  var roleCls=role==='UNKNOWN'?'b-unk':(sp.isTrueStarter===false||/OPENER|BULLPEN|TANDEM|LIMITED/.test(role))?'b-warn':'b-good';
  var rc=isNum(sp.roleConfidence)?(sp.roleConfidence<=1?Math.round(sp.roleConfidence*100):Math.round(sp.roleConfidence))+'%':null;
  var bits=[q,'Role '+pill(role,roleCls,role==='UNKNOWN'?'The role model could not classify this start — treat expected workload as unknown.':'Role classification from the pipeline.')+(rc?' <span style="color:var(--muted)">'+rc+' conf</span>':''),
    'Exp IP <i>'+(isNum(sp.expIp)?sp.expIp.toFixed(1):INS)+'</i>'+(isNum(sp.expBf)?' <span style="color:var(--muted)">('+sp.expBf+' BF)</span>':''),
    'Impact <i>'+esc(sp.impactLabel||(isNum(sp.impactShare)?Math.round((sp.impactShare<=1?sp.impactShare*100:sp.impactShare))+'%':INS))+'</i>'];
  if(isNum(sp.gs))bits.push('GS <i>'+sp.gs+'</i>');
  if(isNum(sp.xeraStarterEquiv))bits.push('xERA starter-eq <i>'+sp.xeraStarterEquiv.toFixed(2)+'</i>');
  else if(isNum(sp.xeraAdj))bits.push('xERA adj <i>'+sp.xeraAdj.toFixed(2)+'</i>');
  return '<div class="splab">'+bits.join(' · ')+'</div>';
}

/* ---------- NRFI/YRFI ----------
   nrfiProb / yrfiProb are published as null on purpose. Show the raw score and
   the stated reason; never substitute a stand-in percentage. */
function nrfiProbTxt(r){
  r=r||{};
  var declared=('nrfiProb' in r)||('yrfiProb' in r);
  if(declared&&r.nrfiProb==null&&r.yrfiProb==null){
    var nr=D.nullReasons||{};
    var why=nr.nrfiProb||nr.yrfiProb||nr.nrfi||r.nullReason||'the pipeline published this probability as null';
    return {txt:(isNum(r.score)?'score '+r.score:INS),chip:pill('NO PROBABILITY','b-unk',why),why:why};
  }
  var p=isNum(r.nrfiProb)?r.nrfiProb:isNum(r.yrfiProb)?r.yrfiProb:isNum(r.pComb)?r.pComb:null;
  if(p!=null&&p<=1)p=p*100;
  return {txt:(p!=null?p.toFixed(1)+'%':(isNum(r.score)?'score '+r.score:INS)),chip:'',why:''};
}
function windArrows(z){if(!z||!z.length)return '';var A={out:['⬆','var(--accent)'],in:['⬇','var(--lose)'],cross:['⬌','var(--draw)']};return '<div class="wind">'+z.map(function(w){var a=A[w.dir]||['·','var(--muted)'];return '<span class="wz"><span class="wzl">'+esc(w.zone)+'</span><span class="wza" style="color:'+a[1]+'">'+a[0]+'</span><span class="wzm">'+w.mph+'</span></span>';}).join('')+'</div>';}

/* Was stripping lineupStatus / eligible / lineupReason before render, so the same

function gameProps(pk){var bf=D.boardsFull||D.boards||{};var out=[];

/* Batting order with a per-player lineup marker. Uses the row's own status when

function libTicketSummary(list){

/* Centralized price-measurability gate (2026-08-27). A price-based metric
   (units, ROI, CLV, avg price) is shown ONLY when the backend says the market
   is measurable AND carries priced rows. Compatible with BOTH the current
   payload (n_priced only) and the proposed pipeline payload (measurement_status
   + roi_pct:null). Missing/ambiguous -> NOT measurable. Honesty is the default. */
function isPriceMeasurable(m){
  if(!m) return false;

function lineupCensus(){
  var byState={},seen={},total=0,elig=0;
  function take(r){
    if(!r||r.playerId==null)return;
    if(r.lineupStatus===undefined&&r.eligible===undefined)return;
    var k=r.gamePk+'|'+r.playerId;if(seen[k])return;seen[k]=1;total++;
    if(r.eligible===true)elig++;
    var s=r.lineupStatus||(r.eligible===true?'CONFIRMED_STARTER':'UNKNOWN');
    byState[s]=(byState[s]||0)+1;
  }
  var bf=D.boardsFull||D.boards||{};
  Object.keys(bf).forEach(function(k){(bf[k]||[]).forEach(take);});
  (D.hrProps||[]).forEach(take);(D.hitProps||[]).forEach(take);
  return {byState:byState,total:total,eligible:elig};
}
function spCensus(){
  var rows=[],seen={};
  (D.gameCards||[]).forEach(function(g){['away_sp','home_sp'].forEach(function(k){
    var sp=g[k];if(!sp||!sp.name)return;var id=g.gamePk+'|'+k;if(seen[id])return;seen[id]=1;
    var o={};for(var p in sp)o[p]=sp[p];o.gamePk=g.gamePk;o.game=g.game;rows.push(o);});});
  if(!rows.length)(D.startingPitchers||[]).forEach(function(s){['away','home'].forEach(function(k){
    if(!s[k])return;var o={};for(var p in s[k])o[p]=s[k][p];o.game=s.game;o.gamePk=s.gamePk;rows.push(o);});});
  return rows;
}

    if(op.closing_prices_available===false)warn(ck.phase==='POST_LOCK'?'HIGH':'MEDIUM','odds provider','no closing prices'+(ck.phase==='POST_LOCK'?' past the lock':' yet')+' — ROI/CLV stay unmeasurable.');
    var la=agoMin(op.last_success_at);

  if(cons&&cons.failed)warn('HIGH','consistency',cons.failed+' of '+nz(cons.checked,'?')+' cross-field consistency checks failed.');

      +((cons.issues||[]).length?'<div class="tblwrap"><table class="aht"><tr><th>Issue</th></tr>'+cons.issues.map(function(i){return '<tr><td class="wrap">'+esc(typeof i==='string'?i:JSON.stringify(i))+'</td></tr>';}).join('')+'</table></div>':'<div class="note">No issues listed.</div>'))
    :'<div class="empty">consistency is '+NOT_IN_BUILD+' — nothing verifies that the projected winner, win probabilities and recommendation agree with each other.</div>');

  /* 10. warnings */
  h+=ahs('Current warnings',hs.warnings.length+' total',
    hs.warnings.length?hs.warnings.map(function(w){
      return '<div class="sevrow">'+sevPill(w.level)+'<span class="sevw"><span class="seva">'+esc(w.area)+'</span><br>'+esc(w.msg)+'</span></div>';}).join('')
    :'<div class="note">Nothing to report at MEDIUM or worse. Note this is only as good as what the payload asserts — see UNKNOWN counts above.</div>');

  /* 11. report */
  h+=ahs('Report an issue','',
    '<div style="display:flex;gap:8px;flex-wrap:wrap">'
    +[['Incorrect data','incorrect-data'],['Missing player','missing-player'],['Wrong lineup status','lineup-status'],
      ['Pitcher role wrong','pitcher-role'],['Odds / price problem','odds'],['UI problem','ui'],['Workflow failure','workflow']]
      .map(function(t){return reportBtn({page:'admin',title:t[0],market:t[1]},t[0]);}).join('')
    +'</div><div class="note">Each link opens a pre-filled GitHub issue carrying the build, the model version and the exact data timestamp on screen.</div>');

  $('admin').innerHTML=h;
}
function renderMethod(){
  var mc="color:var(--muted);font-size:11.5px;line-height:1.65";
  var card="background:var(--panel2,#12161d);border:1px solid var(--line,#222);border-left:3px solid #4dc870;border-radius:8px;padding:12px 15px;margin:10px 0";
  var h="color:#4dc870;font-weight:700;font-size:13px;margin-bottom:5px";
  $('method').innerHTML=''+
  '<div style="max-width:840px;margin:0 auto">'+
  '<h2 style="color:#fff">How each pick is calculated</h2>'+
  '<p style="'+mc+';margin-bottom:6px">Plain-English summary of the live algorithms. These are explicit rule sets, not a trained model. Many thresholds are still being calibrated from real results — treat the numbers as a disciplined starting point, not a proven edge (measured CLV is roughly break-even).</p>'+

  '<div style="'+card+'"><div style="'+h+'">Moneyline (V3.3/V3.4)</div><p style="'+mc+'">'+
  'Start at 50% confidence, +4 if home. The biggest mover is the starting-pitcher gap: (opponent xERA − our xERA) × 4 — a much better starter is a big edge. Then subtract for warning signs (a bad last start, a 5+ game losing skid, being swept, an elite opposing starter, a top-10 opposing offense, a lockdown opposing bullpen) and add for tailwinds (facing elimination, an opposing starter due to regress, a fresh coaching change). Team form (R71) adds a small ±2 nudge for hot/cold teams — a tiebreaker, never a driver. '+
  'Then compare confidence to the price\'s implied odds: BET STRONG at 72%+ confidence with 5+ points of edge; LEAN at 63%+ with 5+ edge (or a big-edge underdog). Hard rules: never bet against the Yankees, never on a TBD starter.</p></div>'+

  '<div style="'+card+'"><div style="'+h+'">NRFI / YRFI — no/yes run in the 1st inning (V4)</div><p style="'+mc+'">'+
  'Blend both starting pitchers\' first-inning scores (xERA, strikeout & walk rates, recent form) — 55% of the score. Add both lineups\' first-inning offense — 25% — now driven by the on-base % of the batters actually hitting 1-2-3 in today\'s posted lineup (a weak or short-handed top of the order means fewer baserunners → better NRFI; before lineups post it falls back to a season team rating). Add the park\'s first-inning run factor — 15%. Then adjust for weather (cold air and wind blowing in favor NRFI; heat and wind blowing out favor YRFI), an elite-pitcher bonus, and a blow-up-risk penalty. 72+ = strong NRFI, very low = strong YRFI. Rain over 40% voids the game.</p></div>'+

  '<div style="'+card+'"><div style="'+h+'">Home Runs (V4.2)</div><p style="'+mc+'">'+
  'A 0–100 score from six pieces: the hitter\'s raw power (ISO, up to 20), how hittable the opposing starter is by xERA (up to 25), wind (up to 20 — out-and-hot is the jackpot, wind blowing in nearly zeroes it), the ballpark (15), where he bats in the order (10), and recent form (10) — plus a small pitch-matchup nudge. 85+ is Tier A, 75+ Tier B. Finally the score is turned into a fair probability and compared to the book\'s home-run price to show the edge.</p></div>'+

  '<div style="'+card+'"><div style="'+h+'">Hits — 1+ Hit / 2B+ (V3.1)</div><p style="'+mc+'">'+
  'Driven mostly by how hittable the opposing starter is (xERA, up to 30 — the single biggest factor). Then the hitter\'s own quality (up to 25 = batting avg × 50 + extra-base-hits-per-game × 20 + hits-per-game × 15), wind (up to 20, and it mainly matters for 2B+ where fly balls carry into gaps), batting-order slot (15, top-4 bats best for volume), and recent form (10). A cold streak overrides down.</p></div>'+

  '<div style="'+card+';border-left-color:#e8a030"><div style="'+h+';color:#e8a030">Parlay tickets (V-P4)</div><p style="'+mc+'">'+
  'Three tickets daily. <b>Ticket 1 — Safe Parlay</b> (max 3 legs, no HR): only 1+ hit, NRFI/YRFI ≥75%, and strong Over/Unders. It BANS 2+ total bases and 2+ hits+runs+RBI, which historically hit only ~45% and ~22% and were the recurring ticket-killers. <b>Tickets 2 & 3 — HR Top-2 and HR Lotto</b> (6-leg, correlated slugfests). '+
  'Two honesty layers sit on top: (1) a <b>calibration haircut</b> — the model overrates its most confident picks, so a raw 70–80% is treated as ~52–62% and anything 80%+ as 55% before it\'s ranked; 1+ hit is capped at its real ~72% rate. (2) a <b>price gate</b> — every leg shows a real sportsbook price and only positive-edge legs survive; player props post late, so unpriced legs are kept but flagged "verify price." The <b>Over rule (R72)</b>: an Over only qualifies with a wind boost AND a projection at least 1.5 runs above the line AND lineups that aren\'t cold. Legs are ordered most-to-least confident so you trim from the bottom.</p></div>'+

  '<p style="'+mc+';margin-top:10px;color:#777">The honest caveat: these rules reduce obvious mistakes and enforce discipline, but none of them has yet been proven to beat the closing line. The next real improvement is the weekly recalibration loop that re-derives these thresholds from settled results.</p>'+
  '</div>';
}
function renderAll(){
  window._LUIX=null; /* lineup index is derived from D — rebuild it on every render */
  /* Each renderer is isolated: one bad section must not blank the whole page. */
  [['meta',renderMeta],['slate',renderSlate],['picks',renderPicks],['matchups',renderMatchups],
   ['props',renderProps],['parlay',renderParlay],['performance',renderPerformance],
   ['library',renderLibrary],['admin',renderAdmin],['method',renderMethod]].forEach(function(r){
    try{r[1]();}catch(e){
      if(window.console&&console.error)console.error('render '+r[0]+' failed',e);
      var el=$(r[0]);
      if(el)el.innerHTML='<div class="empty">This section failed to render against today’s payload ('+esc(e&&e.message||'error')+'). The rest of the page is unaffected.</div>';
    }
  });
}
async function refresh(){if(!DATA_URL){location.reload();return;}try{var r=await fetch(DATA_URL+(DATA_URL.indexOf('?')<0?'?':'&')+'_='+Date.now());D=await r.json();MODEL_DATA=D;renderAll();}catch(e){location.reload();}}
buildNav();renderAll();

<script>
var ARS_P=null,ARS_B=null,SC_CACHE={};
function mxSplit(l){var r=[],c='',q=false;for(var i=0;i<l.length;i++){var ch=l[i];if(ch=='"')q=!q;else if(ch==','&&!q){r.push(c);c='';}else c+=ch;}r.push(c);return r;}
function mxCSV(t){var L=t.split(/\r?\n/).filter(function(x){return x.length;});if(!L.length)return[];var h=mxSplit(L[0]);var o=[];for(var i=1;i<L.length;i++){var c=mxSplit(L[i]);if(c.length<h.length)continue;var r={};for(var j=0;j<h.length;j++)r[h[j]]=c[j];o.push(r);}return o;}
async function mxText(u){var r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);return await r.text();}
function mxYear(){return (MODEL_DATA.date||'2026').slice(0,4);}
async function mxEnsureArsenal(){if(ARS_P&&ARS_B)return;var b='https://baseballsavant.mlb.com/leaderboard/pitch-arsenal-stats?year='+mxYear()+'&min=5&hand=&csv=true&type=';var res=await Promise.all([mxText(b+'pitcher'),mxText(b+'batter')]);var idx=function(rows){var m={};rows.forEach(function(r){var id=r.player_id;(m[id]=m[id]||[]).push(r);});return m;};ARS_P=idx(mxCSV(res[0]));ARS_B=idx(mxCSV(res[1]));}
async function mxStatcast(pid){if(SC_CACHE[pid])return SC_CACHE[pid];var y=mxYear();var u='https://baseballsavant.mlb.com/statcast_search/csv?all=true&type=details&player_type=batter&batters_lookup%5B%5D='+pid+'&game_date_gt='+y+'-03-01&game_date_lt='+y+'-12-01&min_pitches=0&min_results=0';var rows=mxCSV(await mxText(u));SC_CACHE[pid]=rows;return rows;}
function mxGrade(p){p=p==null?0:p;return p>=.85?'A+':p>=.72?'A':p>=.6?'B+':p>=.48?'B':p>=.36?'C+':'C';}
function mxBar(label,pct,valTxt){pct=Math.max(2,Math.min(100,pct));return '<div class="mx-bar"><span class="mx-blab">'+label+'</span><span class="mx-btrack"><span class="mx-bfill" style="width:'+pct+'%"></span></span><span class="mx-bval">'+valTxt+'</span></div>';}
function closeMatchupModal(){document.getElementById('mxOverlay').style.display='none';}
function mxGc(pk){return ((MODEL_DATA.gameCards)||[]).filter(function(c){return c.gamePk===pk;})[0]||{};}
function mxOppSP(c,team){if(c.away_sp&&c.away_sp.team===team)return c.home_sp;if(c.home_sp&&c.home_sp.team===team)return c.away_sp;return null;}
function openMatchupModal(pid,gamePk,name,team){
  var ov=document.getElementById('mxOverlay');var body=document.getElementById('mxBody');ov.style.display='block';window.scrollTo(0,0);
  var c=mxGc(gamePk);var opp=mxOppSP(c,team)||{};
  function _bfRow(k,id){var bf=(MODEL_DATA.boardsFull)||(MODEL_DATA.boards)||{};return ((bf[k]||[]).filter(function(r){return r.playerId===id;})[0])||null;}
  var hr=((MODEL_DATA.hrProps)||[]).filter(function(x){return x.playerId===pid;})[0]||_bfRow('hr',pid)||{};
  var hit=((MODEL_DATA.hitProps)||[]).filter(function(x){return x.playerId===pid;})[0]||_bfRow('h1',pid)||{};
  var head='<div class="mx-head"><div class="mx-bat">'+hs(pid,true)+'<div><div class="mx-nm">'+esc(name)+'</div><div class="mx-sub">'+esc(team)+'</div></div></div>'
    +'<div class="mx-sub">vs</div>'
    +'<div class="mx-pit">'+(opp.id?hs(opp.id,true):'')+'<div><div class="mx-nm">'+esc(opp.name||'TBD')+'</div><div class="mx-sub">'+(opp.throws||'')+'HP'+(opp.arsenal?' &middot; '+esc(opp.arsenal):'')+(opp.fb_pct!=null?' &middot; '+opp.fb_pct+'% FB':'')+'</div></div></div></div>';
  var bars='';
  if(hr.iso!=null) bars+=mxBar('ISO',hr.iso*250,hr.iso.toFixed(3));
  if(hr.hr!=null) bars+=mxBar('Season HR',Math.min(100,hr.hr*4),hr.hr+'');
  if(hr.spXera!=null) bars+=mxBar('vs SP xERA',Math.min(100,hr.spXera*16),hr.spXera.toFixed(2));
  if(hit.avg!=null) bars+=mxBar('AVG',hit.avg*280,hit.avg.toFixed(3));
  if(hit.hpg!=null) bars+=mxBar('Hits/Game',hit.hpg*70,hit.hpg.toFixed(2));
  if(hit.xbh!=null) bars+=mxBar('XBH/Game',hit.xbh*120,(''+hit.xbh));
  if(hr.park) bars+=mxBar('Park',60,esc(hr.park).slice(0,14));
  if(hr.wind) bars+=mxBar('Wind',50,esc(hr.wind));
  var grade=mxGrade((hr.score||hit.score||55)/100);
  var thesis=esc(hr.note&&hr.note!=='NO_ODDS'?hr.note:('Matchup vs '+(opp.throws||'')+'HP '+(opp.name||'')+(opp.arsenal?' ('+opp.arsenal+')':'')+'. Model board score '+(hr.score||hit.score||'—')+'.'));
  var left='<div class="mx-grade"><div class="mx-gcirc"><div class="mx-gletter">'+grade+'</div></div><div class="mx-thesis">'+thesis+'</div></div>'
    +'<div class="mx-h2">Model Breakdown</div>'+(bars||'<div class="mx-sub">No model factors for this hitter.</div>')
    +'<div class="mx-h2">Prop Ratings</div><div id="mxProbs">'+mxProbs(pid)+'</div>';
  var right='<div id="mxRight"><div class="mx-h2">Loading Statcast &amp; arsenals…</div><div class="mx-loading">Pulling live Baseball Savant data…</div></div>';
  body.innerHTML=head+'<div class="mx-cols"><div>'+left+'</div><div>'+right+'</div></div>';
  mxLoadDetail(pid,opp,name);
}
function mxProbs(pid){
  var bf=(MODEL_DATA.boardsFull)||(MODEL_DATA.boards)||{};
  var defs=[['hr','HR'],['h1','1+ Hit'],['tb2','2+ TB'],['hrr','2+ HRR']];
  var rt={};defs.forEach(function(d){rt[d[0]]=rate10fn(bf[d[0]]||[],function(r){return r.metric;});});
  var rows=defs.map(function(d){var row=(bf[d[0]]||[]).filter(function(r){return r.playerId===pid;})[0];if(!row)return '';return '<tr><td>'+d[1]+'</td><td>'+ratePill(rt[d[0]](row.metric))+'</td><td>'+(row.metric!=null?row.metric:'—')+'</td></tr>';}).filter(Boolean).join('');
  return rows?'<table class="mx-tbl"><tr><th>Prop</th><th>Rating</th><th>Metric</th></tr>'+rows+'</table>':'<div class="mx-sub">Not on any board today.</div>';
}
async function mxLoadDetail(pid,opp,name){
  var R=document.getElementById('mxRight');if(!R)return;
  var html='';
  try{
    await mxEnsureArsenal();
    if(opp.id&&ARS_P[opp.id]){
      var pa=ARS_P[opp.id].slice().sort(function(a,b){return (+b.pitch_usage)-(+a.pitch_usage);});
      html+='<div class="mx-h2">'+esc(opp.name||'Pitcher')+' Arsenal (results allowed)</div><table class="mx-tbl"><tr><th>Pitch</th><th>Use%</th><th>BA</th><th>SLG</th><th>wOBA</th><th>Whiff%</th></tr>'+pa.map(function(r){return '<tr><td>'+esc(r.pitch_name)+'</td><td>'+Math.round(+r.pitch_usage)+'</td><td>'+(r.ba||'—')+'</td><td>'+(r.slg||'—')+'</td><td>'+(r.woba||'—')+'</td><td>'+(r.whiff_percent||'—')+'</td></tr>';}).join('')+'</table>';
    }
    if(ARS_B[pid]){
      var ba=ARS_B[pid].slice().sort(function(a,b){return (+b.pitch_usage)-(+a.pitch_usage);});
      html+='<div class="mx-h2">'+esc(name)+' vs Pitch Type</div><table class="mx-tbl"><tr><th>Pitch</th><th>Seen%</th><th>BA</th><th>SLG</th><th>wOBA</th><th>Whiff%</th></tr>'+ba.map(function(r){return '<tr><td>'+esc(r.pitch_name)+'</td><td>'+Math.round(+r.pitch_usage)+'</td><td>'+(r.ba||'—')+'</td><td>'+(r.slg||'—')+'</td><td>'+(r.woba||'—')+'</td><td>'+(r.whiff_percent||'—')+'</td></tr>';}).join('')+'</table>';
    }
  }catch(e){html+='<div class="mx-note">Arsenal data unavailable ('+e.message+')</div>';}
  try{
    var rows=await mxStatcast(pid);
    var bip=rows.filter(function(r){return r.launch_speed&&r.launch_speed!=='null';});
    html+=mxContact(bip)+mxZone(bip)+mxSpray(bip)+mxRecent(bip);
  }catch(e){html+='<div class="mx-note">Statcast unavailable ('+e.message+')</div>';}
  if(R)R.innerHTML=html||'<div class="mx-sub">No detail data.</div>';
}
var HITSET={single:1,double:1,triple:1,home_run:1};
function mxContact(bip){
  if(!bip.length)return '';
  var last=bip.slice(-14);
  var sq=last.map(function(r){var ev=+r.launch_speed;var c=ev>=98?'#34d399':ev>=90?'#fbbf24':'#f87171';return '<span class="mx-cqsq" style="background:'+c+'" title="'+ev+' mph"></span>';}).join('');
  var hh=bip.filter(function(r){return +r.launch_speed>=95;}).length;
  return '<div class="mx-h2">Contact Quality (last '+last.length+' BIP)</div><div class="mx-cq">'+sq+'</div><div class="mx-sub">Hard-hit '+Math.round(100*hh/bip.length)+'% &middot; avg EV '+(bip.reduce(function(a,r){return a+(+r.launch_speed);},0)/bip.length).toFixed(1)+' mph &middot; <span style="color:#34d399">98+</span> <span style="color:#fbbf24">90-97</span> <span style="color:#f87171">&lt;90</span></div>';
}
function mxZone(bip){
  var z={};bip.forEach(function(r){var n=+r.zone;if(n>=1&&n<=9){(z[n]=z[n]||{h:0,n:0});z[n].n++;if(HITSET[r.events])z[n].h++;}});
  var cells='';for(var i=1;i<=9;i++){var d=z[i];var rate=d&&d.n?d.h/d.n:null;var bg=rate==null?'#13283a':rate>=.35?'#34d399':rate>=.2?'#fbbf24':'#f87171';var lab=d&&d.n?(Math.round(100*rate)+'%'):'—';cells+='<div class="mx-zcell" style="background:'+bg+'">'+lab+'<span style="font-size:7px">'+(d?d.n:0)+' BIP</span></div>';}
  return '<div class="mx-h2">Strike-Zone Results (hit% by zone, catcher view)</div><div class="mx-zone">'+cells+'</div>';
}
function mxSpray(bip){
  var pts=bip.filter(function(r){return r.hc_x&&r.hc_y&&r.hc_x!=='null';});
  if(!pts.length)return '';
  var dot=pts.map(function(r){var x=(+r.hc_x);var y=(+r.hc_y);var col=r.events==='home_run'?'#f87171':HITSET[r.events]?'#34d399':'#64748b';return '<circle cx="'+x.toFixed(0)+'" cy="'+y.toFixed(0)+'" r="2.2" fill="'+col+'" opacity="0.8"/>';}).join('');
  return '<div class="mx-h2">Spray Chart ('+pts.length+' batted balls)</div><svg viewBox="0 0 250 230" style="width:100%;max-width:320px;display:block;margin:0 auto;background:#0a1626;border:1px solid rgba(34,211,238,.2);border-radius:10px"><path d="M125 205 L40 120 A120 120 0 0 1 210 120 Z" fill="rgba(34,211,238,.05)" stroke="rgba(34,211,238,.25)"/><line x1="125" y1="205" x2="40" y2="120" stroke="rgba(34,211,238,.25)"/><line x1="125" y1="205" x2="210" y2="120" stroke="rgba(34,211,238,.25)"/>'+dot+'<circle cx="125" cy="205" r="2.5" fill="#fbbf24"/></svg><div class="mx-sub" style="text-align:center"><span style="color:#f87171">HR</span> &middot; <span style="color:#34d399">hit</span> &middot; <span style="color:#64748b">out</span></div>';
}
function mxRecent(bip){
  if(!bip.length)return '';
  var rec=bip.slice(-9).reverse();
  var cards=rec.map(function(r){var ev=+r.launch_speed;var c=ev>=98?'#34d399':ev>=90?'#fbbf24':'#f87171';var res=(r.events||'').replace(/_/g,' ');return '<div class="mx-bbc"><div class="mx-bbev" style="color:'+c+'">'+ev.toFixed(0)+'</div><div class="mx-bbsub">'+(r.launch_angle||'?')+'° &middot; '+esc(res||'in play')+'</div></div>';}).join('');
  return '<div class="mx-h2">Recent Batted Balls (EV mph)</div><div class="mx-bb">'+cards+'</div>';
}

</script>
<script>
/* Odds freshness bar (V-P4, 2026-07-27): shows when odds were last pulled +
   API credits left, so a stale slate ("hit Refresh") is distinguishable from
   "books haven't posted props yet". Self-contained + defensive — never throws
   into the page; if D.odds is absent it degrades to the static hint. */
(function(){
  try{
    var el=document.getElementById('oddsfresh'); if(!el) return;
    var D=window.D||window.MODEL_DATA||{}; var o=D.odds||{};
    function ago(iso){
      if(!iso) return null;
      var m=(Date.now()-new Date(iso).getTime())/60000;
      if(isNaN(m)) return null;
      if(m<1) return 'just now';
      if(m<60) return Math.round(m)+'m ago';
      return Math.floor(m/60)+'h '+Math.round(m%60)+'m ago';
    }
    var parts=[];
    if(o.pulledAt) parts.push('odds pulled '+ago(o.pulledAt));
    else if(o.note) parts.push('odds: '+o.note);
    else parts.push('odds not pulled this run');
    if(o.remaining!=null) parts.push(o.remaining+' API credits left');
    if(o.pricedLegs!=null && o.totalLegs) parts.push(o.pricedLegs+'/'+o.totalLegs+' legs priced');
    parts.push('props post ~3–4h before first pitch');
    el.textContent=parts.join('  ·  ');
  }catch(e){}
})();
</script>
