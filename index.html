main{max-width:1100px;margin:0 auto;padding:0 16px 60px}
section{display:none}section.active{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}

.team .nm{font-size:12.5px;flex:1;color:var(--muted)}
.team .rs{font-family:var(--mono);font-weight:700;font-size:18px;margin-left:auto}

.subrow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:6px;flex-wrap:wrap;gap:6px}

.prop-tabs button.on{background:var(--accent);color:#fdf8ec;border-color:var(--accent)}
.prow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}

.empty{font-family:var(--mono);font-size:12px;color:var(--muted);padding:20px;text-align:center}

.kpos .kv2{color:var(--accent)}.kneg .kv2{color:var(--lose)}

.byo{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}

.luok{color:#1b9e4b;font-weight:800;font-family:var(--mono);margin-left:4px}

var LIB_TAB='safe';
function libTab(k){LIB_TAB=k;renderLibrary();}
function libA2D(a){return a>0?1+a/100:1+100/Math.abs(a);}
function libTicketCards(list){
  return list.map(function(p){
    var badge=p.result==='win'?'<span class="badge b-win">✓ HIT</span>':p.result==='loss'?'<span class="badge b-loss">✗ MISS</span>':p.result==='void'?'<span class="badge b-pass">∅ void</span>':'<span class="badge b-pass">⏳ pending</span>';
    var legs=(p.legs||[]).map(function(l){var ic=l.result==='win'?'<span style="color:var(--accent)">✓</span>':l.result==='loss'?'<span style="color:var(--lose)">✗</span>':l.result==='void'?'<span style="color:var(--muted)">∅</span>':'<span style="color:var(--muted)">·</span>';return '<div class="pl-leg">'+ic+' '+esc(l.desc)+(l.result==='void'?' <span style="color:var(--muted)">(game postponed — leg voided)</span>':'')+'</div>';}).join('');
    var oddsTag=p.odds!=null?' <span style="color:var(--muted);font-size:10px">'+(p.odds>0?'+':'')+p.odds+'</span>':'';
    return '<details class="pl-day"><summary>'+esc(p.date)+' · '+esc(p.name||'Parlay')+oddsTag+' '+badge+' <span style="color:var(--muted)">'+p.wins+'/'+p.n+' legs</span></summary><div class="pl-legs">'+legs+'</div></details>';
  }).join('')||'<div class="empty">Nothing logged here yet.</div>';
}
function libSum(html){return '<div class="note" style="margin:0 0 8px;padding:8px 10px;background:var(--panel,#f1f5f9);border-radius:8px">'+html+'</div>';}
function libTicketSummary(list){
  var w=0,l=0,pend=0,u=0,np=0,unpriced=0;
  list.forEach(function(p){
    if(p.result==='win')w++;else if(p.result==='loss')l++;else pend++;
    if(p.result==='win'||p.result==='loss'){
      if(p.odds!=null){u+=p.result==='win'?(libA2D(p.odds)-1):-1;np++;}
      else unpriced++;
    }
  });
  if(!(w+l+pend))return '';
  var uStr=np?((u>=0?'+':'')+u.toFixed(1)+'u ('+(u>=0?'+$':'-$')+Math.abs(u*10).toFixed(0)+' at $10/u, '+np+' priced tickets)'):'— no ticket odds logged yet';
  return libSum('<b>Record:</b> '+w+'-'+l+(pend?' · '+pend+' pending':'')+' ('+(w+l?Math.round(w/(w+l)*100):0)+'% hit) · <b>Units @ $10:</b> '+uStr+(unpriced?' · '+unpriced+' settled tickets had no logged odds (excluded)':''));
}

function libStatusPill(s){
  var m={BET:['#0c7a43','#dcfce7'],WATCH:['#92400e','#fef3c7'],
         KILL:['#b91c1c','#fee2e2'],BLIND:['#475569','#e2e8f0']}[s]||['#475569','#e2e8f0'];
  return '<span class="badge" style="color:'+m[0]+';background:'+m[1]+'">'+esc(s||'BLIND')+'</span>';
}
function libPropSummary(bh,cat){
  var w=0,n=0,w7=0,n7=0,days=0;
  bh.forEach(function(d){var c=(d.cats||{})[cat];if(!c)return;days++;w+=c.w;n+=c.n;if(days<=7){w7+=c.w;n7+=c.n;}});
  var L=((D.learned||{}).markets||{})[cat]||{};
  var st=L.status||'BLIND';
  var head=libStatusPill(st)+(L.reason?' <span style="font-size:10px;color:var(--muted)">'+esc(L.reason)+'</span>':'');
  var rec=n?('<b>Last '+days+' logged days:</b> '+w+'/'+n+' ('+Math.round(w/n*100)+'%) · <b>last 7:</b> '+w7+'/'+n7):'';
  var money;
  if(L.n_priced&&L.units!=null){
    var u=L.units;
    money='<b>Units @ $10:</b> '+(u>=0?'+':'')+u.toFixed(1)+'u ('+(u>=0?'+$':'-$')+Math.abs(u*10).toFixed(0)+')'
      +(L.roi_pct!=null?' · ROI '+L.roi_pct+'%':'')
      +(L.mean_clv_pp!=null?' · CLV '+L.mean_clv_pp+'pp':'')
      +' <span style="font-size:9px;color:var(--muted)">from '+L.n_priced+' logged prices</span>';
  }else{
    money='<b>Units: not measurable yet</b> <span style="font-size:9px;color:#b45309">no logged prices for this market — a units figure would be an assumption, not a measurement</span>';
  }
  return libSum(head+'<br>'+(rec?rec+'<br>':'')+money);
}

function renderMeta(){var n=(D.gameCards||[]).length;var upd=D.generatedAt?new Date(D.generatedAt).toLocaleString():'—';var ageM=D.generatedAt?Math.round((Date.now()-new Date(D.generatedAt).getTime())/60000):null;var ageCol=ageM==null?'var(--muted)':ageM>90?'#b45309':ageM>150?'#b91c1c':'var(--accent)';var ageChip=ageM==null?'':'<span style="font-weight:800;color:'+ageCol+'" title="How old this page\'s data is. Lineups/SPs posted after this moment are NOT here yet — hit Pull fresh.">data '+(ageM<60?ageM+'m':Math.floor(ageM/60)+'h'+(ageM%60)+'m')+' old</span>';var lu=D.lineupsProjected?'<span style="font-weight:800;color:#b45309" title="At least one lineup was still unposted at run time — props/tickets used season stats for those teams">lineups: PROJECTED</span>':'<span style="font-weight:800;color:var(--accent)">lineups: OFFICIAL</span>';var pull='<a href="https://github.com/amercado19/mlb-pipeline/actions/workflows/daily-picks.yml" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border:1.5px solid var(--accent,#0c7a43);border-radius:7px;background:none;color:var(--accent,#0c7a43);font-family:var(--mono);font-weight:700;font-size:11px;cursor:pointer;text-decoration:none" title="Runs the FULL pipeline now — fresh lineups, starting pitchers, odds, weather (~2–3 min). On the GitHub page press the green Run workflow button, wait, then reload this page.">🔄 Pull fresh lineups</a>';var dh=D.dataHealth||{};var dhChip='';if(dh.sources){var ss=Object.keys(dh.sources).map(function(k){return dh.sources[k];});var okN=ss.filter(function(s){return s.status==='OK'||s.status==='N/A';}).length;var bad=ss.filter(function(s){return s.status==='MISSING';}),thin=ss.filter(function(s){return s.status==='THIN';});var col=bad.length?'#b91c1c':(thin.length?'#b45309':'var(--accent,#0c7a43)');var tip=ss.map(function(s){return s.label+': '+s.status+' '+(s.coverage==null?'':Math.round(s.coverage*100)+'%')+(s.note?' — '+s.note:'');}).join('\n');dhChip='<span style="font-weight:800;color:'+col+';cursor:help" title="'+esc(tip)+'" onclick="alert(this.getAttribute(\'title\'))">data '+okN+'/'+ss.length+' sources'+(bad.length?' · '+bad.length+' MISSING':(thin.length?' · '+thin.length+' thin':' OK'))+'</span>';}$('meta').innerHTML='<span>'+esc(D.date||'')+'</span><span>'+n+' games today</span><span>updated '+esc(upd)+'</span>'+ageChip+lu+dhChip+'<span>'+esc(D.version||'')+'</span>'+pull+'<button class="rf" onclick="refresh()">↻ Refresh</button>';$('foot').textContent='Model output presented as-is · '+esc(D.version||'')+' · click a player for the Statcast deep-dive · not financial advice';}
function renderMethod(){
  var mc="color:var(--muted);font-size:11.5px;line-height:1.65";
  var card="background:var(--panel2,#12161d);border:1px solid var(--line,#222);border-left:3px solid #4dc870;border-radius:8px;padding:12px 15px;margin:10px 0";
  var h="color:#4dc870;font-weight:700;font-size:13px;margin-bottom:5px";
  $('method').innerHTML=''+
  '<div style="max-width:840px;margin:0 auto">'+
  '<h2 style="color:#fff">How each pick is calculated</h2>'+
  '<p style="'+mc+';margin-bottom:6px">Plain-English summary of the live algorithms. These are explicit rule sets, not a trained model. Many thresholds are still being calibrated from real results — treat the numbers as a disciplined starting point, not a proven edge (measured CLV is roughly break-even).</p>'+

  '<div style="'+card+'"><div style="'+h+'">Moneyline (V3.3/V3.4)</div><p style="'+mc+'">'+
  'Start at 50% confidence, +4 if home. The biggest mover is the starting-pitcher gap: (opponent xERA − our xERA) × 4 — a much better starter is a big edge. Then subtract for warning signs (a bad last start, a 5+ game losing skid, being swept, an elite opposing starter, a top-10 opposing offense, a lockdown opposing bullpen) and add for tailwinds (facing elimination, an opposing starter due to regress, a fresh coaching change). Team form (R71) adds a small ±2 nudge for hot/cold teams — a tiebreaker, never a driver. '+
  'Then compare confidence to the price\'s implied odds: BET STRONG at 72%+ confidence with 5+ points of edge; LEAN at 63%+ with 5+ edge (or a big-edge underdog). Hard rules: never bet against the Yankees, never on a TBD starter.</p></div>'+

  '<div style="'+card+'"><div style="'+h+'">NRFI / YRFI — no/yes run in the 1st inning (V4)</div><p style="'+mc+'">'+
  'Blend both starting pitchers\' first-inning scores (xERA, strikeout & walk rates, recent form) — 55% of the score. Add both lineups\' first-inning offense — 25% — now driven by the on-base % of the batters actually hitting 1-2-3 in today\'s posted lineup (a weak or short-handed top of the order means fewer baserunners → better NRFI; before lineups post it falls back to a season team rating). Add the park\'s first-inning run factor — 15%. Then adjust for weather (cold air and wind blowing in favor NRFI; heat and wind blowing out favor YRFI), an elite-pitcher bonus, and a blow-up-risk penalty. 72+ = strong NRFI, very low = strong YRFI. Rain over 40% voids the game.</p></div>'+

  '<div style="'+card+'"><div style="'+h+'">Home Runs (V4.2)</div><p style="'+mc+'">'+
  'A 0–100 score from six pieces: the hitter\'s raw power (ISO, up to 20), how hittable the opposing starter is by xERA (up to 25), wind (up to 20 — out-and-hot is the jackpot, wind blowing in nearly zeroes it), the ballpark (15), where he bats in the order (10), and recent form (10) — plus a small pitch-matchup nudge. 85+ is Tier A, 75+ Tier B. Finally the score is turned into a fair probability and compared to the book\'s home-run price to show the edge.</p></div>'+

  '<div style="'+card+'"><div style="'+h+'">Hits — 1+ Hit / 2B+ (V3.1)</div><p style="'+mc+'">'+
  'Driven mostly by how hittable the opposing starter is (xERA, up to 30 — the single biggest factor). Then the hitter\'s own quality (up to 25 = batting avg × 50 + extra-base-hits-per-game × 20 + hits-per-game × 15), wind (up to 20, and it mainly matters for 2B+ where fly balls carry into gaps), batting-order slot (15, top-4 bats best for volume), and recent form (10). A cold streak overrides down.</p></div>'+

  '<div style="'+card+';border-left-color:#e8a030"><div style="'+h+';color:#e8a030">Parlay tickets (V-P4)</div><p style="'+mc+'">'+
  'Three tickets daily. <b>Ticket 1 — Safe Parlay</b> (max 3 legs, no HR): only 1+ hit, NRFI/YRFI ≥75%, and strong Over/Unders. It BANS 2+ total bases and 2+ hits+runs+RBI, which historically hit only ~45% and ~22% and were the recurring ticket-killers. <b>Tickets 2 & 3 — HR Top-2 and HR Lotto</b> (6-leg, correlated slugfests). '+
  'Two honesty layers sit on top: (1) a <b>calibration haircut</b> — the model overrates its most confident picks, so a raw 70–80% is treated as ~52–62% and anything 80%+ as 55% before it\'s ranked; 1+ hit is capped at its real ~72% rate. (2) a <b>price gate</b> — every leg shows a real sportsbook price and only positive-edge legs survive; player props post late, so unpriced legs are kept but flagged "verify price." The <b>Over rule (R72)</b>: an Over only qualifies with a wind boost AND a projection at least 1.5 runs above the line AND lineups that aren\'t cold. Legs are ordered most-to-least confident so you trim from the bottom.</p></div>'+

  '<p style="'+mc+';margin-top:10px;color:#777">The honest caveat: these rules reduce obvious mistakes and enforce discipline, but none of them has yet been proven to beat the closing line. The next real improvement is the weekly recalibration loop that re-derives these thresholds from settled results.</p>'+
  '</div>';
}

  var head='<div class="mx-head"><div class="mx-bat">'+hs(pid,true)+'<div><div class="mx-nm">'+esc(name)+'</div><div class="mx-sub">'+esc(team)+'</div></div></div>'
    +'<div class="mx-sub">vs</div>'
    +'<div class="mx-pit">'+(opp.id?hs(opp.id,true):'')+'<div><div class="mx-nm">'+esc(opp.name||'TBD')+'</div><div class="mx-sub">'+(opp.throws||'')+'HP'+(opp.arsenal?' &middot; '+esc(opp.arsenal):'')+(opp.fb_pct!=null?' &middot; '+opp.fb_pct+'% FB':'')+'</div></div></div></div>';
  var bars='';
  if(hr.iso!=null) bars+=mxBar('ISO',hr.iso*250,hr.iso.toFixed(3));
  if(hr.hr!=null) bars+=mxBar('Season HR',Math.min(100,hr.hr*4),hr.hr+'');
  if(hr.spXera!=null) bars+=mxBar('vs SP xERA',Math.min(100,hr.spXera*16),hr.spXera.toFixed(2));
  if(hit.avg!=null) bars+=mxBar('AVG',hit.avg*280,hit.avg.toFixed(3));
  if(hit.hpg!=null) bars+=mxBar('Hits/Game',hit.hpg*70,hit.hpg.toFixed(2));
  if(hit.xbh!=null) bars+=mxBar('XBH/Game',hit.xbh*120,(''+hit.xbh));
  if(hr.park) bars+=mxBar('Park',60,esc(hr.park).slice(0,14));
  if(hr.wind) bars+=mxBar('Wind',50,esc(hr.wind));
  var grade=mxGrade((hr.score||hit.score||55)/100);
  var thesis=esc(hr.note&&hr.note!=='NO_ODDS'?hr.note:('Matchup vs '+(opp.throws||'')+'HP '+(opp.name||'')+(opp.arsenal?' ('+opp.arsenal+')':'')+'. Model board score '+(hr.score||hit.score||'—')+'.'));
  var left='<div class="mx-grade"><div class="mx-gcirc"><div class="mx-gletter">'+grade+'</div></div><div class="mx-thesis">'+thesis+'</div></div>'
    +'<div class="mx-h2">Model Breakdown</div>'+(bars||'<div class="mx-sub">No model factors for this hitter.</div>')
    +'<div class="mx-h2">Prop Ratings</div><div id="mxProbs">'+mxProbs(pid)+'</div>';
  var right='<div id="mxRight"><div class="mx-h2">Loading Statcast &amp; arsenals…</div><div class="mx-loading">Pulling live Baseball Savant data…</div></div>';
  body.innerHTML=head+'<div class="mx-cols"><div>'+left+'</div><div>'+right+'</div></div>';
  mxLoadDetail(pid,opp,name);
}
function mxProbs(pid){
  var bf=(MODEL_DATA.boardsFull)||(MODEL_DATA.boards)||{};
  var defs=[['hr','HR'],['h1','1+ Hit'],['tb2','2+ TB'],['hrr','2+ HRR']];
  var rt={};defs.forEach(function(d){rt[d[0]]=rate10fn(bf[d[0]]||[],function(r){return r.metric;});});
  var rows=defs.map(function(d){var row=(bf[d[0]]||[]).filter(function(r){return r.playerId===pid;})[0];if(!row)return '';return '<tr><td>'+d[1]+'</td><td>'+ratePill(rt[d[0]](row.metric))+'</td><td>'+(row.metric!=null?row.metric:'—')+'</td></tr>';}).filter(Boolean).join('');
  return rows?'<table class="mx-tbl"><tr><th>Prop</th><th>Rating</th><th>Metric</th></tr>'+rows+'</table>':'<div class="mx-sub">Not on any board today.</div>';
}
async function mxLoadDetail(pid,opp,name){
  var R=document.getElementById('mxRight');if(!R)return;
  var html='';
  try{
    await mxEnsureArsenal();
    if(opp.id&&ARS_P[opp.id]){
      var pa=ARS_P[opp.id].slice().sort(function(a,b){return (+b.pitch_usage)-(+a.pitch_usage);});
      html+='<div class="mx-h2">'+esc(opp.name||'Pitcher')+' Arsenal (results allowed)</div><table class="mx-tbl"><tr><th>Pitch</th><th>Use%</th><th>BA</th><th>SLG</th><th>wOBA</th><th>Whiff%</th></tr>'+pa.map(function(r){return '<tr><td>'+esc(r.pitch_name)+'</td><td>'+Math.round(+r.pitch_usage)+'</td><td>'+(r.ba||'—')+'</td><td>'+(r.slg||'—')+'</td><td>'+(r.woba||'—')+'</td><td>'+(r.whiff_percent||'—')+'</td></tr>';}).join('')+'</table>';
    }
    if(ARS_B[pid]){
      var ba=ARS_B[pid].slice().sort(function(a,b){return (+b.pitch_usage)-(+a.pitch_usage);});
      html+='<div class="mx-h2">'+esc(name)+' vs Pitch Type</div><table class="mx-tbl"><tr><th>Pitch</th><th>Seen%</th><th>BA</th><th>SLG</th><th>wOBA</th><th>Whiff%</th></tr>'+ba.map(function(r){return '<tr><td>'+esc(r.pitch_name)+'</td><td>'+Math.round(+r.pitch_usage)+'</td><td>'+(r.ba||'—')+'</td><td>'+(r.slg||'—')+'</td><td>'+(r.woba||'—')+'</td><td>'+(r.whiff_percent||'—')+'</td></tr>';}).join('')+'</table>';
    }
  }catch(e){html+='<div class="mx-note">Arsenal data unavailable ('+e.message+')</div>';}
  try{
    var rows=await mxStatcast(pid);
    var bip=rows.filter(function(r){return r.launch_speed&&r.launch_speed!=='null';});
    html+=mxContact(bip)+mxZone(bip)+mxSpray(bip)+mxRecent(bip);
  }catch(e){html+='<div class="mx-note">Statcast unavailable ('+e.message+')</div>';}
  if(R)R.innerHTML=html||'<div class="mx-sub">No detail data.</div>';
}
var HITSET={single:1,double:1,triple:1,home_run:1};
function mxContact(bip){
  if(!bip.length)return '';
  var last=bip.slice(-14);
  var sq=last.map(function(r){var ev=+r.launch_speed;var c=ev>=98?'#34d399':ev>=90?'#fbbf24':'#f87171';return '<span class="mx-cqsq" style="background:'+c+'" title="'+ev+' mph"></span>';}).join('');
  var hh=bip.filter(function(r){return +r.launch_speed>=95;}).length;
  return '<div class="mx-h2">Contact Quality (last '+last.length+' BIP)</div><div class="mx-cq">'+sq+'</div><div class="mx-sub">Hard-hit '+Math.round(100*hh/bip.length)+'% &middot; avg EV '+(bip.reduce(function(a,r){return a+(+r.launch_speed);},0)/bip.length).toFixed(1)+' mph &middot; <span style="color:#34d399">98+</span> <span style="color:#fbbf24">90-97</span> <span style="color:#f87171">&lt;90</span></div>';
}
function mxZone(bip){
  var z={};bip.forEach(function(r){var n=+r.zone;if(n>=1&&n<=9){(z[n]=z[n]||{h:0,n:0});z[n].n++;if(HITSET[r.events])z[n].h++;}});
  var cells='';for(var i=1;i<=9;i++){var d=z[i];var rate=d&&d.n?d.h/d.n:null;var bg=rate==null?'#13283a':rate>=.35?'#34d399':rate>=.2?'#fbbf24':'#f87171';var lab=d&&d.n?(Math.round(100*rate)+'%'):'—';cells+='<div class="mx-zcell" style="background:'+bg+'">'+lab+'<span style="font-size:7px">'+(d?d.n:0)+' BIP</span></div>';}
  return '<div class="mx-h2">Strike-Zone Results (hit% by zone, catcher view)</div><div class="mx-zone">'+cells+'</div>';
}
function mxSpray(bip){
  var pts=bip.filter(function(r){return r.hc_x&&r.hc_y&&r.hc_x!=='null';});
  if(!pts.length)return '';
  var dot=pts.map(function(r){var x=(+r.hc_x);var y=(+r.hc_y);var col=r.events==='home_run'?'#f87171':HITSET[r.events]?'#34d399':'#64748b';return '<circle cx="'+x.toFixed(0)+'" cy="'+y.toFixed(0)+'" r="2.2" fill="'+col+'" opacity="0.8"/>';}).join('');
  return '<div class="mx-h2">Spray Chart ('+pts.length+' batted balls)</div><svg viewBox="0 0 250 230" style="width:100%;max-width:320px;display:block;margin:0 auto;background:#0a1626;border:1px solid rgba(34,211,238,.2);border-radius:10px"><path d="M125 205 L40 120 A120 120 0 0 1 210 120 Z" fill="rgba(34,211,238,.05)" stroke="rgba(34,211,238,.25)"/><line x1="125" y1="205" x2="40" y2="120" stroke="rgba(34,211,238,.25)"/><line x1="125" y1="205" x2="210" y2="120" stroke="rgba(34,211,238,.25)"/>'+dot+'<circle cx="125" cy="205" r="2.5" fill="#fbbf24"/></svg><div class="mx-sub" style="text-align:center"><span style="color:#f87171">HR</span> &middot; <span style="color:#34d399">hit</span> &middot; <span style="color:#64748b">out</span></div>';
}
function mxRecent(bip){
  if(!bip.length)return '';
  var rec=bip.slice(-9).reverse();
  var cards=rec.map(function(r){var ev=+r.launch_speed;var c=ev>=98?'#34d399':ev>=90?'#fbbf24':'#f87171';var res=(r.events||'').replace(/_/g,' ');return '<div class="mx-bbc"><div class="mx-bbev" style="color:'+c+'">'+ev.toFixed(0)+'</div><div class="mx-bbsub">'+(r.launch_angle||'?')+'° &middot; '+esc(res||'in play')+'</div></div>';}).join('');
  return '<div class="mx-h2">Recent Batted Balls (EV mph)</div><div class="mx-bb">'+cards+'</div>';
}

</script>
<script>
/* Odds freshness bar (V-P4, 2026-07-27): shows when odds were last pulled +
   API credits left, so a stale slate ("hit Refresh") is distinguishable from
   "books haven't posted props yet". Self-contained + defensive — never throws
   into the page; if D.odds is absent it degrades to the static hint. */
(function(){
  try{
    var el=document.getElementById('oddsfresh'); if(!el) return;
    var D=window.D||window.MODEL_DATA||{}; var o=D.odds||{};
    function ago(iso){
      if(!iso) return null;
      var m=(Date.now()-new Date(iso).getTime())/60000;
      if(isNaN(m)) return null;
      if(m<1) return 'just now';
      if(m<60) return Math.round(m)+'m ago';
      return Math.floor(m/60)+'h '+Math.round(m%60)+'m ago';
    }
    var parts=[];
    if(o.pulledAt) parts.push('odds pulled '+ago(o.pulledAt));
    else if(o.note) parts.push('odds: '+o.note);
    else parts.push('odds not pulled this run');
    if(o.remaining!=null) parts.push(o.remaining+' API credits left');
    if(o.pricedLegs!=null && o.totalLegs) parts.push(o.pricedLegs+'/'+o.totalLegs+' legs priced');
    parts.push('props post ~3–4h before first pitch');
    el.textContent=parts.join('  ·  ');
  }catch(e){}
})();
</script>
