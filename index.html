<script>
var DATA_URL="";
var D={}; try{ D=JSON.parse(document.getElementById('bb-data').textContent); }catch(e){ D={}; }
var MODEL_DATA=D; /* alias so the ported modal works unchanged */
var liveGames={};
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmtTime(iso){try{return new Date(iso).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});}catch(e){return '';}}
var TEAMS={108:['LAA','#BA0021'],109:['AZ','#A71930'],110:['BAL','#DF4601'],111:['BOS','#BD3039'],112:['CHC','#0E3386'],113:['CIN','#C6011F'],114:['CLE','#00385D'],115:['COL','#333366'],116:['DET','#0C2340'],117:['HOU','#EB6E1F'],118:['KC','#004687'],119:['LAD','#005A9C'],120:['WSH','#AB0003'],121:['NYM','#002D72'],133:['ATH','#003831'],134:['PIT','#27251F'],135:['SD','#2F241D'],136:['SEA','#0C2C56'],137:['SF','#FD5A1E'],138:['STL','#C41E3A'],139:['TB','#092C5C'],140:['TEX','#003278'],141:['TOR','#134A8E'],142:['MIN','#002B5C'],143:['PHI','#E81828'],144:['ATL','#CE1141'],145:['CWS','#27251F'],146:['MIA','#00A3E0'],147:['NYY','#0C2340'],158:['MIL','#12284B']};
var IDBYABBR={}; for(var k in TEAMS)IDBYABBR[TEAMS[k][0]]=k;
function teamLogo(abbr){var id=IDBYABBR[abbr];return id?'<img class="tlogo" src="https://midfield.mlbstatic.com/v1/team/'+id+'/spots/32" onerror="this.style.display=\'none\'" alt="">':'';}
function tb(abbr){return teamLogo(abbr);}
function hs(pid,small){return pid?'<img class="hs" src="https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:67:current.png/w_80,q_auto:best/v1/people/'+pid+'/headshot/67/current" onerror="this.style.display=\'none\'" alt="">':'';}
function rate10fn(rows,valFn){var vals=rows.map(valFn).filter(function(v){return v!=null;});if(!vals.length)return function(){return '—';};var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);return function(v){if(v==null)return '—';if(mx===mn)return '7.5';return (1+9*(v-mn)/(mx-mn)).toFixed(1);};}
function ratePill(r){var n=parseFloat(r);var c=isNaN(n)?'b-pass':n>=8?'b-strong':n>=6.5?'b-lean':'b-pass';return '<span class="badge '+c+'">'+r+'</span>';}
function teamsOf(gc){var p=(gc.game||'').split('@');return {away:(gc.away_sp&&gc.away_sp.team)||p[0]||'AWY',home:(gc.home_sp&&gc.home_sp.team)||p[1]||'HOM'};}
function gameLabelByPk(pk){var c=(D.gameCards||[]).filter(function(x){return x.gamePk===pk;})[0];if(c&&c.game)return c.game;var m=(D.ml||[]).filter(function(x){return x.gamePk===pk;})[0];return m?(m.away+'@'+m.home):'';}
function legDesc(l){var d=l.desc||'';if((l.betType==='over'||l.betType==='under')){var g=gameLabelByPk(l.gamePk);if(g&&d.indexOf(g)<0)d=g+' '+d;}return d;}
function tierBadge(t){t=(t||'').toUpperCase();var c=t==='STRONG'?'b-strong':t==='LEAN'?'b-lean':'b-pass';return '<span class="badge '+c+'">'+esc(t||'—')+'</span>';}
function handBadge(t){if(!t)return '';var c=t==='L'?'b-loss':'b-strong';return '<span class="badge '+c+'">'+esc(t)+'HP</span>';}
function spTierBadge(tier){if(!tier)return '';var t=(''+tier).toUpperCase();var c=(t.indexOf('ELITE')>=0||t.indexOf('GOOD')>=0)?'b-strong':(t.indexOf('POOR')>=0||t.indexOf('BELOW')>=0||t.indexOf('BAD')>=0)?'b-loss':'b-pass';return '<span class="badge '+c+'">'+esc(tier)+'</span>';}
function windArrows(z){if(!z||!z.length)return '';var A={out:['⬆','var(--accent)'],in:['⬇','var(--lose)'],cross:['⬌','var(--draw)']};return '<div class="wind">'+z.map(function(w){var a=A[w.dir]||['·','var(--muted)'];return '<span class="wz"><span class="wzl">'+esc(w.zone)+'</span><span class="wza" style="color:'+a[1]+'">'+a[0]+'</span><span class="wzm">'+w.mph+'</span></span>';}).join('')+'</div>';}

function gameProps(pk){var bf=D.boardsFull||D.boards||{};var out=[];[['hr','HR'],['h1','1+H'],['h2','2B'],['tb2','2TB'],['hrr','HRR']].forEach(function(d){(bf[d[0]]||[]).filter(function(r){return r.gamePk===pk;}).slice(0,2).forEach(function(r){out.push({lbl:d[1],name:r.name,team:r.team,pid:r.playerId,gp:r.gamePk,metric:r.metric});});});return out;}
function renderSlate(){
  var gc=D.gameCards||[];
  if(!gc.length){$('slate').innerHTML='<div class="empty">No games in today’s slate.</div>';return;}
  $('slate').innerHTML='<div class="grid">'+gc.map(function(g){
    var tm=teamsOf(g),pick=g.pick,conf=g.conf,awayFav=pick===tm.away;
    var aPct=conf==null?50:(awayFav?conf:100-conf),hPct=100-aPct;
    var ar=(g.away_runs!=null)?g.away_runs:'—',hr=(g.home_runs!=null)?g.home_runs:'—';
    var asp=g.away_sp||{},hspx=g.home_sp||{};
    var lu=g.lineups_official?'<span class="badge b-strong">✓ LINEUP</span>':'<span class="badge b-pass">⏳ PROJ</span>';
    var gp=gameProps(g.gamePk);
    var gpHtml=gp.length?('<details class="gprops"><summary>Best props in this game ('+gp.length+')</summary><div class="pl-legs">'+gp.map(function(x){var oc=x.pid?' onclick="openMatchupModal('+x.pid+','+x.gp+',&quot;'+esc(x.name).replace(/&quot;|"/g,'')+'&quot;,&quot;'+esc(x.team||'')+'&quot;)" style="cursor:pointer;color:var(--accent2)"':'';return '<div class="pl-leg"><span class="badge b-rank">'+x.lbl+'</span> <span'+oc+'>'+esc(x.name)+'</span> <span class="unit">'+(x.metric!=null?x.metric:'')+'</span></div>';}).join('')+'</div></details>'):'';
    return '<div class="card game">'
      +'<div class="card-h"><span>'+esc(tm.away)+' @ '+esc(tm.home)+'</span><span class="t">'+esc(fmtTime(g.time))+'</span></div>'
      +'<div class="card-b">'
        +'<div class="teams">'
          +'<div class="team'+(awayFav&&pick?' fav':'')+'">'+teamLogo(tm.away)+'<span class="abbr">'+esc(tm.away)+'</span>'+(g.lineups_official?'<span class="luok" title="Lineup confirmed">✓</span>':'')+'<span class="nm">'+esc(asp.name||'')+' '+handBadge(asp.throws)+spTierBadge(asp.tier)+'</span><span class="rs">'+ar+'</span></div>'
          +'<div class="team'+(!awayFav&&pick?' fav':'')+'">'+teamLogo(tm.home)+'<span class="abbr">'+esc(tm.home)+'</span>'+(g.lineups_official?'<span class="luok" title="Lineup confirmed">✓</span>':'')+'<span class="nm">'+esc(hspx.name||'')+' '+handBadge(hspx.throws)+spTierBadge(hspx.tier)+'</span><span class="rs">'+hr+'</span></div>'
        +'</div>'
        +'<div class="probbar"><i style="width:'+aPct.toFixed(0)+'%;background:var(--accent)"></i><i style="width:'+hPct.toFixed(0)+'%;background:var(--lose)"></i></div>'
        +'<div class="probrow"><span>'+esc(tm.away)+' '+aPct.toFixed(0)+'%</span><span>'+hPct.toFixed(0)+'% '+esc(tm.home)+'</span></div>'
        +windArrows(g.wind_zones)
        +'<div class="subrow"><span>'+(g.temp!=null?'🌡 '+g.temp+'°F':'')+(g.venue?' · '+esc(g.venue):'')+'</span><span>PEN '+(g.away_pen!=null?g.away_pen:'—')+'/'+(g.home_pen!=null?g.home_pen:'—')+'</span></div>'
        +'<div class="pickline">PICK: <b>'+esc(pick||'—')+'</b> '+tierBadge(g.tier)+(conf!=null?'<span class="badge b-rank">'+conf+'% CONF</span>':'')+(g.total!=null?'<span class="badge b-pass">O/U '+g.total+'</span>':'')+lu+'</div>'
        +gpHtml
      +'</div></div>';
  }).join('')+'</div>';
}

function renderMatchups(){
  var gc=D.gameCards||[];var mlByPk={};(D.ml||[]).forEach(function(m){mlByPk[m.gamePk]=m;});
  var ouByPk={};((D.boardsFull||{}).ou||[]).forEach(function(o){ouByPk[o.gamePk]=o;});
  var nrByPk={};(D.nrfi||[]).forEach(function(n){nrByPk[n.gamePk]=n;});
  if(!gc.length){$('matchups').innerHTML='<div class="empty">No matchups.</div>';return;}
  $('matchups').innerHTML='<div class="grid">'+gc.map(function(g){
    var tm=teamsOf(g),m=mlByPk[g.gamePk]||{},ou=ouByPk[g.gamePk]||{},nf=nrByPk[g.gamePk]||{};
    function spL(sp){if(!sp)return '';return '<div class="sp"><b>'+esc(sp.name||'TBD')+'</b> '+handBadge(sp.throws)+' '+spTierBadge(sp.tier)+'<div class="arse">xERA '+(sp.xera!=null?sp.xera:'—')+' · ERA '+(sp.era!=null?sp.era:'—')+' · K9 '+(sp.k9!=null?sp.k9:'—')+(sp.arsenal?' · '+esc(sp.arsenal):'')+'</div></div>';}
    var kv='';
    if(m.team)kv+='<div class="kv"><span class="k">ML pick</span><span class="v">'+esc(m.team)+' '+tierBadge(m.tier)+'</span></div>';
    if(m.odds)kv+='<div class="kv"><span class="k">Odds</span><span class="v">'+esc(m.odds)+'</span></div>';
    if(m.conf!=null)kv+='<div class="kv"><span class="k">Conf / implied / edge</span><span class="v">'+m.conf+'% / '+(m.implied!=null?m.implied+'%':'—')+' / '+(m.edge!=null?(m.edge>0?'+':'')+m.edge:'—')+'</span></div>';
    if(g.away_runs!=null)kv+='<div class="kv"><span class="k">Proj runs</span><span class="v">'+esc(tm.away)+' '+g.away_runs+' · '+esc(tm.home)+' '+g.home_runs+'</span></div>';
    if(ou.proj!=null){var lb=ou.lean==='OVER'?'b-over':ou.lean==='UNDER'?'b-under':'b-pass';kv+='<div class="kv"><span class="k">Total proj/line</span><span class="v">'+ou.proj+' vs '+ou.line+' <span class="badge '+lb+'">'+esc(ou.lean||'')+'</span></span></div>';}
    if(nf.tier)kv+='<div class="kv"><span class="k">NRFI/YRFI</span><span class="v">'+esc(nf.bet||nf.tier)+(nf.pComb!=null?' ('+nf.pComb+'%)':'')+'</span></div>';
    if(g.away_pen!=null)kv+='<div class="kv"><span class="k">Bullpen ERA</span><span class="v">'+esc(tm.away)+' '+g.away_pen+' · '+esc(tm.home)+' '+g.home_pen+'</span></div>';
    var fac=(m.rules&&m.rules.length)?'<div class="note"><b>Factors:</b> '+esc(m.rules.join(', '))+'</div>':(m.note?'<div class="note">'+esc(m.note)+'</div>':'');
    return '<div class="card"><div class="card-h"><span>'+teamLogo(tm.away)+' '+esc(tm.away)+' @ '+esc(tm.home)+' '+teamLogo(tm.home)+'</span><span class="t">'+esc(g.venue||'')+'</span></div><div class="card-b">'+spL(g.away_sp)+spL(g.home_sp)+windArrows(g.wind_zones)+'<div style="margin-top:8px">'+kv+'</div>'+fac+'</div></div>';
  }).join('')+'</div>';
}

var PROP_SQ=[['hr','HR','⚾'],['h1','1+ Hit','🎯'],['h2','2B','↔'],['tb2','2+ TB','💥'],['hrr','2+ HRR','🔢'],['nrfi','NRFI/YRFI','🅾'],['ou','Over/Under','📊'],['ml','Moneyline','💰'],['spread','Spread','📏']];
function propCount(k){var bf=D.boardsFull||D.boards||{};if(k==='nrfi')return (D.nrfi||[]).length;if(k==='ou')return (bf.ou||[]).length;if(k==='ml')return (D.ml||[]).filter(function(p){return p.tier==='STRONG'||p.tier==='LEAN';}).length;if(k==='spread')return (D.gameCards||[]).length;return (bf[k]||[]).length;}
function renderProps(){
  var sq=PROP_SQ.map(function(d){var n=propCount(d[0]);var sub=d[0]==='ml'?(n+' actionable'):d[0]==='spread'?(n+' games'):(n+' picks');return '<div class="psq" onclick="openProp(\''+d[0]+'\',this)"><div class="ic">'+d[2]+'</div><div class="lb">'+d[1]+'</div><div class="ct">'+sub+'</div></div>';}).join('');
  $('props').innerHTML='<div class="prop-grid">'+sq+'</div><div class="card"><div id="propPanel"></div></div>';
  openProp('hr');
}
function openProp(k,btn){
  var sqs=document.querySelectorAll('#props .psq');for(var i=0;i<sqs.length;i++)sqs[i].classList.remove('on');
  if(btn){btn.classList.add('on');}else{for(var j=0;j<sqs.length;j++){if((sqs[j].getAttribute('onclick')||'').indexOf("'"+k+"'")>=0)sqs[j].classList.add('on');}}
  var bf=D.boardsFull||D.boards||{},p=$('propPanel');
  if(k==='nrfi'){p.innerHTML=(D.nrfi||[]).map(function(r){var c=(''+r.tier).indexOf('STRONG')>=0?'b-strong':'b-pass';return '<div class="prow"><span class="pnm" style="cursor:default">'+esc(r.away)+' @ '+esc(r.home)+'</span><span class="badge '+c+'">'+esc(r.bet||r.tier)+'</span><span class="pmetric">'+(r.pComb!=null?r.pComb+'<span class="unit">%</span>':'')+'</span></div>';}).join('')||'<div class="empty">No NRFI data.</div>';return;}
  if(k==='ou'){p.innerHTML=(bf.ou||[]).map(function(o){var lb=o.lean==='OVER'?'b-over':o.lean==='UNDER'?'b-under':'b-pass';return '<div class="prow"><span class="pnm" style="cursor:default">'+esc(o.game)+'</span><span class="badge '+lb+'">'+esc(o.lean||'')+'</span><span class="pmetric">'+o.proj+'<span class="unit"> vs '+o.line+'</span></span></div>';}).join('')||'<div class="empty">No O/U data.</div>';return;}
  if(k==='ml'){var ml=(D.ml||[]).slice().sort(function(a,b){return (b.edge==null?-99:b.edge)-(a.edge==null?-99:a.edge);});p.innerHTML=ml.map(function(m){var tm=m.team||(m.pickSide==='home'?m.home:m.away);var c=m.tier==='STRONG'?'b-strong':m.tier==='LEAN'?'b-lean':'b-pass';return '<div class="prow"><span class="pnm" style="cursor:default;display:flex;gap:6px;align-items:center">'+teamLogo(tm)+'<b>'+esc(tm)+'</b><span class="ptm">'+esc(m.away)+'@'+esc(m.home)+'</span></span><span class="badge '+c+'">'+esc(m.tier)+'</span><span class="pmetric">'+(m.conf!=null?m.conf+'%':'')+'</span></div>';}).join('');return;}

  var unit={h2:'2B/G',tb2:'TB/G',hrr:'H+R+RBI/G'}[k]||'score';

function amDec(a){return a>=0?1+a/100:1+100/(-a);}
function decToAm(d){return d>=2?('+'+Math.round((d-1)*100)):('-'+Math.round(100/(d-1)));}
function fairAmNum(p){p=Math.max(.05,Math.min(.95,p||.5));return p>=.5?-Math.round(100*p/(1-p)):Math.round(100*(1-p)/p);}
function amStr(a){return a>=0?'+'+a:''+a;}
function renderPicks(){

var TP_WORK=null;
function legTierInfo(l){
  var bf=D.boardsFull||D.boards||{};var map={hit:'h1','2tb':'tb2',hrr:'hrr',hr:'hr','2b':'h2'};
  if(l.betType==='ml'){var m=(D.ml||[]).filter(function(p){return p.gamePk===l.gamePk&&p.team===l.team;})[0];var t=m&&m.tier;return t==='STRONG'?['STRONG','b-strong']:t==='LEAN'?['LEAN','b-lean']:['WEAK','b-pass'];}
  if(l.betType==='over'){var ou=(bf.ou||[]).filter(function(o){return o.gamePk===l.gamePk;})[0];var e=ou?((ou.proj||0)-(ou.line||0)):0;return e>=1?['STRONG','b-strong']:e>=.4?['LEAN','b-lean']:['WEAK','b-pass'];}
  var bk=map[l.betType];if(bk){var bd=bf[bk]||[];var rt=rate10fn(bd,function(r){return r.metric;});var row=bd.filter(function(r){return r.playerId===l.playerId;})[0];if(row){var rg=parseFloat(rt(row.metric));return rg>=8?['STRONG','b-strong']:rg>=6.5?['LEAN','b-lean']:['WEAK','b-pass'];}}
  return (l.prob||0)>=.6?['LEAN','b-lean']:['WEAK','b-pass'];
}
function tpCandidates(){
  var bf=D.boardsFull||D.boards||{};var out=[];
  (D.ml||[]).forEach(function(p){if(p.tier==='STRONG'||p.tier==='LEAN'){out.push({desc:(p.team||'')+' ML ('+p.tier+')',betType:'ml',gamePk:p.gamePk,team:p.team,prob:(p.conf||55)/100});}});
  (bf.ou||[]).forEach(function(o){if(o.lean==='OVER'){out.push({desc:(gameLabelByPk(o.gamePk)||'Game')+' Over '+o.line+' (proj '+o.proj+')',betType:'over',gamePk:o.gamePk,line:o.line,prob:Math.min(.62,.5+(((o.proj||0)-(o.line||0)))*.04)});}});
  var P=[['hr','HR','hr',function(m){return Math.min(.30,(m||50)/250);}],['h1','1+ hit','hit',function(m){return Math.min(.85,(m||60)/100);}],['tb2','2+ total bases','2tb',function(m){return .40;}],['hrr','2+ hits/runs/RBI','hrr',function(m){return .42;}]];
  P.forEach(function(d){(bf[d[0]]||[]).slice(0,15).forEach(function(r){out.push({desc:r.name+' '+d[1],betType:d[2],gamePk:r.gamePk,playerId:r.playerId,team:r.team,prob:d[3](r.metric)});});});

function tpRecalc(){var inputs=[].slice.call(document.querySelectorAll('#parlay .leg-od'));if(!inputs.length)return;var SGP=.62,byG={};inputs.forEach(function(i){var g=i.dataset.game;(byG[g]=byG[g]||[]).push(i);});var dec=1;Object.keys(byG).forEach(function(g){var arr=byG[g],gd=1;arr.forEach(function(i){var a=parseFloat(i.value);gd*=isNaN(a)?1:amDec(a);});dec*=arr.length>=2?(1+(gd-1)*SGP):gd;});inputs.forEach(function(i){var a=parseFloat(i.value);var mp=parseFloat(i.dataset.prob);var ev=document.getElementById(i.dataset.ev);if(isNaN(a)){i.classList.remove('odbad');if(ev)ev.textContent='';return;}var imp=a<0?(-a)/(-a+100):100/(a+100);if(imp-mp>.07){i.classList.add('odbad');if(ev){ev.textContent='−EV';ev.style.color='var(--lose)';}}else{i.classList.remove('odbad');if(ev)ev.textContent='';}});var pay=$('tpPay');if(pay)pay.innerHTML='<b>Combined '+decToAm(dec)+'</b> · ≈'+(100/dec).toFixed(1)+'% to hit · $10→$'+Math.round(10*dec).toLocaleString()+' · $100→$'+Math.round(100*dec).toLocaleString()+'. Edit any leg to your book price; red −EV = book more confident than model. Same-game legs get a 0.62 correlation discount.';}

  var sugg='<div class="card"><div class="card-h"><span>⭐ Suggested Parlay</span><span class="t">'+legs.length+' legs</span></div><div class="card-b">'
    +(tp.note?'<div class="note" style="margin:0 0 10px;padding:0">⚙ '+esc(tp.note)+'</div>':'')

  var form='<div class="card"><div class="card-h">🛠 Build Your Own Parlay</div><div class="card-b"><div class="byo">'
    +BYO.map(function(b){return '<label class="byoin">'+b[1]+'<input type="number" id="byo-'+b[0]+'" min="0" max="8" value="'+b[2]+'"></label>';}).join('')
    +'<button class="rf" onclick="buildCustom()">⚡ Generate</button></div><div id="byoResult"><div class="note" style="padding:0">Set how many of each prop type, then Generate. Best available legs from today’s boards (no duplicate players).</div></div></div></div>';
  $('parlay').innerHTML=sugg+form; tpRecalc();

function buildCustom(){

function mxYear(){return (MODEL_DATA.date||'2026').slice(0,4);}
async function mxEnsureArsenal(){if(ARS_P&&ARS_B)return;var b='https://baseballsavant.mlb.com/leaderboard/pitch-arsenal-stats?year='+mxYear()+'&min=5&hand=&csv=true&type=';var res=await Promise.all([mxText(b+'pitcher'),mxText(b+'batter')]);var idx=function(rows){var m={};rows.forEach(function(r){var id=r.player_id;(m[id]=m[id]||[]).push(r);});return m;};ARS_P=idx(mxCSV(res[0]));ARS_B=idx(mxCSV(res[1]));}
async function mxStatcast(pid){if(SC_CACHE[pid])return SC_CACHE[pid];var y=mxYear();var u='https://baseballsavant.mlb.com/statcast_search/csv?all=true&type=details&player_type=batter&batters_lookup%5B%5D='+pid+'&game_date_gt='+y+'-03-01&game_date_lt='+y+'-12-01&min_pitches=0&min_results=0';var rows=mxCSV(await mxText(u));SC_CACHE[pid]=rows;return rows;}
function mxGrade(p){p=p==null?0:p;return p>=.85?'A+':p>=.72?'A':p>=.6?'B+':p>=.48?'B':p>=.36?'C+':'C';}
function mxBar(label,pct,valTxt){pct=Math.max(2,Math.min(100,pct));return '<div class="mx-bar"><span class="mx-blab">'+label+'</span><span class="mx-btrack"><span class="mx-bfill" style="width:'+pct+'%"></span></span><span class="mx-bval">'+valTxt+'</span></div>';}
function closeMatchupModal(){document.getElementById('mxOverlay').style.display='none';}
function mxGc(pk){return ((MODEL_DATA.gameCards)||[]).filter(function(c){return c.gamePk===pk;})[0]||{};}
function mxOppSP(c,team){if(c.away_sp&&c.away_sp.team===team)return c.home_sp;if(c.home_sp&&c.home_sp.team===team)return c.away_sp;return null;}
function openMatchupModal(pid,gamePk,name,team){
  var ov=document.getElementById('mxOverlay');var body=document.getElementById('mxBody');ov.style.display='block';window.scrollTo(0,0);
  var c=mxGc(gamePk);var opp=mxOppSP(c,team)||{};
  var hr=((MODEL_DATA.hrProps)||[]).filter(function(x){return x.playerId===pid;})[0]||{};
  var hit=((MODEL_DATA.hitProps)||[]).filter(function(x){return x.playerId===pid;})[0]||{};
  var head='<div class="mx-head"><div class="mx-bat">'+hs(pid,true)+'<div><div class="mx-nm">'+esc(name)+'</div><div class="mx-sub">'+esc(team)+'</div></div></div>'
    +'<div class="mx-sub">vs</div>'
    +'<div class="mx-pit">'+(opp.id?hs(opp.id,true):'')+'<div><div class="mx-nm">'+esc(opp.name||'TBD')+'</div><div class="mx-sub">'+(opp.throws||'')+'HP'+(opp.arsenal?' &middot; '+esc(opp.arsenal):'')+(opp.fb_pct!=null?' &middot; '+opp.fb_pct+'% FB':'')+'</div></div></div></div>';
  var bars='';
  if(hr.iso!=null) bars+=mxBar('ISO',hr.iso*250,hr.iso.toFixed(3));
  if(hr.hr!=null) bars+=mxBar('Season HR',Math.min(100,hr.hr*4),hr.hr+'');
  if(hr.spXera!=null) bars+=mxBar('vs SP xERA',Math.min(100,hr.spXera*16),hr.spXera.toFixed(2));
  if(hit.avg!=null) bars+=mxBar('AVG',hit.avg*280,hit.avg.toFixed(3));
  if(hit.hpg!=null) bars+=mxBar('Hits/Game',hit.hpg*70,hit.hpg.toFixed(2));
  if(hit.xbh!=null) bars+=mxBar('XBH/Game',hit.xbh*120,(''+hit.xbh));
  if(hr.park) bars+=mxBar('Park',60,esc(hr.park).slice(0,14));
  if(hr.wind) bars+=mxBar('Wind',50,esc(hr.wind));
  var grade=mxGrade((hr.score||hit.score||55)/100);
  var thesis=esc(hr.note&&hr.note!=='NO_ODDS'?hr.note:('Matchup vs '+(opp.throws||'')+'HP '+(opp.name||'')+(opp.arsenal?' ('+opp.arsenal+')':'')+'. Model board score '+(hr.score||hit.score||'—')+'.'));
  var left='<div class="mx-grade"><div class="mx-gcirc"><div class="mx-gletter">'+grade+'</div></div><div class="mx-thesis">'+thesis+'</div></div>'
    +'<div class="mx-h2">Model Breakdown</div>'+(bars||'<div class="mx-sub">No model factors for this hitter.</div>')
    +'<div class="mx-h2">Prop Ratings</div><div id="mxProbs">'+mxProbs(pid)+'</div>';
  var right='<div id="mxRight"><div class="mx-h2">Loading Statcast &amp; arsenals…</div><div class="mx-loading">Pulling live Baseball Savant data…</div></div>';
  body.innerHTML=head+'<div class="mx-cols"><div>'+left+'</div><div>'+right+'</div></div>';
  mxLoadDetail(pid,opp,name);
}
function mxProbs(pid){
  var bf=(MODEL_DATA.boardsFull)||(MODEL_DATA.boards)||{};
  var defs=[['hr','HR'],['h1','1+ Hit'],['h2','2B'],['tb2','2+ TB'],['hrr','2+ HRR']];
  var rt={};defs.forEach(function(d){rt[d[0]]=rate10fn(bf[d[0]]||[],function(r){return r.metric;});});
  var rows=defs.map(function(d){var row=(bf[d[0]]||[]).filter(function(r){return r.playerId===pid;})[0];if(!row)return '';return '<tr><td>'+d[1]+'</td><td>'+ratePill(rt[d[0]](row.metric))+'</td><td>'+(row.metric!=null?row.metric:'—')+'</td></tr>';}).filter(Boolean).join('');
  return rows?'<table class="mx-tbl"><tr><th>Prop</th><th>Rating</th><th>Metric</th></tr>'+rows+'</table>':'<div class="mx-sub">Not on any board today.</div>';
}
async function mxLoadDetail(pid,opp,name){
  var R=document.getElementById('mxRight');if(!R)return;
  var html='';
  try{
    await mxEnsureArsenal();
    if(opp.id&&ARS_P[opp.id]){
      var pa=ARS_P[opp.id].slice().sort(function(a,b){return (+b.pitch_usage)-(+a.pitch_usage);});
      html+='<div class="mx-h2">'+esc(opp.name||'Pitcher')+' Arsenal (results allowed)</div><table class="mx-tbl"><tr><th>Pitch</th><th>Use%</th><th>BA</th><th>SLG</th><th>wOBA</th><th>Whiff%</th></tr>'+pa.map(function(r){return '<tr><td>'+esc(r.pitch_name)+'</td><td>'+Math.round(+r.pitch_usage)+'</td><td>'+(r.ba||'—')+'</td><td>'+(r.slg||'—')+'</td><td>'+(r.woba||'—')+'</td><td>'+(r.whiff_percent||'—')+'</td></tr>';}).join('')+'</table>';
    }
    if(ARS_B[pid]){
      var ba=ARS_B[pid].slice().sort(function(a,b){return (+b.pitch_usage)-(+a.pitch_usage);});
      html+='<div class="mx-h2">'+esc(name)+' vs Pitch Type</div><table class="mx-tbl"><tr><th>Pitch</th><th>Seen%</th><th>BA</th><th>SLG</th><th>wOBA</th><th>Whiff%</th></tr>'+ba.map(function(r){return '<tr><td>'+esc(r.pitch_name)+'</td><td>'+Math.round(+r.pitch_usage)+'</td><td>'+(r.ba||'—')+'</td><td>'+(r.slg||'—')+'</td><td>'+(r.woba||'—')+'</td><td>'+(r.whiff_percent||'—')+'</td></tr>';}).join('')+'</table>';
    }
  }catch(e){html+='<div class="mx-note">Arsenal data unavailable ('+e.message+')</div>';}
  try{
    var rows=await mxStatcast(pid);
    var bip=rows.filter(function(r){return r.launch_speed&&r.launch_speed!=='null';});
    html+=mxContact(bip)+mxZone(bip)+mxSpray(bip)+mxRecent(bip);
  }catch(e){html+='<div class="mx-note">Statcast unavailable ('+e.message+')</div>';}
  if(R)R.innerHTML=html||'<div class="mx-sub">No detail data.</div>';
}
var HITSET={single:1,double:1,triple:1,home_run:1};
function mxContact(bip){
  if(!bip.length)return '';
  var last=bip.slice(-14);
  var sq=last.map(function(r){var ev=+r.launch_speed;var c=ev>=98?'#34d399':ev>=90?'#fbbf24':'#f87171';return '<span class="mx-cqsq" style="background:'+c+'" title="'+ev+' mph"></span>';}).join('');
  var hh=bip.filter(function(r){return +r.launch_speed>=95;}).length;
  return '<div class="mx-h2">Contact Quality (last '+last.length+' BIP)</div><div class="mx-cq">'+sq+'</div><div class="mx-sub">Hard-hit '+Math.round(100*hh/bip.length)+'% &middot; avg EV '+(bip.reduce(function(a,r){return a+(+r.launch_speed);},0)/bip.length).toFixed(1)+' mph &middot; <span style="color:#34d399">98+</span> <span style="color:#fbbf24">90-97</span> <span style="color:#f87171">&lt;90</span></div>';
}
function mxZone(bip){
  var z={};bip.forEach(function(r){var n=+r.zone;if(n>=1&&n<=9){(z[n]=z[n]||{h:0,n:0});z[n].n++;if(HITSET[r.events])z[n].h++;}});
  var cells='';for(var i=1;i<=9;i++){var d=z[i];var rate=d&&d.n?d.h/d.n:null;var bg=rate==null?'#13283a':rate>=.35?'#34d399':rate>=.2?'#fbbf24':'#f87171';var lab=d&&d.n?(Math.round(100*rate)+'%'):'—';cells+='<div class="mx-zcell" style="background:'+bg+'">'+lab+'<span style="font-size:7px">'+(d?d.n:0)+' BIP</span></div>';}
  return '<div class="mx-h2">Strike-Zone Results (hit% by zone, catcher view)</div><div class="mx-zone">'+cells+'</div>';
}
function mxSpray(bip){
  var pts=bip.filter(function(r){return r.hc_x&&r.hc_y&&r.hc_x!=='null';});
  if(!pts.length)return '';
  var dot=pts.map(function(r){var x=(+r.hc_x);var y=(+r.hc_y);var col=r.events==='home_run'?'#f87171':HITSET[r.events]?'#34d399':'#64748b';return '<circle cx="'+x.toFixed(0)+'" cy="'+y.toFixed(0)+'" r="2.2" fill="'+col+'" opacity="0.8"/>';}).join('');
  return '<div class="mx-h2">Spray Chart ('+pts.length+' batted balls)</div><svg viewBox="0 0 250 230" style="width:100%;max-width:320px;display:block;margin:0 auto;background:#0a1626;border:1px solid rgba(34,211,238,.2);border-radius:10px"><path d="M125 205 L40 120 A120 120 0 0 1 210 120 Z" fill="rgba(34,211,238,.05)" stroke="rgba(34,211,238,.25)"/><line x1="125" y1="205" x2="40" y2="120" stroke="rgba(34,211,238,.25)"/><line x1="125" y1="205" x2="210" y2="120" stroke="rgba(34,211,238,.25)"/>'+dot+'<circle cx="125" cy="205" r="2.5" fill="#fbbf24"/></svg><div class="mx-sub" style="text-align:center"><span style="color:#f87171">HR</span> &middot; <span style="color:#34d399">hit</span> &middot; <span style="color:#64748b">out</span></div>';
}
function mxRecent(bip){
  if(!bip.length)return '';
  var rec=bip.slice(-9).reverse();
  var cards=rec.map(function(r){var ev=+r.launch_speed;var c=ev>=98?'#34d399':ev>=90?'#fbbf24':'#f87171';var res=(r.events||'').replace(/_/g,' ');return '<div class="mx-bbc"><div class="mx-bbev" style="color:'+c+'">'+ev.toFixed(0)+'</div><div class="mx-bbsub">'+(r.launch_angle||'?')+'° &middot; '+esc(res||'in play')+'</div></div>';}).join('');
  return '<div class="mx-h2">Recent Batted Balls (EV mph)</div><div class="mx-bb">'+cards+'</div>';
}

</script>
</body>
